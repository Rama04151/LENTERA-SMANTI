<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Guru - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(251, 192, 45, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .login-role {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-role-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
      background: rgba(251, 192, 45, 0.1);
      width: 80px;
      height: 80px;
      line-height: 80px;
      border-radius: 20px;
      border: 1px solid rgba(251, 192, 45, 0.2);
    }

    .login-role h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .login-role p {
      margin-top: 4px;
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: -10px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-button:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 192, 45, 0.4);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-message {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      font-weight: 600;
    }

    .login-message.error {
      color: var(--danger-color);
    }

    .login-message.success {
      color: var(--success-color);
    }
  </style>

</head>

<body>

  <main class="container">

    <section class="card">

      <div class="login-role">

        <div class="login-role-icon">
          👨‍🏫
        </div>

        <h1>
          LENTERA SMANTI
        </h1>

        <p>
          Panel Guru
        </p>

      </div>


      <form id="guruLoginForm">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Masukkan username"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukkan password"
          required
        >


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          👨‍🏫 Masuk sebagai Guru
        </button>

      </form>


      <p
        id="loginMessage"
        class="login-message"
      ></p>

    </section>

  </main>


  <script src="guru-login.js"></script>

</body>

</html>
