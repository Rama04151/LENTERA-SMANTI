<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekap Poin - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --input-bg: #0f1935;
      --accent-gold: #fbc02d;
      --accent-gold-dark: #d48806;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255,255,255,.08);
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;

      background-image:
        radial-gradient(
          circle at 10% 10%,
          rgba(251,192,45,.06),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(28,37,65,.7),
          transparent 45%
        );
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      margin-bottom: 18px;
    }

    /* ================= HEADER ================= */

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent-gold),
          var(--accent-gold-dark)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--bg-dark);
      font-size: 22px;
      font-weight: 800;

      box-shadow:
        0 4px 15px rgba(251,192,45,.25);
    }

    .header-title h1 {
      font-size: 21px;
      font-weight: 800;
    }

    .header-title p {
      margin-top: 3px;
      font-size: 12px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .back-button {
      margin-left: auto;
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    /* ================= FILTER ================= */

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1/-1;
    }

    .field label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: #fff;
      outline: none;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color: rgba(251,192,45,.65);
    }

    select option {
      background: #1c2541;
      color: #fff;
    }

    /* ================= BUTTON ================= */

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {

    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          var(--accent-gold),
          var(--accent-gold-dark)
        );
      color: var(--bg-dark);
    }

    .btn-success {
      background: #166534;
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border-color);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.25);
      color: #f87171;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ================= SUMMARY ================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      gap: 12px;
    }

    .summary-card {
      background: rgba(11,19,43,.55);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 16px;
    }

    .summary-card span {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .summary-card strong {
      display: block;
      margin-top: 6px;
      color: var(--accent-gold);
      font-size: 21px;
      font-weight: 800;
    }

    /* ================= SECTION ================= */

    .section-header {

      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;

    .section-header h2 {

      font-size: 16px;
      font-weight: 800;
    }

    .section-header span {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ================= TABLE ================= */

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    table {
      width: 100%;

      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    th {
      background: rgba(11,19,43,.75);
      color: var(--accent-gold);
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td {
      color: #e5e7eb;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.025);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 22px;
    }

    /* ================= GRAFIK ================= */

    .chart-card {
      margin-bottom: 18px;
    }

    .chart-wrap {
      width: 100%;
      overflow-x: auto;
      padding-top: 8px;
    }

    .chart-title {
      color: var(--accent-gold);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .chart-subtitle {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 16px;
    }

    .chart-svg {
      display: block;

      min-width: 620px;
      height: 300px;
    }

    .chart-grid-line {
      stroke: #d1d5db;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }

    .chart-axis {
      stroke: #6b7280;
      stroke-width: 1;
    }

   .chart-label {
  fill: #cbd5e1;
  font-size: 11px;
  font-weight: 600;
}

.chart-value {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  paint-order: stroke;
  stroke: rgba(11, 19, 43, 0.8);
  stroke-width: 3px;
  stroke-linejoin: round;
}

    .chart-bar-reward {
      fill: #16a34a;
    }

    .chart-bar-violation {
      fill: #dc2626;
    }

    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 8px;
      font-size: 11px;
      color: #4b5563;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;

    .legend-reward {
      background: #16a34a;
    }

    .legend-violation {

<script>

/* =========================================================
   SESSION ADMIN
========================================================= */

const adminSession =
  sessionStorage.getItem(
    "lentera_admin_session"
  );

if (!adminSession) {

  window.location.replace(
    "admin-login.html"
  );

}


/* =========================================================
   ELEMENT
========================================================= */

const tanggalMulai =
  document.getElementById(
    "tanggalMulai"
  );

const tanggalAkhir =
  document.getElementById(
    "tanggalAkhir"
  );

const tipeRekap =

  );

const siswaField =

  );

const kelasField =

  );

  );

const kelasSelect =
  document.getElementById(
    "kelasSelect"
  );

const tampilkanBtn =
  document.getElementById(
    "tampilkanBtn"
  );

const exportXlsBtn =
  document.getElementById(
    "exportXlsBtn"
  );

const exportCsvBtn =
  document.getElementById(
    "exportCsvBtn"
  );

const cetakBtn =
  document.getElementById(

  );

const chartCard =

  );

    "chartWrap"

    "chartTitle"
  );

const chartSubtitle =

    "chartSubtitle"
  );


/* =========================================================
   DATA
========================================================= */

let daftarSiswa = [];
let daftarKelas = [];
let latestReport = null;


/* =========================================================
   TANGGAL
========================================================= */

function getToday() {

  const date = new Date();

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function getFirstDayOfMonth() {

  const date = new Date();

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  return `${year}-${month}-01`;

}


tanggalMulai.value =
  getFirstDayOfMonth();

tanggalAkhir.value =
  getToday();


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(char) {

      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return map[char];

    }
  );

}


/* =========================================================
   ESCAPE XML
========================================================= */

function escapeXml(value) {

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&apos;");

}


/* =========================================================
   NUMBER
========================================================= */

function numberValue(value) {

  return Number(
    value || 0
  );

}


/* =========================================================
   FORMAT TANGGAL
========================================================= */

function formatTanggal(tanggal) {

  if (!tanggal) {
    return "-";
  }

  const parts =
    String(tanggal).split("-");

  if (parts.length !== 3) {
    return tanggal;
  }

  return (
    parts[2] +
    "-" +
    parts[1] +
    "-" +
    parts[0]
  );

}


/* =========================================================
   LOAD DATA MASTER
========================================================= */

async function loadDataMaster() {

  try {

    statusElement.textContent =
      "Memuat data siswa dan kelas...";

    const [
      siswaResponse,
      kelasResponse
    ] = await Promise.all([

      fetch(
        "/.netlify/functions/admin-students"
      ),

      fetch(
        "/.netlify/functions/admin-classes"
      )

    ]);


    const siswaResult =
      await siswaResponse.json();

    const kelasResult =
      await kelasResponse.json();


    if (
      !siswaResponse.ok ||
      !siswaResult.success
    ) {

      throw new Error(
        siswaResult.message ||
        "Gagal mengambil data siswa."
      );

    }


    if (
      !kelasResponse.ok ||
      !kelasResult.success
    ) {

      throw new Error(
        kelasResult.message ||
        "Gagal mengambil data kelas."
      );

    }


    daftarSiswa =
      Array.isArray(
        siswaResult.siswa
      )
      ? siswaResult.siswa
      : [];


    daftarKelas =
      Array.isArray(
        kelasResult.kelas
      )
      ? kelasResult.kelas
      : [];


    renderSiswaSelect();
    renderKelasSelect();


    statusElement.textContent =
      "Data siap digunakan.";

  }
  catch(error) {

    console.error(
      "LOAD MASTER ERROR:",
      error
    );

    statusElement.textContent =
      error.message ||
      "Gagal memuat data.";

  }

}

/* =========================================================
   TAMPILKAN REKAP
========================================================= */

async function tampilkanRekap() {

  const mulai =
    tanggalMulai.value;

  const akhir =
    tanggalAkhir.value;

  const tipe =
    tipeRekap.value;


  if (!mulai || !akhir) {

    alert(
      "Tanggal mulai dan tanggal akhir wajib diisi."
    );

    return;

  }


  if (mulai > akhir) {

    alert(
      "Tanggal mulai tidak boleh lebih besar dari tanggal akhir."
    );

    return;

  }


  if (
    tipe === "siswa" &&
    !siswaSelect.value
  ) {

    alert(
      "Silakan pilih siswa terlebih dahulu."
    );

    return;

  }


  if (
    tipe === "kelas" &&
    !kelasSelect.value
  ) {

    alert(
      "Silakan pilih kelas terlebih dahulu."
    );

    return;

  }


  tampilkanBtn.disabled = true;

  tampilkanBtn.textContent =
    "⏳ Memuat...";

  statusElement.textContent =
    "Mengambil data rekap...";


  try {

    const params =
      new URLSearchParams();

    params.set(
      "mulai",
      mulai
    );

    params.set(
      "akhir",
      akhir
    );

    params.set(
      "tipe",
      tipe
    );


    if (tipe === "siswa") {

      params.set(
        "siswaId",
        siswaSelect.value
      );

    }


    if (tipe === "kelas") {

      params.set(
        "kelasId",
        kelasSelect.value
      );

    }


    const response =
      await fetch(
        "/.netlify/functions/admin-report?" +
        params.toString()
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengambil rekap."
      );

    }


    latestReport =
      result;


    renderReport(
      result
    );


    exportXlsBtn.classList.remove(
      "hidden"
    );

    exportCsvBtn.classList.remove(
      "hidden"
    );


    statusElement.textContent =
      "Rekap berhasil dibuat.";

  }
  catch(error) {

    console.error(
      "REKAP ERROR:",
      error
    );

    latestReport = null;

    exportXlsBtn.classList.add(
      "hidden"
    );

    exportCsvBtn.classList.add(
      "hidden"
    );

    statusElement.textContent =
      error.message ||
      "Gagal membuat rekap.";

    alert(
      error.message ||
      "Gagal membuat rekap."
    );

  }
  finally {

    tampilkanBtn.disabled =
      false;

    tampilkanBtn.textContent =
      "📊 Tampilkan Rekap";

  }

}

/* =========================================================
   GRAFIK REKAP
   SVG digunakan supaya grafik ikut tercetak.
========================================================= */

function renderChart(report) {

  chartCard.classList.remove(
    "hidden"
  );


  let rows = [];


  /* ---------- PER KELAS ---------- */

  if (report.tipe === "kelas") {

    rows =
      (report.kelas || [])
      .map(function(item) {

        return {
          label:
            item.kelas || "-",

          penghargaan:
            numberValue(
              item.penghargaan
            ),

          pelanggaran:
            numberValue(
              item.pelanggaran
            )
        };

      });


    chartTitle.textContent =
      "Grafik Poin Per Kelas";

    chartSubtitle.textContent =
      "Perbandingan penghargaan dan pelanggaran setiap kelas.";

  }


  /* ---------- PER SISWA ---------- */

  else if (report.tipe === "siswa") {

    rows =
      (report.siswa || [])
      .map(function(item) {

        return {
          label:
            item.nama || "-",

          penghargaan:
            numberValue(
              item.penghargaan
            ),

          pelanggaran:
            numberValue(
              item.pelanggaran
            )
        };

      });


    chartTitle.textContent =
      "Grafik Poin Siswa";

    chartSubtitle.textContent =
      "Perbandingan penghargaan dan pelanggaran siswa yang dipilih.";

  }


  /* ---------- SATU SEKOLAH ---------- */

  else {

    rows =
      (report.kelas || [])
      .map(function(item) {

        return {
          label:
            item.kelas || "-",

          penghargaan:
            numberValue(
              item.penghargaan
            ),

          pelanggaran:
            numberValue(
              item.pelanggaran
            )
        };

      });


    chartTitle.textContent =
      "Grafik Poin Satu Sekolah";

    chartSubtitle.textContent =
      "Perbandingan penghargaan dan pelanggaran setiap kelas.";

  }


  /* ---------- TIDAK ADA DATA ---------- */

  if (!rows.length) {

    chartWrap.innerHTML =
      `
        <div class="empty">
          Tidak ada data untuk ditampilkan pada grafik.
        </div>
      `;

    return;

  }


  /* ---------- NILAI MAKSIMUM ---------- */

  const maxValue =
    Math.max(
      1,
      ...rows.map(function(item) {

        return Math.max(
          item.penghargaan,
          item.pelanggaran
        );

      })
    );


  /* ---------- UKURAN ---------- */

  const width = 1000;
  const height = 320;

  const left = 60;
  const right = 25;
  const top = 25;
  const bottom = 65;

  const chartHeight =
    height -
    top -
    bottom;

  const chartWidth =
    width -
    left -
    right;

  const groupWidth =
    chartWidth /
    rows.length;

  const barWidth =
    Math.max(
      6,
      Math.min(
        24,
        groupWidth * .25
      )
    );

  const gap =
    Math.max(
      3,
      groupWidth * .06
    );


  /* ---------- SVG ---------- */

  let svg = "";

  svg +=
    `<svg
      class="chart-svg"
      viewBox="0 0 ${width} ${height}"
      role="img"
      aria-label="Grafik rekap poin"
    >`;


  /* ---------- GRID ---------- */

  for (
    let i = 0;
    i <= 4;
    i++
  ) {

    const percentage =
      i / 4;

    const value =
      Math.round(
        maxValue *
        percentage
      );

    const y =
      top +
      chartHeight -
      (
        chartHeight *
        percentage
      );


    svg +=
      `<line
        class="chart-grid-line"
        x1="${left}"
        y1="${y}"
        x2="${width - right}"
        y2="${y}"
      ></line>`;


    svg +=
      `<text
        class="chart-label"
        x="${left - 8}"
        y="${y + 4}"
        text-anchor="end"
      >
        ${escapeHtml(value)}
      </text>`;

  }


  /* ---------- SUMBU ---------- */

  svg +=
    `<line
      class="chart-axis"
      x1="${left}"
      y1="${top + chartHeight}"
      x2="${width - right}"
      y2="${top + chartHeight}"
    ></line>`;


  /* ---------- BAR ---------- */

  rows.forEach(
    function(item,index) {

      const center =
        left +
        (
          groupWidth *
          index
        ) +
        (
          groupWidth / 2
        );


      const rewardHeight =
        (
          item.penghargaan /
          maxValue
        ) *
        chartHeight;


      const violationHeight =
        (
          item.pelanggaran /
          maxValue
        ) *
        chartHeight;


      const rewardX =
        center -
        barWidth -
        (gap / 2);


      const violationX =
        center +
        (gap / 2);


      const rewardY =
        top +
        chartHeight -
        rewardHeight;


      const violationY =
        top +
        chartHeight -
        violationHeight;


      /* PENGHARGAAN */

      svg +=
        `<rect
          class="chart-bar-reward"
          x="${rewardX}"
          y="${rewardY}"
          width="${barWidth}"
          height="${Math.max(
            0,
            rewardHeight
          )}"
          rx="3"
        ></rect>`;


      /* PELANGGARAN */

      svg +=
        `<rect
          class="chart-bar-violation"
          x="${violationX}"
          y="${violationY}"
          width="${barWidth}"
          height="${Math.max(
            0,
            violationHeight
          )}"
          rx="3"
        ></rect>`;


      /* NILAI PENGHARGAAN */

      if (
        item.penghargaan > 0
      ) {

        svg +=
          `<text
            class="chart-value"
            x="${rewardX + barWidth / 2}"
            y="${Math.max(
              14,
              rewardY - 6
            )}"
            text-anchor="middle"
          >
            ${item.penghargaan}
          </text>`;

      }


      /* NILAI PELANGGARAN */

      if (
        item.pelanggaran > 0
      ) {

        svg +=
          `<text
            class="chart-value"
            x="${violationX + barWidth / 2}"
            y="${Math.max(
              14,
              violationY - 6
            )}"
            text-anchor="middle"
          >
            ${item.pelanggaran}
          </text>`;

      }


      /* LABEL */

      let label =
        String(
          item.label || "-"
        );


      if (
        label.length > 16
      ) {

        label =
          label.substring(
            0,
            15
          ) +
          "…";

      }


      svg +=
        `<text
          class="chart-label"
          x="${center}"
          y="${height - 30}"
          text-anchor="middle"
        >
          ${escapeHtml(label)}
        </text>`;

    }
  );


  svg += "</svg>";


  chartWrap.innerHTML =
    svg;

}


/* =========================================================
   TARGET EXPORT
========================================================= */

function getTargetName() {

  if (!latestReport) {
    return "rekap";
  }


  if (
    latestReport.tipe ===
    "siswa"
  ) {

    const siswa =
      daftarSiswa.find(
        function(item) {

          return String(item.id) ===
            String(siswaSelect.value);

        }
      );


    return siswa
      ? siswa.nama
      : "siswa";

  }


  if (
    latestReport.tipe ===
    "kelas"
  ) {

    const kelas =
      daftarKelas.find(
        function(item) {

          return String(item.id) ===
            String(kelasSelect.value);

        }
      );


    return kelas
      ? (
          kelas.nama_kelas ||
          kelas.nama ||
          "kelas"
        )
      : "kelas";

  }


  return "sekolah";

}


/* =========================================================
   SANITIZE FILE NAME
========================================================= */

function sanitizeFileName(value) {

  return String(
    value || ""
  )
  .trim()
  .replace(
    /[^a-zA-Z0-9_-]+/g,
    "-"
  )
  .replace(
    /^-+|-+$/g,
    ""
  )
  .toLowerCase() ||
  "rekap";

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   CSV
========================================================= */

function csvCell(value) {

  const text =
    String(
      value ?? ""
    );

  return (
    '"' +
    text.replace(
      /"/g,
      '""'
    ) +
    '"'
  );

}


function csvRow(values) {

  return values
    .map(csvCell)
    .join(",");

}

        : "REKAP SATU SEKOLAH"
    ]);


    rows.push([
      "NISN",
      "Nama",
      "Kelas",
      "Penghargaan",
      "Pelanggaran",
      "Poin Bersih",
      "Transaksi"
    ]);


    (
      report.siswa || []
    ).forEach(
      function(item) {

        rows.push([
          item.nisn,
          item.nama,
          item.kelas,
          item.penghargaan,
          item.pelanggaran,
          item.total,
          item.transaksi
        ]);

      }
    );

  }


  rows.push([]);


  rows.push([
    "DETAIL TRANSAKSI"
  ]);


  rows.push([
    "Tanggal",
    "NISN",
    "Nama",
    "Kelas",
    "Jenis",
    "Poin",
    "Keterangan",
    "Dibuat Oleh",
    "Peran"
  ]);


  (
    report.transaksi || []
  ).forEach(
    function(item) {

      rows.push([
        item.tanggal,
        item.nisn,
        item.nama,
        item.kelas,
        item.jenis,
        item.poin,
        item.keterangan,
        item.dibuatOleh,
        item.peran
      ]);

    }
  );


  return (
    "\uFEFF" +
    rows
      .map(csvRow)
      .join("\r\n")
  );

}
