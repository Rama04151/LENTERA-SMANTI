<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rekap Poin - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --input-bg: #0f1935;

      --accent-gold: #fbc02d;
      --accent-gold-dark: #d48806;

      --text-main: #ffffff;
      --text-muted: #94a3b8;

      --border-color: rgba(255, 255, 255, 0.08);

      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    body {
      min-height: 100vh;

      background-color: var(--bg-dark);

      color: var(--text-main);

      padding: 20px;

      background-image:
        radial-gradient(
          circle at 10% 10%,
          rgba(251, 192, 45, 0.06),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(28, 37, 65, 0.7),
          transparent 45%
        );
    }

    .container {
      width: 100%;
      max-width: 1200px;

      margin: auto;
    }

    .card {
      background: var(--card-bg);

      border: 1px solid var(--border-color);

      border-radius: 22px;

      padding: 24px;

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.35);

      margin-bottom: 18px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      display: flex;

      align-items: center;

      gap: 14px;

      padding-bottom: 18px;

      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      width: 48px;
      height: 48px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent-gold),
          var(--accent-gold-dark)
        );

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--bg-dark);

      font-size: 22px;

      font-weight: 800;

      box-shadow:
        0 4px 15px rgba(251, 192, 45, 0.25);
    }

    .header-title h1 {
      font-size: 21px;

      font-weight: 800;
    }

    .header-title p {
      margin-top: 3px;

      font-size: 12px;

      color: var(--accent-gold);

      font-weight: 700;
    }

    .back-button {
      margin-left: auto;

      color: var(--accent-gold);

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    /* =========================================
       FILTER
    ========================================= */

    .filter-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;

      margin-top: 20px;
    }

    .field {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;

      color: var(--text-muted);

      font-weight: 700;
    }

    input,
    select {
      width: 100%;

      padding: 12px;

      border-radius: 11px;

      border: 1px solid var(--border-color);

      background: var(--input-bg);

      color: #ffffff;

      outline: none;

      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color:
        rgba(251, 192, 45, 0.65);
    }

    select option {
      background: #1c2541;

      color: #ffffff;
    }

    /* =========================================
       BUTTON
    ========================================= */

    .button-row {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 16px;
    }

    button {
      border: none;

      border-radius: 11px;

      padding: 12px 16px;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          var(--accent-gold),
          var(--accent-gold-dark)
        );

      color: var(--bg-dark);
    }

    .btn-success {
      background: #166534;

      color: #ffffff;
    }

    .btn-secondary {
      background:
        rgba(255, 255, 255, 0.06);

      border:
        1px solid var(--border-color);

      color: #ffffff;
    }

    .btn-danger {
      background:
        rgba(239, 68, 68, 0.15);

      border:
        1px solid rgba(239, 68, 68, 0.25);

      color: #f87171;
    }

    .status {
      min-height: 20px;

      margin-top: 12px;

      font-size: 12px;

      color: var(--text-muted);
    }

    /* =========================================
       SUMMARY
    ========================================= */

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;
    }

    .summary-card {
      background:
        rgba(11, 19, 43, 0.55);

      border:
        1px solid var(--border-color);

      border-radius: 15px;

      padding: 16px;
    }

    .summary-card span {
      display: block;

      color: var(--text-muted);

      font-size: 11px;

      font-weight: 600;
    }

    .summary-card strong {
      display: block;

      margin-top: 6px;

      color: var(--accent-gold);

      font-size: 21px;

      font-weight: 800;
    }

    /* =========================================
       SECTION HEADER
    ========================================= */

    .section-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .section-header h2 {
      color: var(--accent-gold);

      font-size: 16px;

      font-weight: 800;
    }

    .section-header span {
      color: var(--text-muted);

      font-size: 12px;
    }

    /* =========================================
       TABLE
    ========================================= */

    .table-wrapper {
      overflow-x: auto;

      border:
        1px solid var(--border-color);

      border-radius: 14px;
    }

    table {
      width: 100%;

      min-width: 760px;

      border-collapse: collapse;

      font-size: 12px;
    }

    th,
    td {
      padding: 11px 12px;

      text-align: left;

      border-bottom:
        1px solid var(--border-color);

      white-space: nowrap;
    }

    th {
      background:
        rgba(11, 19, 43, 0.75);

      color: var(--accent-gold);

      font-weight: 800;

      position: sticky;

      top: 0;

      z-index: 1;
    }

    td {
      color: #e5e7eb;
    }

    tbody tr:hover {
      background:
        rgba(255, 255, 255, 0.025);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .empty {
      text-align: center;

      color: var(--text-muted);

      padding: 22px;
    }

    /* =========================================
       HIDDEN
    ========================================= */

    .hidden {
      display: none !important;
    }

    /* =========================================
       PRINT
    ========================================= */

    @media print {

      body {
        background: #ffffff;

        color: #000000;

        padding: 0;
      }

      .card {
        box-shadow: none;

        background: #ffffff;

        color: #000000;

        border: 1px solid #cccccc;
      }

      .header,
      .filter-grid,
      .button-row,
      .status,
      .back-button {
        display: none !important;
      }

      .summary-card {
        background: #ffffff;

        color: #000000;

        border: 1px solid #cccccc;
      }

      .summary-card span,
      .summary-card strong {
        color: #000000;
      }

      th {
        background: #eeeeee;

        color: #000000;
      }

      td {
        color: #000000;
      }

      table {
        min-width: 0;
      }

      .table-wrapper {
        overflow: visible;
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 800px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 16px;

        border-radius: 18px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .header-title h1 {
        font-size: 18px;
      }

      .back-button {
        font-size: 11px;
      }

      .button-row button {
        flex: 1;

        min-width: 120px;
      }
    }

    @media (max-width: 450px) {

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .summary-card strong {
        font-size: 18px;
      }

      .logo {
        width: 42px;
        height: 42px;

        font-size: 19px;
      }

      .header-title h1 {
        font-size: 16px;
      }
    }

  </style>

</head>

<body>

  <main class="container">

    <!-- =========================================
         FILTER CARD
    ========================================== -->

    <section class="card">

      <div class="header">

        <div class="logo">
          L
        </div>

        <div class="header-title">

          <h1>
            Rekap Poin Siswa
          </h1>

          <p>
            LENTERA SMANTI • ADMIN
          </p>

        </div>

        <a
          href="admin.html"
          class="back-button"
        >
          ← Kembali
        </a>

      </div>


      <div class="filter-grid">

        <!-- TANGGAL MULAI -->

        <div class="field">

          <label for="tanggalMulai">
            Tanggal Mulai
          </label>

          <input
            type="date"
            id="tanggalMulai"
          >

        </div>


        <!-- TANGGAL AKHIR -->

        <div class="field">

          <label for="tanggalAkhir">
            Tanggal Akhir
          </label>

          <input
            type="date"
            id="tanggalAkhir"
          >

        </div>


        <!-- TIPE REKAP -->

        <div class="field">

          <label for="tipeRekap">
            Jenis Rekap
          </label>

          <select id="tipeRekap">

            <option value="siswa">
              Per Siswa
            </option>

            <option value="kelas">
              Per Kelas
            </option>

            <option value="sekolah">
              Satu Sekolah
            </option>

          </select>

        </div>


        <!-- SISWA -->

        <div
          class="field hidden"
          id="siswaField"
        >

          <label for="siswaSelect">
            Pilih Siswa
          </label>

          <select id="siswaSelect">

            <option value="">
              Memuat siswa...
            </option>

          </select>

        </div>


        <!-- KELAS -->

        <div
          class="field hidden"
          id="kelasField"
        >

          <label for="kelasSelect">
            Pilih Kelas
          </label>

          <select id="kelasSelect">

            <option value="">
              Memuat kelas...
            </option>

          </select>

        </div>

      </div>


      <!-- BUTTON -->

      <div class="button-row">

        <button
          type="button"
          class="btn-primary"
          id="tampilkanBtn"
        >
          📊 Tampilkan Rekap
        </button>

        <button
          type="button"
          class="btn-success hidden"
          id="exportXlsBtn"
        >
          📗 Export XLS
        </button>

        <button
          type="button"
          class="btn-secondary hidden"
          id="exportCsvBtn"
        >
          📄 Export CSV
        </button>

        <button
          type="button"
          class="btn-secondary"
          id="cetakBtn"
        >
          🖨️ Cetak
        </button>

      </div>


      <div
        class="status"
        id="status"
      ></div>

    </section>


    <!-- =========================================
         RINGKASAN
    ========================================== -->

    <section
      class="card hidden"
      id="ringkasanCard"
    >

      <div class="section-header">

        <h2>
          Ringkasan Rekap
        </h2>

        <span id="periodeText">
          -
        </span>

      </div>


      <div class="summary-grid">

        <div class="summary-card">

          <span>
            Jumlah Siswa
          </span>

          <strong id="jumlahSiswa">
            0
          </strong>

        </div>


        <div class="summary-card">

          <span>
            Total Penghargaan
          </span>

          <strong id="totalPenghargaan">
            0
          </strong>

        </div>


        <div class="summary-card">

          <span>
            Total Pelanggaran
          </span>

          <strong id="totalPelanggaran">
            0
          </strong>

        </div>


        <div class="summary-card">

          <span>
            Poin Bersih
          </span>

          <strong id="totalBersih">
            0
          </strong>

        </div>

      </div>

    </section>


    <!-- =========================================
         REKAP UTAMA
    ========================================== -->

    <section
      class="card hidden"
      id="rekapCard"
    >

      <div class="section-header">

        <h2 id="judulRekap">
          Rekap
        </h2>

        <span id="jumlahData">
          0 data
        </span>

      </div>


      <div
        class="table-wrapper"
        id="rekapTableWrapper"
      ></div>

    </section>


    <!-- =========================================
         DETAIL TRANSAKSI
    ========================================== -->

    <section
      class="card hidden"
      id="detailCard"
    >

      <div class="section-header">

        <h2>
          Detail Transaksi Poin
        </h2>

        <span id="jumlahTransaksi">
          0 transaksi
        </span>

      </div>


      <div
        class="table-wrapper"
        id="detailTableWrapper"
      ></div>

    </section>

  </main>


  <script>

    /* =========================================
       SESSION ADMIN
    ========================================== */

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {

      window.location.replace(
        "admin-login.html"
      );

    }


    /* =========================================
       ELEMENT
    ========================================== */

    const tanggalMulai =
      document.getElementById(
        "tanggalMulai"
      );

    const tanggalAkhir =
      document.getElementById(
        "tanggalAkhir"
      );

    const tipeRekap =
      document.getElementById(
        "tipeRekap"
      );

    const siswaField =
      document.getElementById(
        "siswaField"
      );

    const kelasField =
      document.getElementById(
        "kelasField"
      );

    const siswaSelect =
      document.getElementById(
        "siswaSelect"
      );

    const kelasSelect =
      document.getElementById(
        "kelasSelect"
      );

    const tampilkanBtn =
      document.getElementById(
        "tampilkanBtn"
      );

    const exportXlsBtn =
      document.getElementById(
        "exportXlsBtn"
      );

    const exportCsvBtn =
      document.getElementById(
        "exportCsvBtn"
      );

    const cetakBtn =
      document.getElementById(
        "cetakBtn"
      );

    const statusElement =
      document.getElementById(
        "status"
      );


    /* =========================================
       DATA
    ========================================== */

    let daftarSiswa = [];

    let daftarKelas = [];

    let latestReport = null;


    /* =========================================
       TANGGAL DEFAULT
    ========================================== */

    function getToday() {

      const date = new Date();

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    function getFirstDayOfMonth() {

      const date = new Date();

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      return `${year}-${month}-01`;

    }


    tanggalMulai.value =
      getFirstDayOfMonth();

    tanggalAkhir.value =
      getToday();


    /* =========================================
       ESCAPE HTML
    ========================================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,
        function (char) {

          const map = {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"

          };

          return map[char];

        }
      );

    }


    /* =========================================
       ESCAPE XML
    ========================================== */

    function escapeXml(value) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&apos;"
        );

    }


    /* =========================================
       NUMBER
    ========================================== */

    function numberValue(value) {

      return Number(
        value || 0
      );

    }


    /* =========================================
       FORMAT TANGGAL
    ========================================== */

    function formatTanggal(
      tanggal
    ) {

      if (!tanggal) {

        return "-";

      }

      const parts =
        String(tanggal)
          .split("-");

      if (
        parts.length !== 3
      ) {

        return tanggal;

      }

      return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
      );

    }


    /* =========================================
       LOAD SISWA + KELAS
    ========================================== */

    async function loadDataMaster() {

      try {

        statusElement.textContent =
          "Memuat data siswa dan kelas...";


        const [
          siswaResponse,
          kelasResponse
        ] = await Promise.all([

          fetch(
            "/.netlify/functions/admin-students"
          ),

          fetch(
            "/.netlify/functions/admin-classes"
          )

        ]);


        const siswaResult =
          await siswaResponse.json();

        const kelasResult =
          await kelasResponse.json();


        if (
          !siswaResponse.ok ||
          !siswaResult.success
        ) {

          throw new Error(
            siswaResult.message ||
            "Gagal mengambil data siswa."
          );

        }


        if (
          !kelasResponse.ok ||
          !kelasResult.success
        ) {

          throw new Error(
            kelasResult.message ||
            "Gagal mengambil data kelas."
          );

        }


        daftarSiswa =
          Array.isArray(
            siswaResult.siswa
          )
            ? siswaResult.siswa
            : [];


        daftarKelas =
          Array.isArray(
            kelasResult.kelas
          )
            ? kelasResult.kelas
            : [];


        renderSiswaSelect();

        renderKelasSelect();


        statusElement.textContent =
          "Data siap digunakan.";

      }
      catch (error) {

        console.error(
          "LOAD MASTER ERROR:",
          error
        );

        statusElement.textContent =
          error.message ||
          "Gagal memuat data.";

      }

    }


    /* =========================================
       SELECT SISWA
    ========================================== */

    function renderSiswaSelect() {

      siswaSelect.innerHTML =
        '<option value="">-- Pilih Siswa --</option>';


      daftarSiswa.forEach(
        function (siswa) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            siswa.id || "";

          const nama =
            siswa.nama || "-";

          const nisn =
            siswa.nisn || "-";

          const kelas =
            siswa.kelas ||
            siswa.nama_kelas ||
            "-";


          option.textContent =
            `${nama} — ${nisn} (${kelas})`;


          siswaSelect.appendChild(
            option
          );

        }
      );

    }


    /* =========================================
       SELECT KELAS
    ========================================== */

    function renderKelasSelect() {

      kelasSelect.innerHTML =
        '<option value="">-- Pilih Kelas --</option>';


      daftarKelas.forEach(
        function (kelas) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            kelas.id || "";

          option.textContent =
            kelas.nama_kelas ||
            kelas.nama ||
            kelas.id ||
            "-";


          kelasSelect.appendChild(
            option
          );

        }
      );

    }


    /* =========================================
       UBAH JENIS REKAP
    ========================================== */

    function updateFilter() {

      siswaField.classList.toggle(
        "hidden",
        tipeRekap.value !== "siswa"
      );


      kelasField.classList.toggle(
        "hidden",
        tipeRekap.value !== "kelas"
      );

    }


    tipeRekap.addEventListener(
      "change",
      updateFilter
    );


    updateFilter();


    /* =========================================
       TAMPILKAN REKAP
    ========================================== */

    async function tampilkanRekap() {

      const mulai =
        tanggalMulai.value;

      const akhir =
        tanggalAkhir.value;

      const tipe =
        tipeRekap.value;


      /* VALIDASI */

      if (!mulai || !akhir) {

        alert(
          "Tanggal mulai dan tanggal akhir wajib diisi."
        );

        return;

      }


      if (mulai > akhir) {

        alert(
          "Tanggal mulai tidak boleh lebih besar dari tanggal akhir."
        );

        return;

      }


      if (
        tipe === "siswa" &&
        !siswaSelect.value
      ) {

        alert(
          "Silakan pilih siswa terlebih dahulu."
        );

        return;

      }


      if (
        tipe === "kelas" &&
        !kelasSelect.value
      ) {

        alert(
          "Silakan pilih kelas terlebih dahulu."
        );

        return;

      }


      /* LOADING */

      tampilkanBtn.disabled =
        true;

      tampilkanBtn.textContent =
        "⏳ Memuat...";

      statusElement.textContent =
        "Mengambil data rekap...";


      try {

        const params =
          new URLSearchParams();


        params.set(
          "mulai",
          mulai
        );


        params.set(
          "akhir",
          akhir
        );


        params.set(
          "tipe",
          tipe
        );


        if (tipe === "siswa") {

          params.set(
            "siswaId",
            siswaSelect.value
          );

        }


        if (tipe === "kelas") {

          params.set(
            "kelasId",
            kelasSelect.value
          );

        }


        const response =
          await fetch(
            "/.netlify/functions/admin-report?" +
            params.toString()
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Gagal mengambil rekap."
          );

        }


        latestReport =
          result;

    /* =========================================
       TARGET EXPORT
    ========================================== */

    function getTargetName() {

      if (!latestReport) {

        return "rekap";

      }


      if (
        latestReport.tipe ===
        "siswa"
      ) {

        const siswa =
          daftarSiswa.find(
            function (item) {

              return String(
                item.id
              ) === String(
                siswaSelect.value
              );

            }
          );


        return siswa
          ? siswa.nama
          : "siswa";

      }


      if (
        latestReport.tipe ===
        "kelas"
      ) {

        const kelas =
          daftarKelas.find(
            function (item) {

              return String(
                item.id
              ) === String(
                kelasSelect.value
              );

            }
          );


        return kelas
          ? (
              kelas.nama_kelas ||
              kelas.nama ||
              "kelas"
            )
          : "kelas";

      }


      return "sekolah";

    }


    /* =========================================
       NAMA FILE
    ========================================== */

    function sanitizeFileName(
      value
    ) {

      return String(
        value || ""
      )
        .trim()
        .replace(
          /[^a-zA-Z0-9_-]+/g,
          "-"
        )
        .replace(
          /^-+|-+$/g,
          ""
        )
        .toLowerCase() ||
        "rekap";

    }


    /* =========================================
       DOWNLOAD
    ========================================== */

    function downloadBlob(
      blob,
      filename
    ) {

      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;

      link.download =
        filename;


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        function () {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }


    /* =========================================
       CSV CELL
    ========================================== */

    function csvCell(
      value
    ) {

      const text =
        String(
          value ?? ""
        );


      return (
        '"' +
        text.replace(
          /"/g,
          '""'
        ) +
        '"'
      );

    }


    function csvRow(
      values
    ) {

      return values
        .map(
          csvCell
        )
        .join(",");

    }

    /* =========================================
       EXPORT CSV
    ========================================== */

    function exportCSV() {

      if (!latestReport) {

        alert(
          "Tampilkan rekap terlebih dahulu."
        );

        return;

      }


      const target =
        sanitizeFileName(
          getTargetName()
        );


      const filename =
        `rekap-poin-${target}-${latestReport.periode.mulai}-${latestReport.periode.akhir}.csv`;


      const csv =
        buildCSV();


      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8"
          }
        );


      downloadBlob(
        blob,
        filename
      );

    }

        );

        return;

      }


      const target =
        sanitizeFileName(
          getTargetName()
        );


      const filename =
        `rekap-poin-${target}-${latestReport.periode.mulai}-${latestReport.periode.akhir}.xls`;


      const xls =
        buildXLS();


      const blob =
        new Blob(
          [xls],
          {
            type:
              "application/vnd.ms-excel;charset=utf-8"
          }
        );


      downloadBlob(
        blob,
        filename
      );

    }


    /* =========================================
       EVENT
    ========================================== */

    tampilkanBtn.addEventListener(
      "click",
      tampilkanRekap
    );


    exportXlsBtn.addEventListener(
      "click",
      exportXLS
    );


    exportCsvBtn.addEventListener(
      "click",
      exportCSV
    );


    cetakBtn.addEventListener(
      "click",
      function () {

        window.print();

      }
    );


    /* =========================================
       LOAD AWAL
    ========================================== */

    loadDataMaster();

  </script>

</body>
