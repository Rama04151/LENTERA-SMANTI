<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Poin - LENTERA SMANTI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b132b;
  --card: #1c2541;
  --input: #0f1935;
  --gold: #fbc02d;
  --muted: #94a3b8;
  --border: rgba(255,255,255,.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Plus Jakarta Sans", sans-serif;
}

body {
  background: var(--bg);
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 15px 35px #0003;
}

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}

.logo {
  background: linear-gradient(135deg,var(--gold),#d48806);
  color: var(--bg);
  font-size: 22px;
  font-weight: 800;
  padding: 12px 16px;
  border-radius: 12px;
}

.header h1 {
  font-size: 21px;
}

.header p {
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
}

.back {
  margin-left: auto;
  color: var(--gold);
  text-decoration: none;
}

.filters {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 14px;
  margin-top: 20px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}

input,select {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--input);
  color: white;
  width: 100%;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  font-weight: 800;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.primary {
  background: linear-gradient(135deg,var(--gold),#d48806);
  color: var(--bg);
}

.secondary {
  background: #ffffff12;
  color: white;
  border: 1px solid var(--border);
}

.success {
  background: #166534;
  color: white;
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
  min-height: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 12px;
}

.metric {
  background: #0b132b88;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.metric strong {
  display: block;
  color: var(--gold);
  font-size: 21px;
  margin-top: 6px;
}

.section {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.section h2 {
  font-size: 16px;
  color: var(--gold);
}

.section span {
  font-size: 12px;
  color: var(--muted);
}

.tablewrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
}

table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  font-size: 12px;
}

th,td {
  text-align: left;
  padding: 10px 11px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

th {
  background: #0b132bcc;
  color: var(--gold);
}

td {
  color: #e5e7eb;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 22px;
}

.hidden {
  display: none !important;
}

.chartwrap {
  overflow-x: auto;
}

.chartsvg {
  width: 100%;
  min-width: 600px;
  height: 280px;
}

.legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 5px;
}

.green {
  background: #16a34a;
}

.red {
  background: #dc2626;
}

@media(max-width:750px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }

  .header h1 {
    font-size: 16px;
  }

  .back {
    font-size: 11px;
  }

  .buttons button {
    flex: 1;
  }
}

@media print {
  @page {
    size: A4 landscape;
    margin: 10mm;
  }

  body {
    background: white !important;
    color: black;
    padding: 0;
  }

  .card {
    background: white !important;
    color: black;
    box-shadow: none;
    border: 1px solid #bbb;
    break-inside: auto;
  }

  .header,
  .filters,
  .buttons,
  .status,
  .back {
    display: none !important;
  }

  .metric {
    background: white;
    border: 1px solid #bbb;
  }

  .metric span,
  .metric strong,
  td {
    color: black;
  }

  th {
    background: #eee !important;
    color: black;
    position: static;
  }

  .tablewrap {
    overflow: visible !important;
  }

  table {
    min-width: 0 !important;
    width: 100%;
    font-size: 9px;
  }

  th,td {
    white-space: normal;
    overflow-wrap: anywhere;
    border: 1px solid #ccc;
  }

  .chartsvg {
    min-width: 0;
    height: 220px;
  }

  .chartwrap {
    overflow: visible;
  }

  .chartlabel,
  .chartvalue {
    fill: #111;
  }

  .barreward {
    fill: #16a34a !important;
  }

  .barviolation {
    fill: #dc2626 !important;
  }

  #classStudentCard {
    display: block !important;
  }
}
</style>
</head>

<body>

<main class="container">

  <!-- FILTER -->
  <section class="card">

    <div class="header">
      <div class="logo">L</div>

      <div>
        <h1>Rekap Poin Siswa</h1>
        <p>LENTERA SMANTI • ADMIN</p>
      </div>

      <a class="back" href="admin.html">← Kembali</a>
    </div>

    <div class="filters">

      <div class="field">
        <label for="mulai">Tanggal Mulai</label>
        <input type="date" id="mulai">
      </div>

      <div class="field">
        <label for="akhir">Tanggal Akhir</label>
        <input type="date" id="akhir">
      </div>

      <div class="field">
        <label for="tipe">Jenis Rekap</label>

        <select id="tipe">
          <option value="siswa">Per Siswa</option>
          <option value="kelas">Per Kelas</option>
          <option value="sekolah">Satu Sekolah</option>
        </select>
      </div>

      <div class="field hidden" id="siswaField">
        <label for="siswa">Pilih Siswa</label>
        <select id="siswa">
          <option value="">Pilih siswa</option>
        </select>
      </div>

      <div class="field hidden" id="kelasField">
        <label for="kelas">Pilih Kelas</label>
        <select id="kelas">
          <option value="">Pilih kelas</option>
        </select>
      </div>

    </div>

    <div class="buttons">
      <button class="primary" id="show">📊 Tampilkan Rekap</button>
      <button class="success hidden" id="xls">📗 Export XLS</button>
      <button class="secondary hidden" id="csv">📄 Export CSV</button>
      <button class="secondary" id="print">🖨️ Cetak</button>
    </div>

    <div class="status" id="status"></div>

  </section>

  <!-- RINGKASAN -->
  <section class="card hidden" id="summaryCard">

    <div class="section">
      <h2>Ringkasan Rekap</h2>
      <span id="period"></span>
    </div>

    <div class="grid">

      <div class="metric">
        <span>Jumlah Siswa</span>
        <strong id="nSiswa">0</strong>
      </div>

      <div class="metric">
        <span>Total Penghargaan</span>
        <strong id="nReward">0</strong>
      </div>

      <div class="metric">
        <span>Total Pelanggaran</span>
        <strong id="nViolation">0</strong>
      </div>

      <div class="metric">
        <span>Poin Bersih</span>
        <strong id="nNet">0</strong>
      </div>

    </div>
  </section>

  <!-- GRAFIK -->
  <section class="card hidden" id="chartCard">

    <div class="section">
      <h2 id="chartTitle">Grafik Poin</h2>
    </div>

    <p style="font-size:12px;color:var(--muted);margin-bottom:10px"
       id="chartSubtitle">
      Penghargaan dan pelanggaran
    </p>

    <div class="chartwrap" id="chart"></div>

    <div class="legend">
      <span><i class="dot green"></i>Penghargaan</span>
      <span><i class="dot red"></i>Pelanggaran</span>
    </div>

  </section>

  <!-- REKAP UTAMA -->
  <section class="card hidden" id="mainCard">

    <div class="section">
      <h2 id="mainTitle">Rekap</h2>
      <span id="mainCount"></span>
    </div>

    <div class="tablewrap" id="mainTable"></div>

  </section>

  <!-- REKAP SETIAP SISWA DALAM KELAS -->
  <section class="card hidden" id="classStudentCard">

    <div class="section">
      <h2>Rekap Poin Setiap Siswa</h2>
      <span id="classStudentCount"></span>
    </div>

    <p id="classPeriod"
       style="font-size:12px;color:var(--muted);margin-bottom:12px">
    </p>

    <div class="tablewrap" id="classStudentTable"></div>

  </section>

  <!-- DETAIL TRANSAKSI -->
  <section class="card hidden" id="detailCard">

    <div class="section">
      <h2>Detail Transaksi Poin</h2>
      <span id="detailCount"></span>
    </div>

    <div class="tablewrap" id="detailTable"></div>

  </section>

</main>

<script>
"use strict";

if (!sessionStorage.getItem("lentera_admin_session")) {
  location.replace("admin-login.html");
}

const $ = id => document.getElementById(id);

let students = [];
let classes = [];
let reportData = null;
let classRows = [];

function today() {
  const d = new Date();

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

$("mulai").value = today().slice(0,8) + "01";
$("akhir").value = today();

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

const num = value => Number(value || 0);

const norm = value =>
  String(value ?? "").trim().toLowerCase();

function dateFmt(value) {
  if (!value) return "-";

  const parts = String(value).slice(0,10).split("-");

  return parts.length === 3
    ? `${parts[2]}-${parts[1]}-${parts[0]}`
    : value;
}

/* ================= LOAD DATA MASTER ================= */

async function loadMaster() {
  try {
    $("status").textContent = "Memuat siswa dan kelas...";

    const [studentResponse, classResponse] =
      await Promise.all([
        fetch("/.netlify/functions/admin-students"),
        fetch("/.netlify/functions/admin-classes")
      ]);

    const [studentResult, classResult] =
      await Promise.all([
        studentResponse.json(),
        classResponse.json()
      ]);

    if (!studentResponse.ok || !studentResult.success) {
      throw Error(studentResult.message || "Gagal memuat siswa.");
    }

    if (!classResponse.ok || !classResult.success) {
      throw Error(classResult.message || "Gagal memuat kelas.");
    }

    students = Array.isArray(studentResult.siswa)
      ? studentResult.siswa
      : [];

    classes = Array.isArray(classResult.kelas)
      ? classResult.kelas
      : [];

    $("siswa").innerHTML =
      '<option value="">Pilih siswa</option>';

    students.forEach(student => {
      $("siswa").add(new Option(
        `${student.nama || "-"} — ${student.nisn || "-"} (${student.kelas || student.nama_kelas || "-"})`,
        student.id || ""
      ));
    });

    $("kelas").innerHTML =
      '<option value="">Pilih kelas</option>';

    classes.forEach(item => {
      $("kelas").add(new Option(
        item.nama_kelas || item.nama || item.id,
        item.id
      ));
    });

    $("status").textContent = "Data siap.";

  } catch (error) {
    console.error(error);
    $("status").textContent =
      error.message || "Gagal memuat data master.";
  }
}

/* ================= FILTER ================= */

function updateFilter() {
  $("siswaField").classList.toggle(
    "hidden",
    $("tipe").value !== "siswa"
  );

  $("kelasField").classList.toggle(
    "hidden",
    $("tipe").value !== "kelas"
  );
}

$("tipe").addEventListener("change", updateFilter);
updateFilter();

/* ================= AMBIL REKAP ================= */

async function showReport() {
  const mulai = $("mulai").value;
  const akhir = $("akhir").value;
  const tipe = $("tipe").value;

  if (!mulai || !akhir) {
    alert("Tanggal mulai dan akhir wajib diisi.");
    return;
  }

  if (mulai > akhir) {
    alert("Tanggal mulai tidak boleh melebihi tanggal akhir.");
    return;
  }

  if (tipe === "siswa" && !$("siswa").value) {
    alert("Pilih siswa terlebih dahulu.");
    return;
  }

  if (tipe === "kelas" && !$("kelas").value) {
    alert("Pilih kelas terlebih dahulu.");
    return;
  }

  $("show").disabled = true;
  $("show").textContent = "Memuat...";
  $("status").textContent = "Mengambil rekap...";

  try {
    const params = new URLSearchParams({
      mulai,
      akhir,
      tipe
    });

    if (tipe === "siswa") {
      params.set("siswaId", $("siswa").value);
    }

    if (tipe === "kelas") {
      params.set("kelasId", $("kelas").value);
    }

    const response = await fetch(
      "/.netlify/functions/admin-report?" + params
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw Error(result.message || "Gagal mengambil rekap.");
    }

    reportData = result;
    classRows = [];

    renderReport(result);

    $("xls").classList.remove("hidden");
    $("csv").classList.remove("hidden");

    $("status").textContent = "Rekap berhasil dibuat.";

  } catch (error) {
    console.error(error);

    reportData = null;

    $("status").textContent =
      error.message || "Gagal membuat rekap.";

    alert(error.message || "Gagal membuat rekap.");

  } finally {
    $("show").disabled = false;
    $("show").textContent = "📊 Tampilkan Rekap";
  }
}

/* ================= RENDER LAPORAN ================= */

function renderReport(report) {
  $("summaryCard").classList.remove("hidden");
  $("mainCard").classList.remove("hidden");
  $("detailCard").classList.remove("hidden");

  $("period").textContent =
    `${dateFmt(report.periode?.mulai)} s/d ${dateFmt(report.periode?.akhir)}`;

  $("nSiswa").textContent =
    num(report.ringkasan?.jumlahSiswa);

  $("nReward").textContent =
    num(report.ringkasan?.totalPenghargaan);

  $("nViolation").textContent =
    num(report.ringkasan?.totalPelanggaran);

  $("nNet").textContent =
    num(report.ringkasan?.totalBersih);

  if (report.tipe === "kelas") {
    renderClasses(report);
    renderClassStudents(report);
  } else {
    $("classStudentCard").classList.add("hidden");
    renderStudents(report);
  }

  renderDetails(report);
  renderChart(report);
}

/* ================= REKAP SISWA / SEKOLAH ================= */

function renderStudents(report) {
  const data = Array.isArray(report.siswa)
    ? report.siswa
    : [];

  $("mainTitle").textContent =
    report.tipe === "siswa"
      ? "Rekap Per Siswa"
      : "Rekap Satu Sekolah";

  $("mainCount").textContent = `${data.length} siswa`;

  let html = `
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>NISN</th>
          <th>Nama</th>
          <th>Kelas</th>
          <th>Penghargaan</th>
          <th>Pelanggaran</th>
          <th>Poin Bersih</th>
          <th>Transaksi</th>
        </tr>
      </thead>
      <tbody>
  `;

  if (!data.length) {
    html += `
      <tr>
        <td colspan="8" class="empty">Tidak ada data siswa.</td>
      </tr>
    `;
  }

  data.forEach((item, index) => {
    html += `
      <tr>
        <td>${index + 1}</td>
        <td>${esc(item.nisn)}</td>
        <td>${esc(item.nama)}</td>
        <td>${esc(item.kelas)}</td>
        <td>${num(item.penghargaan)}</td>
        <td>${num(item.pelanggaran)}</td>
        <td>${num(item.total)}</td>
        <td>${num(item.transaksi)}</td>
      </tr>
    `;
  });

  $("mainTable").innerHTML = html + "</tbody></table>";
}

/* ================= REKAP KELAS ================= */

function renderClasses(report) {
  const data = Array.isArray(report.kelas)
    ? report.kelas
    : [];

  $("mainTitle").textContent = "Rekap Per Kelas";
  $("mainCount").textContent = `${data.length} kelas`;

  let html = `
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Kelas</th>
          <th>Jumlah Siswa</th>
          <th>Penghargaan</th>
          <th>Pelanggaran</th>
          <th>Poin Bersih</th>
          <th>Transaksi</th>
        </tr>
      </thead>
      <tbody>
  `;

  if (!data.length) {
    html += `
      <tr>
        <td colspan="7" class="empty">Tidak ada data kelas.</td>
      </tr>
    `;
  }

  data.forEach((item, index) => {
    html += `
      <tr>
        <td>${index + 1}</td>
        <td>${esc(item.kelas)}</td>
        <td>${num(item.jumlahSiswa)}</td>
        <td>${num(item.penghargaan)}</td>
        <td>${num(item.pelanggaran)}</td>
        <td>${num(item.total)}</td>
        <td>${num(item.transaksi)}</td>
      </tr>
    `;
  });

  $("mainTable").innerHTML = html + "</tbody></table>";
}

/* ================= REKAP POIN SETIAP SISWA DALAM KELAS ================= */

function renderClassStudents(report) {
  const selectedClassId = String($("kelas").value);

  const selectedClass = classes.find(
    item => String(item.id) === selectedClassId
  );

  const className =
    selectedClass?.nama_kelas ||
    selectedClass?.nama ||
    "-";

  $("classStudentCard").classList.remove("hidden");

  $("classPeriod").textContent =
    `Kelas ${className} • ${dateFmt(report.periode?.mulai)} s/d ${dateFmt(report.periode?.akhir)}`;

  /*
   * Daftar siswa aktif yang termasuk dalam kelas terpilih.
   * Data siswa diharapkan memiliki kelas_id.
   */
  const classStudents = students.filter(student => {
    const status = norm(student.status || "Aktif");

    const studentClassId = String(
      student.kelas_id ?? student.kelasId ?? ""
    );

    const studentClassName = String(
      student.kelas || student.nama_kelas || ""
    );

    const sameClass =
      studentClassId === selectedClassId ||
      (
        !studentClassId &&
        norm(studentClassName) === norm(className)
      );

    return status === "aktif" && sameClass;
  });

  const map = new Map();

  classStudents.forEach(student => {
    const nisn = String(student.nisn || "");

    map.set(nisn, {
      nisn: student.nisn || "-",
      nama: student.nama || "-",
      kelas: className,
      penghargaan: 0,
      pelanggaran: 0,
      total: 0,
      transaksi: 0
    });
  });

  /*
   * Hitung transaksi sesuai rentang tanggal laporan.
   */
  (report.transaksi || []).forEach(transaction => {
    const row = map.get(String(transaction.nisn || ""));

    if (!row) return;

    const type = norm(transaction.jenis);
    const points = Math.abs(num(transaction.poin));

    if (type === "penghargaan") {
      row.penghargaan += points;
      row.total += points;
    } else if (type === "pelanggaran") {
      row.pelanggaran += points;
      row.total -= points;
    } else {
      return;
    }

    row.transaksi++;
  });

  classRows = [...map.values()].sort((a, b) =>
    b.total - a.total ||
    a.nama.localeCompare(b.nama, "id")
  );

  $("classStudentCount").textContent =
    `${classRows.length} siswa`;

  let totalReward = 0;
  let totalViolation = 0;
  let totalNet = 0;
  let totalTransactions = 0;

  let html = `
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>NISN</th>
          <th>Nama Siswa</th>
          <th>Kelas</th>
          <th>Penghargaan</th>
          <th>Pelanggaran</th>
          <th>Poin Bersih</th>
          <th>Transaksi</th>
        </tr>
      </thead>
      <tbody>
  `;

  if (!classRows.length) {
    html += `
      <tr>
        <td colspan="8" class="empty">
          Tidak ditemukan siswa aktif. Periksa data kelas pada admin-students.
        </td>
      </tr>
    `;
  }

  classRows.forEach((student, index) => {
    totalReward += student.penghargaan;
    totalViolation += student.pelanggaran;
    totalNet += student.total;
    totalTransactions += student.transaksi;

    html += `
      <tr>
        <td>${index + 1}</td>

/* ================= GRAFIK ================= */

function renderChart(report) {
  $("chartCard").classList.remove("hidden");

  const data = (
    report.tipe === "siswa"
      ? report.siswa || []
      : report.kelas || []
  ).map(item => ({
    label: report.tipe === "siswa"
      ? item.nama
      : item.kelas,
    reward: num(item.penghargaan),
    violation: num(item.pelanggaran)
  }));

  $("chartTitle").textContent =
    report.tipe === "siswa"
      ? "Grafik Poin Siswa"
      : report.tipe === "kelas"
        ? "Grafik Poin Per Kelas"
        : "Grafik Poin Satu Sekolah";

  if (!data.length) {
    $("chart").innerHTML =
      '<p class="empty">Tidak ada data grafik.</p>';
    return;
  }

  const max = Math.max(
    1,
    ...data.map(item =>
      Math.max(item.reward, item.violation)
    )
  );

  const W = 1000;
  const H = 300;
  const L = 55;
  const R = 20;
  const T = 20;
  const B = 55;

  const chartHeight = H - T - B;
  const chartWidth = W - L - R;
  const groupWidth = chartWidth / data.length;

  const barWidth = Math.max(
    6,
    Math.min(24, groupWidth * .24)
  );

  const gap = Math.max(3, groupWidth * .06);

  let svg = `
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}">
  `;

  for (let i = 0; i <= 4; i++) {
    const percentage = i / 4;
    const y = T + chartHeight - chartHeight * percentage;

    svg += `
      <line
        x1="${L}" y1="${y}"
        x2="${W-R}" y2="${y}"
        stroke="#ccc"
        stroke-dasharray="4 4"
      ></line>

      <text
        class="chartlabel"
        x="${L-8}"
        y="${y+4}"
        fill="#cbd5e1"
        font-size="11"
        text-anchor="end"
      >${Math.round(max * percentage)}</text>
    `;
  }

  data.forEach((item, index) => {
    const center =
      L + groupWidth * index + groupWidth / 2;

    const rewardHeight =
      item.reward / max * chartHeight;

    const violationHeight =
      item.violation / max * chartHeight;

    const rewardX = center - barWidth - gap / 2;
    const violationX = center + gap / 2;

    const rewardY =
      T + chartHeight - rewardHeight;

    const violationY =
      T + chartHeight - violationHeight;

    svg += `
      <rect
        class="barreward"
        x="${rewardX}"
        y="${rewardY}"
        width="${barWidth}"
        height="${rewardHeight}"
        fill="#16a34a"
        rx="3"
      ></rect>

      <rect
        class="barviolation"
        x="${violationX}"
        y="${violationY}"
        width="${barWidth}"
        height="${violationHeight}"
        fill="#dc2626"
        rx="3"
      ></rect>
    `;

    if (item.reward) {
      svg += `
        <text
          class="chartvalue"
          x="${rewardX + barWidth/2}"
          y="${Math.max(12,rewardY-5)}"
          fill="#fff"
          font-size="11"
          text-anchor="middle"
        >${item.reward}</text>
      `;
    }

    if (item.violation) {
      svg += `
        <text
          class="chartvalue"
          x="${violationX + barWidth/2}"
          y="${Math.max(12,violationY-5)}"
          fill="#fff"
          font-size="11"
          text-anchor="middle"
        >${item.violation}</text>
      `;
    }

    let label = String(item.label || "-");

    if (label.length > 14) {
      label = label.slice(0,13) + "…";
    }

    svg += `
      <text
        class="chartlabel"
        x="${center}"
        y="${H-24}"
        fill="#cbd5e1"
        font-size="11"
        text-anchor="middle"
      >${esc(label)}</text>
    `;
  });

  $("chart").innerHTML = svg + "</svg>";
}

/* ================= NAMA FILE ================= */

function targetName() {
  if (!reportData) return "rekap";

  if (reportData.tipe === "siswa") {
    return students.find(
      item => String(item.id) === String($("siswa").value)
    )?.nama || "siswa";
  }

  if (reportData.tipe === "kelas") {
    const selected = classes.find(
      item => String(item.id) === String($("kelas").value)
    );

    return selected?.nama_kelas ||
      selected?.nama ||
      "kelas";
  }

  return "sekolah";
}

function safeName(value) {
  return String(value || "rekap")
    .trim()
    .replace(/[^a-z0-9_-]+/gi,"-")
    .replace(/^-+|-+$/g,"")
    .toLowerCase() || "rekap";
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportRows() {
  const report = reportData;

  const rows = [
    ["REKAP POIN LENTERA SMANTI"],
    ["Tanggal Mulai", report.periode?.mulai],
    ["Tanggal Akhir", report.periode?.akhir],
    ["Jenis Rekap", report.tipe],
    ["Target", targetName()],
    [],
    ["RINGKASAN"],
    ["Jumlah Siswa", report.ringkasan?.jumlahSiswa],
    ["Total Penghargaan", report.ringkasan?.totalPenghargaan],
    ["Total Pelanggaran", report.ringkasan?.totalPelanggaran],
    ["Poin Bersih", report.ringkasan?.totalBersih],
    ["Total Transaksi", report.ringkasan?.totalTransaksi],
    []
  ];

  if (report.tipe === "kelas") {
    rows.push(
      ["REKAP PER KELAS"],

        "Jumlah Siswa",
        "Penghargaan",
        "Pelanggaran",
        "Poin Bersih",
        "Transaksi"
      ]
    );

    (report.kelas || []).forEach(item => {
      rows.push([
        item.kelas,
        item.jumlahSiswa,
        item.penghargaan,
        item.pelanggaran,
        item.total,
        item.transaksi
      ]);
    });

    rows.push(
      [],
      ["REKAP POIN SETIAP SISWA"],
      [
        "NISN",
        "Nama",
        "Kelas",
        "Penghargaan",
        "Pelanggaran",
        "Poin Bersih",
        "Transaksi"
      ]
    );

    classRows.forEach(item => {
      rows.push([
        item.nisn,
        item.nama,
        item.kelas,
        item.penghargaan,
        item.pelanggaran,
        item.total,
        item.transaksi
      ]);
    });

  } else {
    rows.push(
      ["REKAP SISWA"],
      [
        "NISN",
        "Nama",
        "Kelas",
        "Penghargaan",
        "Pelanggaran",
        "Poin Bersih",
        "Transaksi"
      ]
    );

    (report.siswa || []).forEach(item => {
      rows.push([
        item.nisn,
        item.nama,
        item.kelas,
        item.penghargaan,
        item.pelanggaran,
        item.total,
        item.transaksi
      ]);
    });
  }

  rows.push(
    [],
    ["DETAIL TRANSAKSI"],
    [
      "Tanggal",
      "NISN",
      "Nama",
      "Kelas",
      "Jenis",
      "Poin",
      "Keterangan",
      "Dibuat Oleh",
      "Peran"
    ]
  );

  (report.transaksi || []).forEach(item => {
    rows.push([
      item.tanggal,
      item.nisn,
      item.nama,
      item.kelas,
      item.jenis,
      item.poin,
      item.keterangan,
      item.dibuatOleh,
      item.peran
    ]);
  });

  return rows;
}

/* ================= EKSPOR CSV ================= */

$("csv").addEventListener("click", () => {
  if (!reportData) {
    alert("Tampilkan rekap terlebih dahulu.");
    return;
  }

  const rows = exportRows();

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value ?? "").replace(/"/g,'""') + '"'
    ).join(",")
  ).join("\r\n");

  const filename =
    `rekap-${safeName(targetName())}-${reportData.periode.mulai}-${reportData.periode.akhir}.csv`;

  download(
    new Blob([csv], {
      type: "text/csv;charset=utf-8"
    }),
    filename
  );
});

/* ================= EKSPOR XLS ================= */

$("xls").addEventListener("click", () => {
  if (!reportData) {
    alert("Tampilkan rekap terlebih dahulu.");
    return;
  }

  const rows = exportRows();

  let html = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
    </head>
    <body>
      <table border="1">
  `;

  rows.forEach(row => {
    html += "<tr>";

    row.forEach(value => {
      html += `<td>${esc(value)}</td>`;
    });

    html += "</tr>";
  });

  html += `
      </table>
    </body>
    </html>
  `;

  const filename =
    `rekap-${safeName(targetName())}-${reportData.periode.mulai}-${reportData.periode.akhir}.xls`;

  download(
    new Blob([html], {
      type: "application/vnd.ms-excel;charset=utf-8"
    }),
    filename
  );
});
