<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - LENTERA SMANTI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="dashboard-container">

    <section class="dashboard-card">

      <div class="dashboard-header">
        <div class="logo-small">L</div>

        <div>
          <h1>LENTERA SMANTI</h1>
          <p>Dashboard Siswa</p>
        </div>
      </div>

      <div class="welcome">
        <p>Selamat datang,</p>
        <h2 id="namaSiswa">Memuat...</h2>
      </div>

      <div class="student-info">

        <div class="info-item">
          <span>NISN</span>
          <strong id="nisnSiswa">-</strong>
        </div>

        <div class="info-item">
          <span>Kelas</span>
          <strong id="kelasSiswa">-</strong>
        </div>

      </div>

      <div class="points-container">

        <section class="history-section">
  <div class="section-title">
    <h3>Riwayat Poin</h3>
    <p>Catatan penghargaan dan pelanggaran</p>
  </div>

  <div id="riwayatPoin" class="history-list">
    <div class="history-empty">
      Memuat riwayat...
    </div>
  </div>
</section>

        <div class="point-card penghargaan">
          <span>🏆</span>
          <p>Poin Penghargaan</p>
          <strong id="poinPenghargaan">0</strong>
        </div>

        <div class="point-card pelanggaran">
          <span>⚠️</span>
          <p>Poin Pelanggaran</p>
          <strong id="poinPelanggaran">0</strong>
        </div>

      </div>

      <button id="logoutButton" class="logout-button">
        Keluar
      </button>

    </section>

  </main>

  <script>
    const session = sessionStorage.getItem("lentera_session");

    if (!session) {
      window.location.href = "index.html";
    }

    try {
      const siswa = JSON.parse(session);

      document.getElementById("namaSiswa").textContent =
        siswa.nama || "-";

      document.getElementById("nisnSiswa").textContent =
        siswa.nisn || "-";

      document.getElementById("kelasSiswa").textContent =
  siswa.kelas || "-";

      async function loadPoints() {
  const session = sessionStorage.getItem("lentera_session");

  if (!session) {
    window.location.href = "index.html";
    return;
  }

  try {
    const siswa = JSON.parse(session);

    const response = await fetch(
      "/.netlify/functions/student-dashboard",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          siswaId: siswa.id
        })
      }
    );

    const result = await response.json();

    if (!result.success) {
      console.error(result.message);
      return;
    }

    // Total poin
    document.getElementById("poinPenghargaan").textContent =
      result.poin.penghargaan;

    document.getElementById("poinPelanggaran").textContent =
      result.poin.pelanggaran;

    // Riwayat poin
    const riwayatContainer =
      document.getElementById("riwayatPoin");

    riwayatContainer.innerHTML = "";

    if (!result.riwayat || result.riwayat.length === 0) {
      riwayatContainer.innerHTML = `
        <div class="history-empty">
          Belum ada riwayat poin.
        </div>
      `;

      return;
    }

    // Terbaru ditampilkan terlebih dahulu
    const riwayat = [...result.riwayat].reverse();

    riwayat.forEach((item) => {
      const div = document.createElement("div");

      div.className = "history-item";

      const jenis =
        String(item.jenis).toLowerCase();

      const tanda =
        jenis === "penghargaan" ? "+" : "-";

      div.innerHTML = `
        <div class="history-top">
          <span class="history-type">
            ${jenis === "penghargaan"
              ? "🏆 Penghargaan"
              : "⚠️ Pelanggaran"}
          </span>

          <span class="history-poin">
            ${tanda}${item.poin}
          </span>
        </div>

        <div class="history-description">
          ${item.keterangan || "Tidak ada keterangan"}
        </div>

        <div class="history-date">
          ${item.tanggal || "-"}
        </div>
      `;

      riwayatContainer.appendChild(div);
    });

  } catch (error) {
    console.error("Gagal mengambil poin:", error);

    document.getElementById("riwayatPoin").innerHTML = `
      <div class="history-empty">
        Gagal memuat riwayat poin.
      </div>
    `;
  }
}
    );

    const result = await response.json();

    if (!result.success) {
      console.error(result.message);
      return;
    }

    document.getElementById("poinPenghargaan").textContent =
      result.poin.penghargaan;

    document.getElementById("poinPelanggaran").textContent =
      result.poin.pelanggaran;

  } catch (error) {
    console.error("Gagal mengambil poin:", error);
  }
}

loadPoints();

    } catch (error) {
      sessionStorage.removeItem("lentera_session");
      window.location.href = "index.html";
    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", () => {

        sessionStorage.removeItem("lentera_session");

        window.location.href = "index.html";
      });
  </script>

</body>
</html>
