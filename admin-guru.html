<body>

<header>
  <div>
    <h1>Manajemen Akun Guru</h1>
    <p>LENTERA SMANTI — Panel Administrator</p>
  </div>

  <button class="back-btn" onclick="window.location.href='admin.html'">
    ← Kembali
  </button>
</header>

<div class="container">

  <div id="statusMessage" class="status"></div>

  <div class="toolbar">
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Cari nama atau username guru..."
      oninput="renderGuru()"
    >

    <button class="add-btn" onclick="openAddModal()">
      + Tambah Guru
    </button>
  </div>

  <div id="guruList" class="guru-list">
    <div class="loading">Memuat akun guru...</div>
  </div>

</div>

<!-- MODAL TAMBAH / EDIT -->

<div id="guruModal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">Tambah Akun Guru</h2>

    <form id="guruForm">

      <input type="hidden" id="guruId">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          required
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="nama">Nama Guru</label>
        <input
          type="text"
          id="nama"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="new-password"
        >
        <small id="passwordHelp" style="color:#8f9baa;display:block;margin-top:5px;">
          Wajib diisi untuk akun baru.
        </small>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="Aktif">Aktif</option>
          <option value="Nonaktif">Nonaktif</option>
        </select>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="cancel-btn"
          onclick="closeModal()"
        >
          Batal
        </button>

        <button
          type="submit"
          class="save-btn"
        >
          Simpan
        </button>
      </div>

    </form>

  </div>
</div>

<script>
  const adminSession = sessionStorage.getItem("lentera_admin_session");

  if (!adminSession) {
    window.location.href = "admin-login.html";
  }

  let guruData = [];
  let editingGuru = null;

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function showStatus(message, type = "success") {
    const el = document.getElementById("statusMessage");

    el.textContent = message;
    el.className = "status " + type;

    setTimeout(() => {
      el.className = "status";
    }, 4000);
  }

  async function loadGuru() {
    const list = document.getElementById("guruList");

    list.innerHTML = `
      <div class="loading">
        Memuat akun guru...
      </div>
    `;

    try {
      const response = await fetch("/.netlify/functions/admin-guru");

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Gagal memuat akun guru.");
      }

      guruData = result.guru || [];

      renderGuru();

    } catch (error) {
      console.error(error);

      list.innerHTML = `
        <div class="empty">
          Gagal memuat akun guru.<br>
          <small>${escapeHtml(error.message)}</small>
        </div>
      `;
    }
  }

  function renderGuru() {
    const list = document.getElementById("guruList");
    const keyword = document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

    const filtered = guruData.filter(guru => {
      const nama = String(guru.nama || "").toLowerCase();
      const username = String(guru.username || "").toLowerCase();

      return (
        nama.includes(keyword) ||
        username.includes(keyword)
      );
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty">
          Tidak ada akun guru yang ditemukan.
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(guru => {

      const aktif =
        String(guru.status || "").toLowerCase() === "aktif";

      return `
        <div class="guru-card">

          <div class="guru-header">

            <div>
              <div class="guru-name">
                ${escapeHtml(guru.nama || "-")}
              </div>

              <div class="guru-username">
                @${escapeHtml(guru.username || "-")}
              </div>
            </div>

            <span class="status-badge ${
              aktif
                ? "status-aktif"
                : "status-nonaktif"
            }">
              ${escapeHtml(guru.status || "Nonaktif")}
            </span>

          </div>

          <div class="guru-actions">

            <button
              class="action-btn"
              onclick="editGuru('${escapeHtml(guru.id)}')"
            >
              ✏️ Edit
            </button>

            <button
              class="action-btn"
              onclick="resetPassword('${escapeHtml(guru.id)}')"
            >
              🔑 Reset Password
            </button>

            <button
              class="action-btn"
              onclick="toggleStatus('${escapeHtml(guru.id)}')"
            >
              ${aktif ? "🔒 Nonaktifkan" : "🔓 Aktifkan"}
            </button>

            <button
              class="action-btn action-danger"
              onclick="deleteGuru('${escapeHtml(guru.id)}')"
            >
              🗑️ Hapus
            </button>

          </div>

        </div>
      `;
    }).join("");
  }

  function openAddModal() {

    editingGuru = null;

    document.getElementById("modalTitle").textContent =
      "Tambah Akun Guru";

    document.getElementById("guruId").value = "";
    document.getElementById("username").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("password").value = "";
    document.getElementById("status").value = "Aktif";

    document.getElementById("username").disabled = false;

    document.getElementById("passwordHelp").textContent =
      "Wajib diisi untuk akun baru.";

    document.getElementById("guruModal").classList.add("active");

    setTimeout(() => {
      document.getElementById("username").focus();
    }, 100);
  }

  function editGuru(id) {

    const guru = guruData.find(
      item => String(item.id) === String(id)
    );

    if (!guru) {
      showStatus("Data guru tidak ditemukan.", "error");
      return;
    }

    editingGuru = guru;

    document.getElementById("modalTitle").textContent =
      "Edit Akun Guru";

    document.getElementById("guruId").value =
      guru.id || "";

    document.getElementById("username").value =
      guru.username || "";

    document.getElementById("nama").value =
      guru.nama || "";

    document.getElementById("password").value = "";

    document.getElementById("status").value =
      guru.status || "Aktif";

    /*
      Username tidak diubah saat edit.
      Jika ingin mengganti username,
      gunakan akun baru agar riwayat poin
      tetap konsisten.
    */
    document.getElementById("username").disabled = true;

    document.getElementById("passwordHelp").textContent =
      "Kosongkan jika password tidak ingin diubah.";

    document.getElementById("guruModal").classList.add("active");
  }

  function closeModal() {
    document.getElementById("guruModal")
      .classList.remove("active");

    editingGuru = null;
  }

  document.getElementById("guruForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const id =
        document.getElementById("guruId").value.trim();

      const username =
        document.getElementById("username").value.trim();

      const nama =
        document.getElementById("nama").value.trim();

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("status").value;

      if (!username || !nama) {
        showStatus(
          "Username dan nama guru wajib diisi.",
          "error"
        );
        return;
      }

      if (!editingGuru && !password) {
        showStatus(
          "Password wajib diisi untuk akun baru.",
          "error"
        );
        return;
      }

      const admin = getAdminUsername();

      try {

        let response;

        if (editingGuru) {

          const payload = {
            id,
            nama,
            status,
            admin
          };

          if (password) {
            payload.password = password;
          }

          response = await fetch(
            "/.netlify/functions/admin-guru",
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            }
          );

        } else {

          response = await fetch(
            "/.netlify/functions/admin-guru",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                username,
                nama,
                password,
                status,
                admin
              })
            }
          );
        }

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            "Gagal menyimpan akun guru."
          );
        }

        closeModal();

        showStatus(
          editingGuru
            ? "Akun guru berhasil diperbarui."
            : "Akun guru berhasil ditambahkan."
        );

        await loadGuru();

      } catch (error) {

        console.error(error);

        showStatus(
          error.message ||
          "Terjadi kesalahan.",
          "error"
        );
      }
    });

  async function resetPassword(id) {

    const guru = guruData.find(
      item => String(item.id) === String(id)
    );

    if (!guru) return;

    const password = prompt(
      "Masukkan password baru untuk @" +
      guru.username
    );

    if (password === null) return;

    if (!password.trim()) {
      showStatus(
        "Password tidak boleh kosong.",
        "error"
      );
      return;
    }

    try {

      const response = await fetch(
        "/.netlify/functions/admin-guru",
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: guru.id,
            password: password,
            admin: getAdminUsername()
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Gagal mereset password."
        );
      }

      showStatus(
        "Password @" +
        guru.username +
        " berhasil diubah."
      );

      await loadGuru();

    } catch (error) {

      showStatus(
        error.message,
        "error"
      );
    }
  }

  async function toggleStatus(id) {

    const guru = guruData.find(
      item => String(item.id) === String(id)
    );

    if (!guru) return;

    const aktif =
      String(guru.status || "").toLowerCase() === "aktif";

    const newStatus =
      aktif ? "Nonaktif" : "Aktif";

    const actionText =
      aktif ? "menonaktifkan" : "mengaktifkan";

    const yakin = confirm(
      `Yakin ingin ${actionText} akun @${guru.username}?`
    );

    if (!yakin) return;

    try {

      const response = await fetch(
        "/.netlify/functions/admin-guru",
        {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: guru.id,
            status: newStatus,
            admin: getAdminUsername()
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Gagal mengubah status akun."
        );
      }

      showStatus(
        `Akun @${guru.username} sekarang ${newStatus}.`
      );

      await loadGuru();

    } catch (error) {

      showStatus(
        error.message,
        "error"
      );
    }
  }

  async function deleteGuru(id) {

    const guru = guruData.find(
      item => String(item.id) === String(id)
    );

    if (!guru) return;

    const yakin = confirm(
      `Yakin ingin menghapus akun @${guru.username}?\n\n` +
      "Data poin yang sudah dibuat oleh guru ini " +
      "tidak ikut dihapus."
    );

    if (!yakin) return;

    try {

      const response = await fetch(
        "/.netlify/functions/admin-guru",
        {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            id: guru.id,
            admin: getAdminUsername()
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error ||
          "Gagal menghapus akun guru."
        );
      }

      showStatus(
        "Akun @" +
        guru.username +
        " berhasil dihapus."
      );

      await loadGuru();

    } catch (error) {

      showStatus(
        error.message,
        "error"
      );
    }
  }

  function getAdminUsername() {

    try {

      const session =
        JSON.parse(
          sessionStorage.getItem(
            "lentera_admin_session"
          ) || "{}"
        );

      return (
        session.username ||
        session.user ||
        "admin"
      );

    } catch {

      return "admin";
    }
  }

  document.getElementById("guruModal")
    .addEventListener("click", function(event) {

      if (event.target === this) {
        closeModal();
      }

    });

  loadGuru();
</script>

</body>
</html>
```
