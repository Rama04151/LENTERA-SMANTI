<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LENTERA SMANTI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(251, 192, 45, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* Logo Styling */
    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo-circle {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-weight: 800;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      box-shadow: 0 6px 20px var(--gold-glow);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 14px;
      color: var(--accent-gold);
      font-weight: 500;
      margin-top: 4px;
      margin-bottom: 28px;
    }

    /* Form & Input Styling */
    form {
      text-align: left;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    /* Password Wrapper */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .password-wrapper button {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .password-wrapper button:hover {
      color: var(--accent-gold);
    }

    /* Message / Alert Paragraph */
    #message {
      font-size: 13px;
      color: var(--danger-color);
      min-height: 20px;
      margin-top: -6px;
      margin-bottom: 14px;
      text-align: center;
    }

    /* Submit Button */
    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .login-button:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 192, 45, 0.4);
    }

    .login-button:active {
      transform: translateY(0);
    }

    /* Footer */
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <div class="login-card">

      <div class="logo">
        <div class="logo-circle">L</div>
      </div>

      <h1>LENTERA SMANTI</h1>
      <p class="subtitle">Sistem Poin Siswa</p>

      <form id="loginForm">

        <div class="input-group">
          <label for="nisn">NISN</label>
          <input
            type="text"
            id="nisn"
            placeholder="Masukkan NISN"
            inputmode="numeric"
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >

            <button type="button" id="togglePassword" aria-label="Tampilkan password">
              👁
            </button>
          </div>
        </div>

        <p id="message"></p>

        <button type="submit" class="login-button">
          MASUK
        </button>

      </form>

      <footer>
        © 2026 LENTERA SMANTI
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
