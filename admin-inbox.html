<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inbox Siswa - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;

      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;

      --text-main: #ffffff;
      --text-muted: #94a3b8;

      --border-color:
        rgba(255,255,255,0.08);

      --success:
        #10b981;

      --danger:
        #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        'Plus Jakarta Sans',
        sans-serif;
    }

    body {

      min-height: 100vh;

      padding: 20px;

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(251,192,45,0.06),
          transparent 40%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(28,37,65,0.6),
          transparent 50%
        ),

        var(--bg-dark);

      color:
        var(--text-main);

    }

    .container {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      background:
        var(--card-bg);

      border:
        1px solid
        var(--border-color);

      border-radius: 24px;

      padding: 25px;

      box-shadow:
        0 20px 40px
        rgba(0,0,0,0.4);

    }

    h1 {

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 5px;

    }

    .subtitle {

      color:
        var(--text-muted);

      font-size: 13px;

      margin-bottom: 20px;

    }

    .back-button {

      width: 100%;

      padding: 12px;

      border:
        1px solid
        var(--border-color);

      border-radius: 12px;

      background:
        rgba(255,255,255,0.08);

      color:
        white;

      font-weight: 700;

      cursor: pointer;

      margin-bottom: 20px;

    }

    .section {

      background:
        rgba(11,19,43,0.5);

      border:
        1px solid
        var(--border-color);

      border-radius: 17px;

      padding: 18px;

      margin-bottom: 18px;

    }

    .section-title {

      color:
        var(--accent-gold);

      font-size: 15px;

      font-weight: 800;

      margin-bottom: 15px;

    }

    label {

      display: block;

      color:
        var(--text-muted);

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 6px;

    }

    input,
    textarea,
    select {

      width: 100%;

      border:
        1px solid
        var(--border-color);

      border-radius: 11px;

      padding: 12px;

      background:
        rgba(11,19,43,0.8);

      color:
        white;

      outline: none;

      font-size: 13px;

      margin-bottom: 13px;

    }

    input:focus,
    textarea:focus,
    select:focus {

      border-color:
        var(--accent-gold);

    }

    textarea {

      min-height: 130px;

      resize: vertical;

      line-height: 1.5;

    }

    select option {

      background:
        var(--card-bg);

      color:
        white;

    }

    .student-search-wrapper {

      position: relative;

    }

    .student-results {

      max-height: 200px;

      overflow-y: auto;

      margin-top: -8px;

      margin-bottom: 13px;

      border:
        1px solid
        var(--border-color);

      border-radius: 11px;

      background:
        #141d35;

      display: none;

      overflow-x: hidden;

    }

    .student-result {

      padding: 11px 12px;

      border-bottom:
        1px solid
        var(--border-color);

      cursor: pointer;

    }

    .student-result:last-child {

      border-bottom:
        none;

    }

    .student-result:hover {

      background:
        rgba(251,192,45,0.08);

    }

    .student-result strong {

      display: block;

      font-size: 13px;

      color:
        white;

      margin-bottom: 3px;

    }

    .student-result span {

      font-size: 11px;

      color:
        var(--text-muted);

    }

    .selected-student {

      display: none;

      padding: 11px 12px;

      margin-bottom: 13px;

      border:
        1px solid
        rgba(16,185,129,0.25);

      border-radius: 11px;

      background:
        rgba(16,185,129,0.08);

    }

    .selected-student strong {

      display: block;

      color:
        var(--success);

      font-size: 13px;

      margin-bottom: 3px;

    }

    .selected-student span {

      color:
        var(--text-muted);

      font-size: 11px;

    }

    .send-button {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 12px;

      background:
        var(--accent-gold);

      color:
        #111827;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

    }

    .send-button:hover {

      background:
        var(--accent-gold-hover);

      transform:
        translateY(-1px);

    }

    .send-button:disabled {

      opacity: 0.6;

      cursor:
        not-allowed;

      transform:
        none;

    }

    .message {

      display: none;

      padding: 11px;

      margin-top: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 12px;

    }

    .message.success {

      display: block;

      background:
        rgba(16,185,129,0.1);

      color:
        var(--success);

    }

    .message.error {

      display: block;

      background:
        rgba(239,68,68,0.1);

      color:
        #f87171;

    }

    .inbox-item {

      padding: 14px;

      border:
        1px solid
        var(--border-color);

      border-radius: 13px;

      background:
        rgba(28,37,65,0.5);

      margin-bottom: 10px;

    }

    .inbox-item-title {

      font-size: 14px;

      font-weight: 800;

      color:
        white;

      margin-bottom: 5px;

    }

    .inbox-item-text {

      font-size: 12px;

      line-height: 1.5;

      color:
        var(--text-muted);

      white-space: pre-wrap;

      overflow-wrap: anywhere;

    }

    .inbox-item-meta {

      margin-top: 10px;

      padding-top: 9px;

      border-top:
        1px solid
        var(--border-color);

      font-size: 10px;

      line-height: 1.6;

      color:
        var(--text-muted);

    }

    .empty {

      text-align: center;

      padding: 25px;

      color:
        var(--text-muted);

      font-size: 12px;

    }

    .loading {

      text-align: center;

      padding: 20px;

      color:
        var(--text-muted);

      font-size: 12px;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>📨 Inbox Siswa</h1>

    <p class="subtitle">
      Kirim pesan langsung kepada siswa.
    </p>

    <button
      type="button"
      class="back-button"
      onclick="window.location.href='admin.html'"
    >
      ← Kembali
    </button>


    <!-- =========================
         FORM KIRIM PESAN
    ========================== -->

    <div class="section">

      <div class="section-title">
        ✉️ Buat Pesan
      </div>


      <label>
        Siswa Tujuan
      </label>

      <div class="student-search-wrapper">

        <input
          type="text"
          id="studentSearch"
          placeholder="Cari nama atau NISN..."
          autocomplete="off"
          oninput="searchStudents()"
        >

        <div
          id="studentResults"
          class="student-results"
        ></div>

      </div>


      <div
        id="selectedStudent"
        class="selected-student"
      ></div>


      <label>
        Judul Pesan
      </label>

      <input
        type="text"
        id="messageTitle"
        maxlength="100"
        placeholder="Contoh: Pengumuman Rapat OSIS"
      >


      <label>
        Isi Pesan
      </label>

      <textarea
        id="messageText"
        maxlength="2000"
        placeholder="Tulis pesan untuk siswa..."
      ></textarea>


      <label>
        Pesan Berlaku Selama
      </label>

      <select id="messageDuration">

        <option value="1h">
          1 jam
        </option>

        <option value="3h">
          3 jam
        </option>

        <option value="6h">
          6 jam
        </option>

        <option value="12h">
          12 jam
        </option>

        <option value="1d">
          1 hari
        </option>

        <option value="3d">
          3 hari
        </option>

        <option value="7d">
          7 hari
        </option>

      </select>


      <button
        type="button"
        id="sendButton"
        class="send-button"
        onclick="sendMessage()"
      >
        📨 Kirim Pesan
      </button>


      <div
        id="sendMessageResult"
        class="message"
      ></div>

    </div>


    <!-- =========================
         PESAN TERKIRIM
    ========================== -->

    <div class="section">

      <div class="section-title">
        📋 Pesan Terkirim
      </div>

      <div id="sentMessages">

        <div class="loading">
          Memuat pesan...
        </div>

      </div>

    </div>

  </div>


  <script>

    // =========================
    // CEK LOGIN ADMIN
    // =========================

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {

      window.location.href =
        "admin-login.html";

    }


    let adminData = {};

    try {

      adminData =
        JSON.parse(adminSession);

    } catch (error) {

      sessionStorage.removeItem(
        "lentera_admin_session"
      );

      window.location.href =
        "admin-login.html";

    }


    // =========================
    // DATA SISWA
    // =========================

    let students = [];

    let selectedStudent = null;


    // =========================
    // ESCAPE HTML
    // =========================

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    // =========================
    // LOAD SISWA
    // =========================

    async function loadStudents() {

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students"
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Gagal mengambil siswa."
          );

        }

        students =
          (result.siswa || [])
            .filter(
              siswa =>
                String(siswa.status)
                  .toLowerCase() ===
                "aktif"
            );

      }
      catch (error) {

        console.error(
          "LOAD STUDENTS ERROR:",
          error
        );

      }

    }


    // =========================
    // CARI SISWA
    // =========================

    function searchStudents() {

      const input =
        document.getElementById(
          "studentSearch"
        );

      const results =
        document.getElementById(
          "studentResults"
        );

      const keyword =
        input.value
          .trim()
          .toLowerCase();

      if (!keyword) {

        results.style.display =
          "none";

        results.innerHTML =
          "";

        return;

      }

      const filtered =
        students
          .filter(siswa => {

            const nama =
              String(
                siswa.nama || ""
              ).toLowerCase();

            const nisn =
              String(
                siswa.nisn || ""
              ).toLowerCase();

            return (
              nama.includes(keyword) ||
              nisn.includes(keyword)
            );

          })
          .slice(0, 30);


      if (filtered.length === 0) {

        results.innerHTML = `

          <div class="empty">
            Siswa tidak ditemukan.
          </div>

        `;

        results.style.display =
          "block";

        return;

      }


      results.innerHTML =
        filtered.map(
          siswa => `

            <div
              class="student-result"
              onclick="selectStudent('${escapeHtml(
                siswa.id
              )}')"
            >

              <strong>
                ${escapeHtml(
                  siswa.nama
                )}
              </strong>

              <span>
                NISN:
                ${escapeHtml(
                  siswa.nisn
                )}

                • Kelas:
                ${escapeHtml(
                  siswa.kelas
                )}
              </span>

            </div>

          `
        ).join("");

      results.style.display =
        "block";

    }


    // =========================
    // PILIH SISWA
    // =========================

    function selectStudent(id) {

      const siswa =
        students.find(
          item =>
            String(item.id) ===
            String(id)
        );

      if (!siswa) {
        return;
      }

      selectedStudent =
        siswa;

      document.getElementById(
        "studentSearch"
      ).value =
        siswa.nama;

      const selected =
        document.getElementById(
          "selectedStudent"
        );

      selected.innerHTML = `

        <strong>
          ✓ Siswa dipilih
        </strong>

        <span>
          ${escapeHtml(
            siswa.nama
          )}
          • NISN:
          ${escapeHtml(
            siswa.nisn
          )}
          • Kelas:
          ${escapeHtml(
            siswa.kelas
          )}
        </span>

      `;

      selected.style.display =
        "block";

      document.getElementById(
        "studentResults"
      ).style.display =
        "none";

    }


    // =========================
    // KIRIM PESAN
    // =========================

    async function sendMessage() {

      const title =
        document.getElementById(
          "messageTitle"
        ).value.trim();

      const message =
        document.getElementById(
          "messageText"
        ).value.trim();

      const duration =
        document.getElementById(
          "messageDuration"
        ).value;

      const resultBox =
        document.getElementById(
          "sendMessageResult"
        );

      const button =
        document.getElementById(
          "sendButton"
        );


      function showResult(
        text,
        type
      ) {

        resultBox.textContent =
          text;

        resultBox.className =
          `message ${type}`;

      }


      if (!selectedStudent) {

        showResult(
          "Silakan pilih siswa tujuan.",
          "error"
        );

        return;

      }


      if (!title) {

        showResult(
          "Judul pesan wajib diisi.",
          "error"
        );

        return;

      }


      if (!message) {

        showResult(
          "Isi pesan wajib diisi.",
          "error"
        );

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "Mengirim...";


      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-inbox",
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  siswaId:
                    selectedStudent.id,

                  judul:
                    title,

                  pesan:
                    message,

                  durasi:
                    duration,

                  admin:
                    adminData.username ||
                    "admin"

                })

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          showResult(
            result.message ||
            "Pesan gagal dikirim.",
            "error"
          );

          return;

        }


        showResult(
          "✓ Pesan berhasil dikirim ke siswa.",
          "success"
        );


        // Reset form

        selectedStudent =
          null;

        document.getElementById(
          "studentSearch"
        ).value =
          "";

        document.getElementById(
          "messageTitle"
        ).value =
          "";

        document.getElementById(
          "messageText"
        ).value =
          "";

        document.getElementById(
          "studentResults"
        ).style.display =
          "none";

        document.getElementById(
          "selectedStudent"
        ).style.display =
          "none";


        loadSentMessages();

      }
      catch (error) {

        console.error(
          "SEND MESSAGE ERROR:",
          error
        );

        showResult(
          "Terjadi kesalahan koneksi.",
          "error"
        );

      }
      finally {

        button.disabled =
          false;

        button.textContent =
          "📨 Kirim Pesan";

      }

    }


    // =========================
    // LOAD PESAN TERKIRIM
    // =========================

    async function loadSentMessages() {

      const container =
        document.getElementById(
          "sentMessages"
        );

      container.innerHTML = `

        <div class="loading">
          Memuat pesan...
        </div>

      `;


      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-inbox"
          );

        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "Gagal mengambil pesan."
          );

        }


        const messages =
          result.inbox || [];


        if (
          messages.length === 0
        ) {

          container.innerHTML = `

            <div class="empty">
              📭 Belum ada pesan terkirim.
            </div>

          `;

          return;

        }


        // Terbaru di atas

        messages.sort(
          (a, b) =>
            new Date(b.dibuat) -
            new Date(a.dibuat)
        );


        container.innerHTML =
          messages.map(
            item => `

              <div class="inbox-item">

                <div class="inbox-item-title">
                  ${escapeHtml(
                    item.judul
                  )}
                </div>

                <div class="inbox-item-text">
                  ${escapeHtml(
                    item.pesan
                  )}
                </div>

                <div class="inbox-item-meta">

                  👤 Siswa ID:
                  ${escapeHtml(
                    item.siswaId
                  )}

                  <br>

                  🕒 Dibuat:
                  ${formatDate(
                    item.dibuat
                  )}

                  <br>

                  ⏳ Kedaluwarsa:
                  ${formatDate(
                    item.kedaluwarsa
                  )}

                  <br>

                  🛠 Admin:
                  ${escapeHtml(
                    item.admin
                  )}

                </div>

              </div>

            `
          ).join("");

      }
      catch (error) {

        console.error(
          "LOAD SENT MESSAGES ERROR:",
          error
        );

        container.innerHTML = `

          <div class="empty">
            Gagal memuat pesan.
          </div>

        `;

      }

    }


    // =========================
    // FORMAT TANGGAL
    // =========================

    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "-";
      }

      const date =
        new Date(dateString);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "-";

      }

      return date.toLocaleString(
        "id-ID",
        {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    // =========================
    // LOAD AWAL
    // =========================

    loadStudents();

    loadSentMessages();

  </script>

</body>

</html>
