<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Import Siswa - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- SheetJS untuk membaca dan membuat XLS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;

      background-image:
        radial-gradient(
          circle at 10% 20%,
          rgba(251, 192, 45, 0.06) 0%,
          transparent 40%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(28, 37, 65, 0.6) 0%,
          transparent 50%
        );
    }

    .container {
      width: 100%;
      max-width: 650px;

      background: var(--card-bg);

      border: 1px solid var(--border-color);
      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .history-section {
      background: rgba(11, 19, 43, 0.5);

      border-radius: 16px;
      padding: 20px;

      border: 1px solid var(--border-color);

      margin-top: 16px;
    }

    .history-section h2 {
      font-size: 16px;
      font-weight: 700;

      color: var(--accent-gold);

      margin-bottom: 6px;
    }

    .history-section p {
      font-size: 13px;

      color: var(--text-muted);

      margin-bottom: 14px;
    }

    input[type="file"] {
      width: 100%;

      padding: 12px;

      background-color: var(--input-bg);

      border: 1px dashed rgba(251, 192, 45, 0.4);

      border-radius: 12px;

      color: var(--text-main);

      font-size: 13px;

      outline: none;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    input[type="file"]:hover {
      border-color: var(--accent-gold);

      background-color: rgba(251, 192, 45, 0.05);
    }

    .logout-button {
      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        var(--accent-gold),
        #d48806
      );

      color: #0b132b;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition: all 0.3s ease;

      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .logout-button:hover {
      background: linear-gradient(
        135deg,
        #ffd54f,
        var(--accent-gold)
      );

      transform: translateY(-2px);

      box-shadow:
        0 6px 20px rgba(251, 192, 45, 0.4);
    }

    .logout-button:active {
      transform: translateY(0);
    }

    .logout-button.secondary {
      background: rgba(255, 255, 255, 0.08);

      color: var(--text-main);

      box-shadow: none;

      border: 1px solid var(--border-color);
    }

    .logout-button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);

      border-color: rgba(255, 255, 255, 0.3);
    }

    .template-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    #previewTable {
      border-radius: 12px;

      overflow: hidden;

      border: 1px solid var(--border-color);

      margin-top: 12px;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      font-size: 13px;

      text-align: left;
    }

    th {
      background-color: rgba(251, 192, 45, 0.15);

      color: var(--accent-gold);

      font-weight: 700;

      padding: 10px 12px;

      border-bottom: 1px solid var(--border-color);

      white-space: nowrap;
    }

    td {
      padding: 10px 12px;

      border-bottom: 1px solid var(--border-color);

      color: var(--text-main);

      background-color: rgba(11, 19, 43, 0.3);

      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    #importMessage {
      font-size: 13px;

      line-height: 1.5;

      padding: 12px;

      border-radius: 10px;

      background: rgba(11, 19, 43, 0.6);

      border: 1px solid var(--border-color);

      margin-top: 15px;

      margin-bottom: 15px;
    }

    .format-info {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      margin-top: 10px;
    }

    .format-badge {
      padding: 5px 9px;

      border-radius: 20px;

      background: rgba(251, 192, 45, 0.1);

      border: 1px solid rgba(251, 192, 45, 0.25);

      color: var(--accent-gold);

      font-size: 11px;

      font-weight: 700;
    }

    .loading {
      color: var(--accent-gold);
    }

    @media (max-width: 600px) {

      .container {
        padding: 20px;

        border-radius: 18px;
      }

      .template-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📥 Import Siswa Massal</h1>

    <p>
      Tambahkan banyak siswa sekaligus menggunakan file
      <strong style="color:var(--accent-gold);">
        XLS atau CSV
      </strong>.
    </p>


    <!-- KEMBALI -->

    <button
      type="button"
      class="logout-button secondary"
      onclick="window.location.href='admin-siswa.html'"
      style="margin-top:16px;"
    >
      ← Kembali
    </button>


    <!-- TEMPLATE -->

    <div class="history-section">

      <h2>1. Download Template</h2>

      <p>
        Pilih format template yang ingin digunakan.
      </p>

      <div class="template-grid">

        <button
          type="button"
          class="logout-button secondary"
          onclick="downloadTemplateCSV()"
        >
          📄 Download Template CSV
        </button>

        <button
          type="button"
          class="logout-button secondary"
          onclick="downloadTemplateXLS()"
        >
          📊 Download Template XLS
        </button>

      </div>

      <div class="format-info">

        <span class="format-badge">
          CSV
        </span>

        <span class="format-badge">
          XLS
        </span>

        <span class="format-badge">
          NISN
        </span>

        <span class="format-badge">
          Nama
        </span>

        <span class="format-badge">
          Kelas
        </span>

        <span class="format-badge">
          Password
        </span>

      </div>

    </div>


    <!-- UPLOAD -->

    <div class="history-section">

      <h2>2. Pilih File</h2>

      <p>
        Format yang didukung:
        <strong style="color:var(--accent-gold);">
          .CSV dan .XLS
        </strong>
      </p>

      <input
        type="file"
        id="studentFile"
        accept=".csv,.xls,text/csv,application/vnd.ms-excel"
      >

      <button
        type="button"
        class="logout-button"
        onclick="readStudentFile()"
        style="margin-top:12px;"
      >
        👀 Preview Data
      </button>

    </div>


    <!-- PREVIEW -->

    <div
      id="previewSection"
      class="history-section"
      style="display:none;"
    >

      <h2>3. Preview Data</h2>

      <p
        id="previewInfo"
        style="
          color:var(--accent-gold);
          font-weight:600;
        "
      ></p>

      <div
        id="previewTable"
        style="overflow-x:auto;"
      ></div>

      <div id="importMessage"></div>

      <button
        type="button"
        class="logout-button"
        onclick="importStudents()"
      >
        🚀 Import Semua Siswa
      </button>

    </div>

  </div>


  <script>

    // =========================================================
    // CEK ADMIN
    // =========================================================

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {
      window.location.href =
        "admin-login.html";
    }


    let importData = [];


    // =========================================================
    // TEMPLATE DATA
    // =========================================================

    const templateData = [
      [
        "NISN",
        "Nama",
        "Kelas",
        "Password"
      ],

      [
        "0012345678",
        "Ahmad",
        "K001",
        "ahmad123"
      ],

      [
        "0012345679",
        "Budi",
        "K001",
        "budi123"
      ],

      [
        "0012345680",
        "Citra",
        "K002",
        "citra123"
      ]
    ];


    // =========================================================
    // DOWNLOAD TEMPLATE CSV
    // =========================================================

    function downloadTemplateCSV() {

      const rows = templateData.map(row => {

        return row.map(value => {

          const text =
            String(value ?? "");

          /*
          Escape tanda kutip CSV.
          */

          if (
            text.includes(",") ||
            text.includes('"') ||
            text.includes("\n")
          ) {

            return '"' +
              text.replace(/"/g, '""') +
              '"';

          }

          return text;

        }).join(",");

      });

      const csv =
        "\uFEFF" +
        rows.join("\r\n");

      const blob = new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "template-siswa-lentera-smanti.csv";

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);
    }


    // =========================================================
    // DOWNLOAD TEMPLATE XLS
    // =========================================================

    function downloadTemplateXLS() {

      if (typeof XLSX === "undefined") {

        alert(
          "Library XLS belum berhasil dimuat. " +
          "Periksa koneksi internet lalu coba lagi."
        );

        return;
      }

      /*
      Buat worksheet dari template.
      */

      const worksheet =
        XLSX.utils.aoa_to_sheet(
          templateData
        );


      /*
      Pastikan kolom NISN dan Password
      dianggap sebagai teks.
      */

      for (let row = 1; row <= 3; row++) {

        worksheet[`A${row + 1}`].t = "s";
        worksheet[`D${row + 1}`].t = "s";
      }


      /*
      Lebar kolom.
      */

      worksheet["!cols"] = [
        { wch: 18 },
        { wch: 25 },
        { wch: 12 },
        { wch: 20 }
      ];


      const workbook =
        XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Siswa"
      );


      XLSX.writeFile(
        workbook,
        "template-siswa-lentera-smanti.xls",
        {
          bookType: "xls"
        }
      );
    }


    // =========================================================
    // BACA FILE
    // =========================================================

    function readStudentFile() {

      const fileInput =
        document.getElementById(
          "studentFile"
        );

      const file =
        fileInput.files[0];

      if (!file) {

        alert(
          "Silakan pilih file XLS atau CSV terlebih dahulu."
        );

        return;
      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      if (
        extension !== "csv" &&
        extension !== "xls"
      ) {

        alert(
          "Format file tidak didukung. " +
          "Gunakan CSV atau XLS."
        );

        return;
      }


      /*
      CSV
      */

      if (extension === "csv") {

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            parseCSV(
              event.target.result
            );

          };

        reader.onerror =
          function() {

            alert(
              "File CSV gagal dibaca."
            );

          };

        reader.readAsText(
          file,
          "UTF-8"
        );

        return;
      }


      /*
      XLS
      */

      if (extension === "xls") {

        const reader =
          new FileReader();

        reader.onload =
          function(event) {

            try {

              const data =
                new Uint8Array(
                  event.target.result
                );

              const workbook =
                XLSX.read(
                  data,
                  {
                    type: "array",
                    cellDates: false,
                    raw: false
                  }
                );


              if (
                !workbook.SheetNames.length
              ) {

                alert(
                  "File XLS tidak memiliki sheet."
                );

                return;
              }


              const firstSheet =
                workbook.Sheets[
                  workbook.SheetNames[0]
                ];


              const rows =
                XLSX.utils.sheet_to_json(
                  firstSheet,
                  {
                    header: 1,
                    defval: "",
                    raw: false
                  }
                );


              parseSpreadsheetRows(
                rows
              );

            } catch (error) {

              console.error(
                "XLS ERROR:",
                error
              );

              alert(
                "File XLS gagal dibaca atau rusak."
              );
            }

          };


        reader.onerror =
          function() {

            alert(
              "File XLS gagal dibaca."
            );

          };


        reader.readAsArrayBuffer(
          file
        );
      }
    }


    // =========================================================
    // PARSE CSV
    // =========================================================

    function parseCSV(text) {

      const rows =
        parseCSVRows(text);


      parseSpreadsheetRows(
        rows
      );
    }


    // =========================================================
    // PARSE CSV DENGAN SUPPORT QUOTE
    // =========================================================

    function parseCSVRows(text) {

      const rows = [];

      let row = [];

      let current = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char = text[i];

        const next = text[i + 1];


        if (char === '"') {

          if (
            insideQuotes &&
            next === '"'
          ) {

            current += '"';

            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }

          continue;
        }


        if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(current);

          current = "";

          continue;
        }


        if (
          (char === "\n" || char === "\r") &&
          !insideQuotes
        ) {

          /*
          Handle CRLF.
          */

          if (
            char === "\r" &&
            next === "\n"
          ) {

            i++;

          }


          row.push(current);

          current = "";


          if (
            row.some(
              value =>
                String(value).trim() !== ""
            )
          ) {

            rows.push(row);

          }


          row = [];

          continue;
        }


        current += char;
      }


      /*
      Data terakhir.
      */

      if (
        current !== "" ||
        row.length > 0
      ) {

        row.push(current);

        if (
          row.some(
            value =>
              String(value).trim() !== ""
          )
        ) {

          rows.push(row);

        }
      }


      return rows;
    }


    // =========================================================
    // PARSE SPREADSHEET
    // =========================================================

    function parseSpreadsheetRows(rows) {

      if (
        !Array.isArray(rows) ||
        rows.length < 2
      ) {

        alert(
          "File tidak memiliki data siswa."
        );

        return;
      }


      /*
      Bersihkan BOM dari header pertama.
      */

      const header =
        rows[0].map(
          value =>
            String(value ?? "")
              .replace(/^\uFEFF/, "")
              .trim()
              .toLowerCase()
        );


      const nisnIndex =
        header.indexOf("nisn");

      const namaIndex =
        header.indexOf("nama");

      const kelasIndex =
        header.indexOf("kelas");

      const passwordIndex =
        header.indexOf("password");


      if (
        nisnIndex === -1 ||
        namaIndex === -1 ||
        kelasIndex === -1 ||
        passwordIndex === -1
      ) {

        alert(
          "Header harus memiliki:\n\n" +
          "NISN, Nama, Kelas, Password"
        );

        return;
      }


      importData = [];


      for (
        let i = 1;
        i < rows.length;
        i++
      ) {

        const columns =
          rows[i] || [];


        const nisn =
          String(
            columns[nisnIndex] ?? ""
          ).trim();


        const nama =
          String(
            columns[namaIndex] ?? ""
          ).trim();


        const kelas =
          String(
            columns[kelasIndex] ?? ""
          ).trim();


        const password =
          String(
            columns[passwordIndex] ?? ""
          ).trim();


        /*
        Lewati baris kosong.
        */

        if (
          !nisn &&
          !nama &&
          !kelas &&
          !password
        ) {

          continue;
        }


        importData.push({

          baris: i + 1,

          nisn,

          nama,

          kelas,

          password

        });
      }


      if (
        importData.length === 0
      ) {

        alert(
          "Tidak ada data siswa yang ditemukan."
        );

        return;
      }


      renderPreview();
    }


    // =========================================================
    // PREVIEW
    // =========================================================

    function renderPreview() {

      const section =
        document.getElementById(
          "previewSection"
        );

      const table =
        document.getElementById(
          "previewTable"
        );

      const info =
        document.getElementById(
          "previewInfo"
        );


      section.style.display =
        "block";


      info.textContent =
        `${importData.length} siswa ditemukan.`;


      let html = `
        <table>

          <thead>

            <tr>

              <th>No</th>

              <th>NISN</th>

              <th>Nama</th>

              <th>Kelas</th>

              <th>Password</th>

            </tr>

          </thead>

          <tbody>
      `;


      importData.forEach(
        (siswa, index) => {

          html += `

            <tr>

              <td>
                ${index + 1}
              </td>

              <td>
                ${escapeHtml(siswa.nisn)}
              </td>

              <td>
                ${escapeHtml(siswa.nama)}
              </td>

              <td>
                ${escapeHtml(siswa.kelas)}
              </td>

              <td>
                ${escapeHtml(siswa.password)}
              </td>

            </tr>

          `;
        }
      );


      html += `

          </tbody>

        </table>

      `;


      table.innerHTML =
        html;


      /*
      Reset pesan import.
      */

      document.getElementById(
        "importMessage"
      ).textContent = "";
    }


    // =========================================================
    // IMPORT SISWA
    // =========================================================

    async function importStudents() {

      if (
        importData.length === 0
      ) {

        alert(
          "Tidak ada data untuk diimport."
        );

        return;
      }


      const yakin =
        confirm(
          `Import ${importData.length} siswa sekarang?`
        );


      if (!yakin) {
        return;
      }


      const message =
        document.getElementById(
          "importMessage"
        );


      message.innerHTML =
        `<span class="loading">
          ⏳ Sedang mengimport data...
        </span>`;


      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                action:
                  "import_students",

                siswa:
                  importData.map(
                    siswa => ({

                      nisn:
                        siswa.nisn,

                      nama:
                        siswa.nama,

                      kelasId:
                        convertClassToId(
                          siswa.kelas
                        ),

                      password:
                        siswa.password

                    })
                  )

              })
            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          message.innerHTML =
            `❌ ${
              escapeHtml(
                result.message ||
                result.error ||
                "Import gagal."
              )
            }`;

          return;
        }


        let detail =
          `✅ ${
            result.berhasil || 0
          } siswa berhasil diimport.`;


        if (
          Number(result.gagal || 0) > 0
        ) {

          detail +=
            `<br>❌ ${
              result.gagal
            } siswa gagal.`;


          if (
            Array.isArray(
              result.detailGagal
            )
          ) {

            detail +=
              "<br><br>";


            result.detailGagal.forEach(
              item => {

                detail +=
                  `Baris ${
                    item.baris
                  }: ${
                    escapeHtml(
                      item.alasan
                    )
                  }<br>`;

              }
            );
          }
        }


        message.innerHTML =
          detail;


        /*
        Jika ada yang berhasil,
        kosongkan data import agar
        tidak terimport dua kali.
        */

        if (
          Number(result.berhasil || 0) > 0
        ) {

          importData = [];

        }

      } catch (error) {

        console.error(
          "IMPORT ERROR:",
          error
        );


        message.innerHTML =
          `❌ Terjadi kesalahan koneksi.<br>
           <small>
             ${escapeHtml(
               error.message
             )}
           </small>`;
      }
    }


    // =========================================================
    // KONVERSI KELAS
    // =========================================================

    function convertClassToId(kelas) {

      const map = {

        "X A": "K001",

        "X B": "K002",

        "XI A": "K003",

        "XI B": "K004",

        "XII A": "K005",

        "XII B": "K006"

      };


      /*
      Kalau user sudah memasukkan
      K001-K006, langsung gunakan.
      */

      if (
        /^K00[1-6]$/i.test(kelas)
      ) {

        return kelas.toUpperCase();

      }


      return (
        map[kelas] ||
        kelas
      );
    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }


    // =========================================================
    // RESET PREVIEW JIKA FILE DIGANTI
    // =========================================================

    document
      .getElementById("studentFile")
      .addEventListener(
        "change",
        function() {

          importData = [];

          document
            .getElementById(
              "previewSection"
            )
            .style.display = "none";

        }
      );

  </script>

</body>
