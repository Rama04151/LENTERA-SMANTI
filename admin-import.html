<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Siswa - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(251, 192, 45, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* History Sections / Step Cards */
    .history-section {
      background: rgba(11, 19, 43, 0.5);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-top: 16px;
    }

    .history-section h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }

    .history-section p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* File Input Styling */
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px dashed rgba(251, 192, 45, 0.4);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    input[type="file"]:hover {
      border-color: var(--accent-gold);
      background-color: rgba(251, 192, 45, 0.05);
    }

    /* Buttons */
    .logout-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .logout-button:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 192, 45, 0.4);
    }

    .logout-button:active {
      transform: translateY(0);
    }

    .logout-button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--border-color);
    }

    .logout-button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Preview Table Styling */
    #previewTable {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      background-color: rgba(251, 192, 45, 0.15);
      color: var(--accent-gold);
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      background-color: rgba(11, 19, 43, 0.3);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Messages */
    #importMessage {
      font-size: 13px;
      line-height: 1.5;
      padding: 12px;
      border-radius: 10px;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--border-color);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📥 Import Siswa Massal</h1>
    <p>Tambahkan banyak siswa sekaligus menggunakan file CSV.</p>

    <!-- KEMBALI -->
    <button
      type="button"
      class="logout-button secondary"
      onclick="window.location.href='admin-siswa.html'"
      style="margin-top: 16px;"
    >
      ← Kembali
    </button>


    <!-- TEMPLATE -->
    <div class="history-section">
      <h2>1. Download Template</h2>
      <p>Gunakan template berikut agar format data sesuai.</p>

      <button
        type="button"
        class="logout-button secondary"
        onclick="downloadTemplate()"
      >
        📄 Download Template CSV
      </button>
    </div>


    <!-- UPLOAD -->
    <div class="history-section">
      <h2>2. Pilih File CSV</h2>
      <p>Format: <strong style="color: var(--accent-gold);">NISN, Nama, Kelas, Password</strong></p>

      <input
        type="file"
        id="csvFile"
        accept=".csv,text/csv"
      >

      <button
        type="button"
        class="logout-button"
        onclick="readCSV()"
        style="margin-top: 12px;"
      >
        👀 Preview Data
      </button>
    </div>


    <!-- PREVIEW -->
    <div
      id="previewSection"
      class="history-section"
      style="display:none;"
    >
      <h2>3. Preview Data</h2>
      <p id="previewInfo" style="color: var(--accent-gold); font-weight: 600;"></p>

      <div id="previewTable" style="overflow-x:auto;"></div>

      <div id="importMessage" style="margin-top: 15px; margin-bottom: 15px;"></div>

      <button
        type="button"
        class="logout-button"
        onclick="importStudents()"
      >
        🚀 Import Semua Siswa
      </button>
    </div>

  </div>


  <script>
    // =========================
    // CEK ADMIN
    // =========================
    const adminSession = sessionStorage.getItem("lentera_admin_session");

    if (!adminSession) {
      window.location.href = "admin-login.html";
    }

    let importData = [];

    // =========================
    // DOWNLOAD TEMPLATE
    // =========================
    function downloadTemplate() {
      const csv =
        "NISN,Nama,Kelas,Password\n" +
        "0012345678,Ahmad,K001,ahmad123\n" +
        "0012345679,Budi,K001,budi123\n" +
        "0012345680,Citra,K002,citra123\n";

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "template-siswa-lentera-smanti.csv";
      link.click();

      URL.revokeObjectURL(url);
    }

    // =========================
    // BACA CSV
    // =========================
    function readCSV() {
      const fileInput = document.getElementById("csvFile");
      const file = fileInput.files[0];

      if (!file) {
        alert("Silakan pilih file CSV terlebih dahulu.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        const text = event.target.result;
        parseCSV(text);
      };

      reader.onerror = function() {
        alert("File gagal dibaca.");
      };

      reader.readAsText(file, "UTF-8");
    }

    // =========================
    // PARSE CSV
    // =========================
    function parseCSV(text) {
      const lines = text
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      if (lines.length < 2) {
        alert("File CSV tidak memiliki data siswa.");
        return;
      }

      const header = lines[0]
        .split(",")
        .map(value => value.trim().toLowerCase());

      const nisnIndex = header.indexOf("nisn");
      const namaIndex = header.indexOf("nama");
      const kelasIndex = header.indexOf("kelas");
      const passwordIndex = header.indexOf("password");

      if (
        nisnIndex === -1 ||
        namaIndex === -1 ||
        kelasIndex === -1 ||
        passwordIndex === -1
      ) {
        alert("Header CSV harus memiliki: NISN, Nama, Kelas, Password.");
        return;
      }

      importData = [];

      for (let i = 1; i < lines.length; i++) {
        const columns = parseCSVLine(lines[i]);

        const nisn = String(columns[nisnIndex] || "").trim();
        const nama = String(columns[namaIndex] || "").trim();
        const kelas = String(columns[kelasIndex] || "").trim();
        const password = String(columns[passwordIndex] || "").trim();

        if (!nisn && !nama && !kelas && !password) {
          continue;
        }

        importData.push({
          baris: i + 1,
          nisn,
          nama,
          kelas,
          password
        });
      }

      if (importData.length === 0) {
        alert("Tidak ada data siswa yang ditemukan.");
        return;
      }

      renderPreview();
    }

    // =========================
    // CSV LINE
    // =========================
    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          if (insideQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === "," && !insideQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    // =========================
    // PREVIEW
    // =========================
    function renderPreview() {
      const section = document.getElementById("previewSection");
      const table = document.getElementById("previewTable");
      const info = document.getElementById("previewInfo");

      section.style.display = "block";
      info.textContent = `${importData.length} siswa ditemukan.`;

      let html = `
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>NISN</th>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Password</th>
            </tr>
          </thead>
          <tbody>
      `;

      importData.forEach((siswa, index) => {
        html += `
          <tr>
            <td>${index + 1}</td>
            <td>${escapeHtml(siswa.nisn)}</td>
            <td>${escapeHtml(siswa.nama)}</td>
            <td>${escapeHtml(siswa.kelas)}</td>
            <td>${escapeHtml(siswa.password)}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      table.innerHTML = html;
    }

    // =========================
    // IMPORT
    // =========================
    async function importStudents() {
      if (importData.length === 0) {
        alert("Tidak ada data untuk diimport.");
        return;
      }

      const yakin = confirm(`Import ${importData.length} siswa sekarang?`);

      if (!yakin) {
        return;
      }

      const message = document.getElementById("importMessage");
      message.textContent = "Sedang mengimport data...";

      try {
        const response = await fetch("/.netlify/functions/admin-students", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "import_students",
            siswa: importData.map(siswa => ({
              nisn: siswa.nisn,
              nama: siswa.nama,
              kelasId: convertClassToId(siswa.kelas),
              password: siswa.password
            }))
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          message.textContent = result.message || "Import gagal.";
          return;
        }

        let detail = `✅ ${result.berhasil} siswa berhasil diimport.`;

        if (result.gagal > 0) {
          detail += `<br>❌ ${result.gagal} siswa gagal.`;

          if (Array.isArray(result.detailGagal)) {
            detail += "<br><br>";
            result.detailGagal.forEach(item => {
              detail += `Baris ${item.baris}: ${escapeHtml(item.alasan)}<br>`;
            });
          }
        }

        message.innerHTML = detail;

        if (result.berhasil > 0) {
          importData = [];
        }

      } catch (error) {
        console.error("IMPORT ERROR:", error);
        message.textContent = "Terjadi kesalahan koneksi.";
      }
    }

    // =========================
    // KONVERSI KELAS
    // =========================
    function convertClassToId(kelas) {
      const map = {
        "X A": "K001",
        "X B": "K002",
        "XI A": "K003",
        "XI B": "K004",
        "XII A": "K005",
        "XII B": "K006"
      };

      return map[kelas] || kelas;
    }

    // =========================
    // ESCAPE HTML
    // =========================
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
