<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenaikan Kelas - LENTERA SMANTI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Kenaikan Kelas</h1>

    <p>
      Sistem akan memindahkan seluruh siswa aktif
      secara otomatis sesuai tingkat kelas.
    </p>

    <div class="card">

      <h2>Alur Kenaikan</h2>

      <div class="promotion-list">

        <div class="promotion-item">
          <span>X A</span>
          <strong>→</strong>
          <span>XI A</span>
        </div>

        <div class="promotion-item">
          <span>X B</span>
          <strong>→</strong>
          <span>XI B</span>
        </div>

        <div class="promotion-item">
          <span>XI A</span>
          <strong>→</strong>
          <span>XII A</span>
        </div>

        <div class="promotion-item">
          <span>XI B</span>
          <strong>→</strong>
          <span>XII B</span>
        </div>

        <div class="promotion-item">
          <span>XII A</span>
          <strong>→</strong>
          <span>LULUS</span>
        </div>

        <div class="promotion-item">
          <span>XII B</span>
          <strong>→</strong>
          <span>LULUS</span>
        </div>

      </div>

    </div>

    <div class="card">

      <h2>Perhatian</h2>

      <p>
        Proses ini akan memindahkan semua siswa aktif.
      </p>

      <p>
        Siswa kelas XII akan otomatis berstatus
        <strong>Lulus</strong>.
      </p>

      <button
        id="btnProcess"
        class="primary-button"
        onclick="processPromotion()"
      >
        🔄 Proses Kenaikan Kelas
      </button>

      <button
        class="logout-button"
        onclick="window.location.href='admin.html'"
      >
        ← Kembali
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>

    const adminSession =
      sessionStorage.getItem("lentera_admin_session");

    if (!adminSession) {
      window.location.href = "admin-login.html";
    }

    async function processPromotion() {

      const confirmation = confirm(
        "Yakin ingin memproses kenaikan kelas?\n\n" +
        "X A → XI A\n" +
        "X B → XI B\n" +
        "XI A → XII A\n" +
        "XI B → XII B\n" +
        "XII A → Lulus\n" +
        "XII B → Lulus\n\n" +
        "Proses ini tidak dapat dibatalkan otomatis."
      );

      if (!confirmation) {
        return;
      }

      const button =
        document.getElementById("btnProcess");

      const result =
        document.getElementById("result");

      button.disabled = true;
      button.textContent = "⏳ Memproses...";

      result.innerHTML = "";

      try {

        const admin =
          JSON.parse(adminSession);

        const response = await fetch(
          "/.netlify/functions/admin-promotion",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              admin: admin.username || "admin"
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            "Gagal memproses kenaikan kelas."
          );
        }

        result.innerHTML = `
          <div class="success-message">
            <h3>✅ Berhasil</h3>

            <p>
              Total siswa diproses:
              <strong>${data.diproses}</strong>
            </p>

            <p>
              Siswa naik kelas:
              <strong>${data.naik}</strong>
            </p>

            <p>
              Siswa lulus:
              <strong>${data.lulus}</strong>
            </p>
          </div>
        `;

        button.textContent = "✅ Berhasil";

      } catch (error) {

        console.error(error);

        result.innerHTML = `
          <div class="error-message">
            ❌ ${error.message}
          </div>
        `;

        button.disabled = false;
        button.textContent =
          "🔄 Proses Kenaikan Kelas";
      }
    }

  </script>

</body>
</html>
