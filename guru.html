<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Guru - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(251, 192, 45, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .guru-container {
      width: 100%;
      max-width: 900px;
    }

    /* HEADER */
    .guru-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .guru-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .guru-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .guru-profile {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--border-color);
    }

    .guru-profile strong {
      display: block;
      font-size: 16px;
      color: var(--text-main);
    }

    .guru-profile span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: var(--accent-gold);
    }

    /* MENU GRID */
    .guru-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .guru-menu button {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-main);
    }

    .guru-menu button:hover:not(.disabled) {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      background: rgba(28, 37, 65, 0.9);
    }

    .menu-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .menu-desc {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* BOTTOM BUTTONS */
    .guru-bottom {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .guru-bottom button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3) !important;
    }

    .logout:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .disabled {
      background: rgba(255, 255, 255, 0.05) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border-color) !important;
      opacity: 0.6;
      cursor: not-allowed !important;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--accent-gold);
    }

    .close {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
    }

    /* FORM & INPUTS */
    .search-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 16px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* STUDENT LIST */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .student {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      background: rgba(11, 19, 43, 0.5);
      transition: all 0.2s ease;
    }

    .student.clickable {
      cursor: pointer;
    }

    .student.clickable:hover {
      background: rgba(251, 192, 45, 0.08);
      border-color: var(--accent-gold);
    }

    .student-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .student-info {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .points {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge.red {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .badge.gray {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-color: var(--border-color);
    }

    /* FORM GROUPS */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--accent-gold);
    }

    .selected {
      display: none;
      background: rgba(251, 192, 45, 0.1);
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .selected.show {
      display: block;
    }

    .selected-name {
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 14px;
    }

    .selected-info {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .clear {
      margin-top: 8px;
      border: 0;
      background: none;
      color: #f87171;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .submit:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
    }

    .submit.red {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: none;
    }

    .submit.red:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
    }

    /* MESSAGES */
    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* PASSWORD FORM */

.password-form {
  margin-top: 8px;
}

.password-form .form-group {
  margin-bottom: 16px;
}

.password-form label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-gold);
}

.password-form input {
  width: 100%;
}

.password-message {
  display: none;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
}

.password-message.show {
  display: block;
}

.password-message.success {
  background: rgba(16, 185, 129, 0.15);
  color: var(--success-color);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.password-message.error {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.password-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
}

    @media (max-width: 650px) {
      .guru-container {
        padding: 0;
      }

      .guru-menu {
        grid-template-columns: 1fr;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .guru-bottom {
        flex-direction: column;
      }

      .modal {
        padding: 10px;
      }

      .modal-box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="guru-container">

    <!-- HEADER -->
    <div class="guru-header">
      <h1>Panel Guru</h1>
      <p>LENTERA SMANTI</p>

      <div class="guru-profile">
        <strong id="guruName">Memuat...</strong>
        <span id="guruUsername">@...</span>
      </div>
    </div>

    <!-- MENU -->
    <div class="guru-menu">

      <button type="button" onclick="openStudents()">
        <div class="menu-icon">👨‍🎓</div>
        <div class="menu-title">Data Siswa</div>
        <div class="menu-desc">Melihat data siswa dan jumlah poin.</div>
      </button>

      <button type="button" onclick="openRewards()">
        <div class="menu-icon">🏆</div>
        <div class="menu-title">Penghargaan</div>
        <div class="menu-desc">Menambahkan poin penghargaan.</div>
      </button>

      <button type="button" onclick="openViolations()">
        <div class="menu-icon">⚠️</div>
        <div class="menu-title">Pelanggaran</div>
        <div class="menu-desc">Menambahkan poin pelanggaran.</div>
      </button>

      <button
        type="button"
        class="disabled"
        onclick="alert('Fitur Inbox sedang dalam tahap berikutnya.')"
      >
        <div class="menu-icon">📥</div>
        <div class="menu-title">Inbox Siswa</div>
        <div class="menu-desc">Fitur akan diaktifkan pada tahap berikutnya.</div>
      </button>

    </div>

    <!-- BOTTOM -->
    <div class="guru-bottom">
      <button
  type="button"
  onclick="openGuruPassword()"
>
  🔐 Ubah Password
</button>

      <button
        type="button"
        class="logout"
        onclick="logoutGuru()"
      >
        🚪 Keluar
      </button>
    </div>

  </div>

  <!-- MODAL UBAH PASSWORD GURU -->

<div id="guruPasswordModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>🔐 Ubah Password</h2>

      <button
        type="button"
        class="close"
        onclick="closeGuruPassword()"
      >
        ×
      </button>

    </div>

    <div
      id="guruPasswordMessage"
      class="password-message"
    ></div>

    <div class="password-form">

      <div class="form-group">

        <label for="guruCurrentPassword">
          Password Lama
        </label>

        <input
          type="password"
          id="guruCurrentPassword"
          placeholder="Masukkan password lama"
          autocomplete="current-password"
        >

      </div>

      <div class="form-group">

        <label for="guruNewPassword">
          Password Baru
        </label>

        <input
          type="password"
          id="guruNewPassword"
          placeholder="Minimal 6 karakter"
          autocomplete="new-password"
        >

      </div>

      <div class="form-group">

        <label for="guruConfirmPassword">
          Konfirmasi Password Baru
        </label>

        <input
          type="password"
          id="guruConfirmPassword"
          placeholder="Ulangi password baru"
          autocomplete="new-password"
        >

      </div>

      <button
        type="button"
        class="submit password-submit"
        onclick="submitGuruPassword()"
      >
        🔐 Simpan Password
      </button>

    </div>

  </div>

</div>

  <!-- MODAL DATA SISWA -->
  <div id="studentsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Data Siswa</h2>
        <button type="button" class="close" onclick="closeStudents()">×</button>
      </div>

      <div class="search-row">
        <input
          id="studentSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterStudents()"
        >

        <select id="studentClass" onchange="filterStudents()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="studentResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>
    </div>
  </div>

  <!-- MODAL PENGHARGAAN -->
  <div id="rewardsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Penghargaan</h2>
        <button type="button" class="close" onclick="closeRewards()">×</button>
      </div>

      <div id="rewardMessage" class="message"></div>

      <div class="search-row">
        <input
          id="rewardSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterRewards()"
        >

        <select id="rewardClass" onchange="filterRewards()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="rewardResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>

      <input type="hidden" id="rewardStudent">

      <div id="rewardSelected" class="selected"></div>

      <div class="form-group">
        <label for="rewardPoints">Jumlah Poin</label>
        <input
          id="rewardPoints"
          type="number"
          min="1"
          max="100"
          placeholder="Contoh: 5"
        >
      </div>

      <div class="form-group">
        <label for="rewardDescription">Keterangan</label>
        <textarea
          id="rewardDescription"
          maxlength="500"
          placeholder="Contoh: Juara lomba pidato..."
        ></textarea>
      </div>

      <button type="button" class="submit" onclick="submitReward()">
        🏆 Tambahkan Penghargaan
      </button>
    </div>
  </div>

  <!-- MODAL PELANGGARAN -->
  <div id="violationsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Pelanggaran</h2>
        <button type="button" class="close" onclick="closeViolations()">×</button>
      </div>

      <div id="violationMessage" class="message"></div>

      <div class="search-row">
        <input
          id="violationSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterViolations()"
        >

        <select id="violationClass" onchange="filterViolations()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="violationResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>

      <input type="hidden" id="violationStudent">

      <div id="violationSelected" class="selected"></div>

      <div class="form-group">
        <label for="violationPoints">Jumlah Poin</label>
        <input
          id="violationPoints"
          type="number"
          min="1"
          max="100"
          placeholder="Contoh: 10"
        >
      </div>

      <div class="form-group">
        <label for="violationDescription">Keterangan</label>
        <textarea
          id="violationDescription"
          maxlength="500"
          placeholder="Contoh: Terlambat masuk sekolah..."
        ></textarea>
      </div>

      <button type="button" class="submit red" onclick="submitViolation()">
        ⚠️ Tambahkan Pelanggaran
      </button>
    </div>
  </div>

  <script>
    // SESSION
    const guruSession = JSON.parse(
      sessionStorage.getItem("lentera_guru_session") || "null"
    );

    if (!guruSession) {
      window.location.href = "guru-login.html";
    }

    if (guruSession) {
      document.getElementById("guruName").textContent =
        guruSession.nama || "Guru";

      document.getElementById("guruUsername").textContent =
        "@" + (guruSession.username || "");
    }

    // DATA STORES
    let students = [];
    let rewardStudents = [];
    let violationStudents = [];

    // ESCAPE HTML
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // FETCH DATA SISWA
    async function getStudents() {
      const response = await fetch("/.netlify/functions/guru-students", {
        method: "GET",
        headers: { "Accept": "application/json" }
      });

      const raw = await response.text();
      let result;

      try {
        result = JSON.parse(raw);
      } catch (error) {
        throw new Error("Response server bukan JSON. Status: " + response.status);
      }

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Gagal mengambil data siswa.");
      }

      return Array.isArray(result.siswa) ? result.siswa : [];
    }

    // DATA SISWA MODAL LOGIC
    async function openStudents() {
      document.getElementById("studentsModal").classList.add("show");
      const results = document.getElementById("studentResults");
      results.innerHTML = `<div class="loading">Memuat data siswa...</div>`;

      try {
        students = await getStudents();
        filterStudents();
      } catch (error) {
        console.error(error);
        results.innerHTML = `<div class="loading">${escapeHtml(error.message)}</div>`;
      }
    }

    function closeStudents() {
      document.getElementById("studentsModal").classList.remove("show");
    }

    function filterStudents() {
      const search = document.getElementById("studentSearch").value.trim().toLowerCase();
      const kelas = document.getElementById("studentClass").value;

      const filtered = students.filter(siswa => {
        const matchSearch = !search ||
          String(siswa.nama || "").toLowerCase().includes(search) ||
          String(siswa.nisn || "").toLowerCase().includes(search);
        const matchClass = !kelas || siswa.kelas === kelas;
        return matchSearch && matchClass;
      });

      const results = document.getElementById("studentResults");

      if (!filtered.length) {
        results.innerHTML = `<div class="loading">Tidak ada siswa ditemukan.</div>`;
        return;
      }

      results.innerHTML = filtered.map(siswa => `
        <div class="student">
          <div class="student-name">${escapeHtml(siswa.nama)}</div>
          <div class="student-info">
            NISN: ${escapeHtml(siswa.nisn)} · Kelas: ${escapeHtml(siswa.kelas)}
          </div>
          <div class="points">
            <span class="badge">🏆 ${Number(siswa.penghargaan || 0)}</span>
            <span class="badge red">⚠️ ${Number(siswa.pelanggaran || 0)}</span>

function openGuruPassword() {

  const modal =
    document.getElementById("guruPasswordModal");

  document.getElementById(
    "guruCurrentPassword"
  ).value = "";

  document.getElementById(
    "guruNewPassword"
  ).value = "";

  document.getElementById(
    "guruConfirmPassword"
  ).value = "";

  const message =
    document.getElementById(
      "guruPasswordMessage"
    );

  message.textContent = "";
  message.className = "password-message";

  modal.classList.add("show");

}


function closeGuruPassword() {

  document
    .getElementById("guruPasswordModal")
    .classList.remove("show");

}


async function submitGuruPassword() {

  const currentPassword =
    document.getElementById(
      "guruCurrentPassword"
    ).value;

  const newPassword =
    document.getElementById(
      "guruNewPassword"
    ).value;

  const confirmPassword =
    document.getElementById(
      "guruConfirmPassword"
    ).value;

  // =========================
  // VALIDASI
  // =========================

  if (!currentPassword) {

    showPasswordMessage(
      "Password lama wajib diisi.",
      "error"
    );

    return;
  }

  if (!newPassword) {

    showPasswordMessage(
      "Password baru wajib diisi.",
      "error"
    );

    return;
  }

  if (newPassword.length < 6) {

    showPasswordMessage(
      "Password baru minimal 6 karakter.",
      "error"
    );

    return;
  }

  if (newPassword !== confirmPassword) {

    showPasswordMessage(
      "Konfirmasi password tidak cocok.",
      "error"
    );

    return;
  }

  if (currentPassword === newPassword) {

    showPasswordMessage(
      "Password baru harus berbeda dari password lama.",
      "error"
    );

    return;
  }

  // =========================
  // CEK SESSION
  // =========================

  if (!guruSession || !guruSession.id) {

    showPasswordMessage(
      "Sesi guru tidak ditemukan. Silakan login kembali.",
      "error"
    );

    return;
  }

  // =========================
  // TOMBOL
  // =========================

  const button =
    document.querySelector(
      ".password-submit"
    );

  button.disabled = true;
  button.textContent = "Menyimpan...";

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-change-password",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            guruId:
              guruSession.id,

            currentPassword:
              currentPassword,

            newPassword:
              newPassword

          })
        }
      );

    const raw =
      await response.text();

    let result;

    try {

      result =
        JSON.parse(raw);

    } catch (error) {

      throw new Error(
        "Response server bukan JSON."
      );

    }

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengubah password."
      );

    }

    // =========================
    // BERHASIL
    // =========================

    showPasswordMessage(
      "Password berhasil diubah.",
      "success"
    );

    document.getElementById(
      "guruCurrentPassword"
    ).value = "";

    document.getElementById(
      "guruNewPassword"
    ).value = "";

    document.getElementById(
      "guruConfirmPassword"
    ).value = "";

    setTimeout(() => {

      closeGuruPassword();

    }, 1500);

  } catch (error) {

    console.error(
      "GURU PASSWORD ERROR:",
      error
    );

    showPasswordMessage(
      error.message ||
      "Terjadi kesalahan.",
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent =
      "🔐 Simpan Password";

  }

}


function showPasswordMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "guruPasswordMessage"
    );

  message.textContent = text;

  message.className =
    "password-message show " + type;

}
