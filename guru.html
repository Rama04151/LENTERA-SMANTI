<head>

<title>Panel Guru - LENTERA SMANTI</title>

<link rel="stylesheet" href="style.css">

<style>
    body {
        margin: 0;
        background: #f5f7f6;
        font-family: Arial, sans-serif;
        color: #1f2937;
    }

    .guru-container {
        width: 100%;
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    .guru-header {
        background: #064e3b;
        color: white;
        padding: 24px;
        border-radius: 18px;
        margin-bottom: 20px;
    }

    .guru-header h1 {
        margin: 0 0 6px;
    }

    .guru-header p {
        margin: 0;
        opacity: .85;
    }

    .guru-profile {
        margin-top: 18px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(255,255,255,.12);
    }

    .guru-profile strong {
        display: block;
        font-size: 17px;
    }

    .guru-profile span {
        display: block;
        margin-top: 5px;
        opacity: .85;
    }

    .guru-menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .guru-menu button {
        border: 0;
        background: white;
        border-radius: 16px;
        padding: 22px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .guru-menu button:hover {
        transform: translateY(-2px);
    }

    .menu-icon {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .menu-title {
        font-size: 18px;
        font-weight: bold;
        color: #064e3b;
    }

    .menu-desc {
        margin-top: 6px;
        font-size: 13px;
        color: #6b7280;
    }

    .guru-bottom {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .guru-bottom button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 13px;
        cursor: pointer;
        font-weight: bold;
    }

    .logout {
        background: #dc2626;
        color: white;
    }

    .disabled {
        background: #e5e7eb;
        color: #6b7280;
    }

    /* MODAL */

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.55);
        z-index: 9999;
        padding: 15px;
        overflow-y: auto;
    }

    .modal.show {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .modal-box {
        width: 100%;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        background: white;
        border-radius: 18px;
        padding: 20px;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .modal-header h2 {
        margin: 0;
        color: #064e3b;
    }

    .close {
        border: 0;
        background: #f3f4f6;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        font-size: 20px;
        cursor: pointer;
    }

    /* SEARCH */

    .search-row {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 10px;
        margin-bottom: 15px;
    }

    input,
    select,
    textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    /* STUDENT */

    .student-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 400px;
        overflow-y: auto;
    }

    .student {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 13px;
        background: #fafafa;
    }

    .student.clickable {
        cursor: pointer;
    }

    .student.clickable:hover {
        background: #ecfdf5;
        border-color: #047857;
    }

    .student-name {
        font-weight: bold;
    }

    .student-info {
        margin-top: 4px;
        color: #6b7280;
        font-size: 13px;
    }

    .points {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
    }

    .badge {
        padding: 4px 7px;
        border-radius: 7px;
        background: #ecfdf5;
        color: #047857;
        font-size: 12px;
        font-weight: bold;
    }

    .badge.red {
        background: #fef2f2;
        color: #dc2626;
    }

    .badge.gray {
        background: #f3f4f6;
        color: #374151;
    }

    /* FORM */

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
    }

    .selected {
        display: none;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 15px;
    }

    .selected.show {
        display: block;
    }

    .selected-name {
        font-weight: bold;
        color: #065f46;
    }

    .selected-info {
        margin-top: 4px;
        font-size: 13px;
        color: #047857;
    }

    .clear {
        margin-top: 8px;
        border: 0;
        background: none;
        color: #dc2626;
        cursor: pointer;
        padding: 0;
    }

    .submit {
        width: 100%;
        border: 0;
        border-radius: 11px;
        padding: 13px;
        background: #047857;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .submit.red {
        background: #dc2626;
    }

    .message {
        display: none;
        padding: 11px;
        border-radius: 10px;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .message.show {
        display: block;
    }

    .message.success {
        background: #ecfdf5;
        color: #065f46;
    }

    .message.error {
        background: #fef2f2;
        color: #991b1b;
    }

    .loading {
        text-align: center;
        padding: 25px;
        color: #6b7280;
    }

    @media (max-width: 650px) {

        .guru-container {
            padding: 12px;
        }

        .guru-menu {
            grid-template-columns: 1fr;
        }

        .search-row {
            grid-template-columns: 1fr;
        }

        .guru-bottom {
            flex-direction: column;
        }

        .modal {
            padding: 8px;
        }

        .modal-box {
            padding: 15px;
        }

    }
</style>

</div>

<script>

    // =====================================================
    // SESSION
    // =====================================================

    const guruSession =
        JSON.parse(
            sessionStorage.getItem(
                "lentera_guru_session"
            ) || "null"
        );

    if (!guruSession) {

        window.location.href =
            "guru-login.html";

    }


    if (guruSession) {

        document.getElementById(
            "guruName"
        ).textContent =
            guruSession.nama || "Guru";

        document.getElementById(
            "guruUsername"
        ).textContent =
            "@" +
            (guruSession.username || "");

    }


    // =====================================================
    // DATA
    // =====================================================

    let students = [];

    let rewardStudents = [];

    let violationStudents = [];


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // =====================================================
    // DATA SISWA
    // =====================================================

    async function getStudents() {

        const response =
            await fetch(
                "/.netlify/functions/guru-students",
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );

        const raw =
            await response.text();

        console.log(
            "GURU STUDENTS STATUS:",
            response.status
        );

        console.log(
            "GURU STUDENTS RESPONSE:",
            raw
        );

        let result;

        try {

            result =
                JSON.parse(raw);

        }
        catch (error) {

            throw new Error(
                "Response server bukan JSON. Status: " +
                response.status
            );

        }

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Gagal mengambil data siswa."
            );

        }

        return Array.isArray(
            result.siswa
        )
            ? result.siswa
            : [];

    }


    // =====================================================
    // DATA SISWA
    // =====================================================

    async function openStudents() {

        document
            .getElementById(
                "studentsModal"
            )
            .classList.add("show");

        const results =
            document.getElementById(
                "studentResults"
            );

        results.innerHTML = `
            <div class="loading">
                Memuat data siswa...
            </div>
        `;

        try {

            students =
                await getStudents();

            filterStudents();

        }
        catch (error) {

            console.error(error);

            results.innerHTML = `
                <div class="loading">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    function closeStudents() {

        document
            .getElementById(
                "studentsModal"
            )
            .classList.remove("show");

    }


    function filterStudents() {

        const search =
            document
                .getElementById(
                    "studentSearch"
                )
                .value
                .trim()
                .toLowerCase();

        const kelas =
            document
                .getElementById(
                    "studentClass"
                )
                .value;

        const filtered =
            students.filter(
                siswa => {

                    const matchSearch =
                        !search ||
                        String(
                            siswa.nama || ""
                        )
                            .toLowerCase()
                            .includes(search) ||
                        String(
                            siswa.nisn || ""
                        )
                            .toLowerCase()
                            .includes(search);

                    const matchClass =
                        !kelas ||
                        siswa.kelas === kelas;

                    return (
                        matchSearch &&
                        matchClass
                    );

                }
            );

        const results =
            document.getElementById(
                "studentResults"
            );

        if (!filtered.length) {

            results.innerHTML = `
                <div class="loading">
                    Tidak ada siswa ditemukan.
                </div>
            `;

            return;

        }

        results.innerHTML =
            filtered
                .map(siswa => `

                    <div class="student">

                        <div class="student-name">
                            ${escapeHtml(
                                siswa.nama
                            )}
                        </div>

                        <div class="student-info">
                            NISN:
                            ${escapeHtml(
                                siswa.nisn
                            )}
                            ·
                            Kelas:
                            ${escapeHtml(
                                siswa.kelas
                            )}
                        </div>

                        <div class="points">

                            <span class="badge">
                                🏆
                                ${Number(
                                    siswa.penghargaan || 0
                                )}
                            </span>

                            <span class="badge red">
                                ⚠️
                                ${Number(
                                    siswa.pelanggaran || 0
                                )}
                            </span>

                            <span class="badge gray">
                                Total:
                                ${Number(
                                    siswa.total || 0
                                )}
                            </span>

                        </div>

                    </div>

                `)
                .join("");

    }


    // =====================================================
    // PENGHARGAAN
    // =====================================================

    async function openRewards() {

        document
            .getElementById(
                "rewardsModal"
            )
            .classList.add("show");

        clearReward();

        const results =
            document.getElementById(
                "rewardResults"
            );

        results.innerHTML = `
            <div class="loading">
                Memuat data siswa...
            </div>
        `;

        try {

            rewardStudents =
                await getStudents();

            filterRewards();

        }
        catch (error) {

            console.error(error);

            results.innerHTML = `
                <div class="loading">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    function closeRewards() {

        document
            .getElementById(
                "rewardsModal"
            )
            .classList.remove("show");

    }


    function filterRewards() {

        const search =
            document
                .getElementById(
                    "rewardSearch"
                )
                .value
                .trim()
                .toLowerCase();

        const kelas =
            document
                .getElementById(
                    "rewardClass"
                )
                .value;

        const filtered =
            rewardStudents.filter(
                siswa => {

                    const matchSearch =
                        !search ||
                        String(
                            siswa.nama || ""
                        )
                            .toLowerCase()
                            .includes(search) ||
                        String(
                            siswa.nisn || ""
                        )
                            .includes(search);

                    const matchClass =
                        !kelas ||
                        siswa.kelas === kelas;

                    return (
                        matchSearch &&
                        matchClass
                    );

                }
            );

        const results =
            document.getElementById(
                "rewardResults"
            );

        if (!filtered.length) {

            results.innerHTML = `
                <div class="loading">
                    Tidak ada siswa ditemukan.
                </div>
            `;

            return;

        }

        results.innerHTML =
            filtered
                .map(siswa => `

                    <div
                        class="student clickable"
                        onclick="selectReward('${escapeHtml(siswa.id)}')"
                    >

                        <div class="student-name">
                            ${escapeHtml(
                                siswa.nama
                            )}
                        </div>

                        <div class="student-info">
                            NISN:
                            ${escapeHtml(
                                siswa.nisn
                            )}
                            ·
                            Kelas:
                            ${escapeHtml(
                                siswa.kelas
                            )}
                        </div>

                        <div class="points">

                            <span class="badge">
                                🏆
                                ${Number(
                                    siswa.penghargaan || 0
                                )}
                            </span>

                            <span class="badge red">
                                ⚠️
                                ${Number(
                                    siswa.pelanggaran || 0
                                )}
                            </span>

                        </div>

                    </div>

                `)
                .join("");

    }


    function selectReward(id) {

        const siswa =
            rewardStudents.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!siswa) {
            return;
        }

        document.getElementById(
            "rewardStudent"
        ).value = siswa.id;

        const selected =
            document.getElementById(
                "rewardSelected"
            );

        selected.innerHTML = `

            <div class="selected-name">
                ${escapeHtml(
                    siswa.nama
                )}
            </div>

            <div class="selected-info">
                NISN:
                ${escapeHtml(
                    siswa.nisn
                )}
                ·
                Kelas:
                ${escapeHtml(
                    siswa.kelas
                )}
            </div>

            <button
                class="clear"
                onclick="clearReward()"
            >
                × Ganti siswa
            </button>

        `;

        selected.classList.add(
            "show"
        );

    }


    function clearReward() {

        document.getElementById(
            "rewardStudent"
        ).value = "";

        document.getElementById(
            "rewardSelected"
        ).innerHTML = "";

        document.getElementById(
            "rewardSelected"
        ).classList.remove(
            "show"
        );

        const message =
            document.getElementById(
                "rewardMessage"
            );

        message.className =
            "message";

        message.textContent = "";

    }


    async function submitReward() {

        const siswaId =
            document.getElementById(
                "rewardStudent"
            ).value;

        const poin =
            Number(
                document.getElementById(
                    "rewardPoints"
                ).value
            );

        const keterangan =
            document.getElementById(
                "rewardDescription"
            ).value
            .trim();

        if (!siswaId) {

            showMessage(
                "rewardMessage",
                "Pilih siswa terlebih dahulu.",
                "error"
            );

            return;

        }

        if (
            !Number.isInteger(poin) ||
            poin < 1 ||
            poin > 100
        ) {

            showMessage(
                "rewardMessage",
                "Poin harus 1 sampai 100.",
                "error"
            );

            return;

        }

        if (!keterangan) {

            showMessage(
                "rewardMessage",
                "Keterangan wajib diisi.",
                "error"
            );

            return;

        }

        try {

            const response =
                await fetch(
                    "/.netlify/functions/guru-points",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            siswaId,

                            poin,

                            keterangan,

                            jenis:
                                "penghargaan",

                            guruId:
                                guruSession.id,

                            guruUsername:
                                guruSession.username

                        })

                    }
                );

            const raw =
                await response.text();

            let result;

            try {

                result =
                    JSON.parse(raw);

            }
            catch (error) {

                throw new Error(
                    "Response server bukan JSON."
                );

            }

            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Gagal menambahkan poin."
                );

            }

            showMessage(
                "rewardMessage",
                "Poin penghargaan berhasil ditambahkan.",
                "success"
            );

            document.getElementById(
                "rewardPoints"
            ).value = "";

            document.getElementById(
                "rewardDescription"
            ).value = "";

            rewardStudents =
                await getStudents();

            filterRewards();

        }
        catch (error) {

            console.error(error);

            showMessage(
                "rewardMessage",
                error.message,
                "error"
            );

        }

    }


    // =====================================================
    // PELANGGARAN
    // =====================================================

    async function openViolations() {

        document
            .getElementById(
                "violationsModal"
            )
            .classList.add("show");

        clearViolation();

        const results =
            document.getElementById(
                "violationResults"
            );

        results.innerHTML = `
            <div class="loading">
                Memuat data siswa...
            </div>
        `;

        try {

            violationStudents =
                await getStudents();

            filterViolations();

        }
        catch (error) {

            console.error(error);

            results.innerHTML = `
                <div class="loading">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    function closeViolations() {

        document
            .getElementById(
                "violationsModal"
            )
            .classList.remove("show");

    }


    function filterViolations() {

        const search =
            document
                .getElementById(
                    "violationSearch"
                )
                .value
                .trim()
                .toLowerCase();

        const kelas =
            document
                .getElementById(
                    "violationClass"
                )
                .value;

        const filtered =
            violationStudents.filter(
                siswa => {

                    const matchSearch =
                        !search ||
                        String(
                            siswa.nama || ""
                        )
                            .toLowerCase()
                            .includes(search) ||
                        String(
                            siswa.nisn || ""
                        )
                            .includes(search);

                    const matchClass =
                        !kelas ||
                        siswa.kelas === kelas;

                    return (
                        matchSearch &&
                        matchClass
                    );

                }
            );

        const results =
            document.getElementById(
                "violationResults"
            );

        if (!filtered.length) {

            results.innerHTML = `
                <div class="loading">
                    Tidak ada siswa ditemukan.
                </div>
            `;

            return;

        }

        results.innerHTML =
            filtered
                .map(siswa => `

                    <div
                        class="student clickable"
                        onclick="selectViolation('${escapeHtml(siswa.id)}')"
                    >

                        <div class="student-name">
                            ${escapeHtml(
                                siswa.nama
                            )}
                        </div>

                        <div class="student-info">
                            NISN:
                            ${escapeHtml(
                                siswa.nisn
                            )}
                            ·
                            Kelas:
                            ${escapeHtml(
                                siswa.kelas
                            )}
                        </div>

                        <div class="points">

                            <span class="badge">
                                🏆
                                ${Number(
                                    siswa.penghargaan || 0
                                )}
                            </span>

                            <span class="badge red">
                                ⚠️
                                ${Number(
                                    siswa.pelanggaran || 0
                                )}
                            </span>

                        </div>

                    </div>

                `)
                .join("");

    }


    function selectViolation(id) {

        const siswa =
            violationStudents.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!siswa) {
            return;
        }

        document.getElementById(
            "violationStudent"
        ).value = siswa.id;

        const selected =
            document.getElementById(
                "violationSelected"
            );

        selected.innerHTML = `

            <div class="selected-name">
                ${escapeHtml(
                    siswa.nama
                )}
            </div>

            <div class="selected-info">
                NISN:
                ${escapeHtml(
                    siswa.nisn
                )}
                ·
                Kelas:
                ${escapeHtml(
                    siswa.kelas
                )}
            </div>

            <button
                class="clear"
                onclick="clearViolation()"
            >
                × Ganti siswa
            </button>

        `;

        selected.classList.add(
            "show"
        );

    }


    function clearViolation() {

        document.getElementById(
            "violationStudent"
        ).value = "";

        document.getElementById(
            "violationSelected"
        ).innerHTML = "";

        document.getElementById(
            "violationSelected"
        ).classList.remove(
            "show"
        );

        const message =
            document.getElementById(
                "violationMessage"
            );

        message.className =
            "message";

        message.textContent = "";

    }


    async function submitViolation() {

        const siswaId =
            document.getElementById(
                "violationStudent"
            ).value;

        const poin =
            Number(
                document.getElementById(
                    "violationPoints"
                ).value
            );

        const keterangan =
            document.getElementById(
                "violationDescription"
            ).value
            .trim();

        if (!siswaId) {

            showMessage(
                "violationMessage",
                "Pilih siswa terlebih dahulu.",
                "error"
            );

            return;

        }

        if (
            !Number.isInteger(poin) ||
            poin < 1 ||
            poin > 100
        ) {

            showMessage(
                "violationMessage",
                "Poin harus 1 sampai 100.",
                "error"
            );

            return;

        }

        if (!keterangan) {

            showMessage(
                "violationMessage",
                "Keterangan wajib diisi.",
                "error"
            );

            return;

        }

        try {

            const response =
                await fetch(
                    "/.netlify/functions/guru-points",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            siswaId,

                            poin,

                            keterangan,

                            jenis:
                                "pelanggaran",

                            guruId:
                                guruSession.id,

                            guruUsername:
                                guruSession.username

                        })

                    }
                );

            const raw =
                await response.text();

            let result;

            try {

                result =
                    JSON.parse(raw);

            }
            catch (error) {

                throw new Error(
                    "Response server bukan JSON."
                );

            }

            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Gagal menambahkan poin."
                );

            }

            showMessage(
                "violationMessage",
                "Poin pelanggaran berhasil ditambahkan.",
                "success"
            );

            document.getElementById(
                "violationPoints"
            ).value = "";

            document.getElementById(
                "violationDescription"
            ).value = "";

            violationStudents =
                await getStudents();

            filterViolations();

        }
        catch (error) {

            console.error(error);

            showMessage(
                "violationMessage",
                error.message,
                "error"
            );

        }

    }


    // =====================================================
    // MESSAGE
    // =====================================================

    function showMessage(
        id,
        text,
        type
    ) {

        const element =
            document.getElementById(id);

        element.textContent =
            text;

        element.className =
            "message show " +
            type;

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    function logoutGuru() {

        sessionStorage.removeItem(
            "lentera_guru_session"
        );

        window.location.href =
            "guru-login.html";

    }


    // =====================================================
    // CLOSE MODAL KLIK LUAR
    // =====================================================

    document.addEventListener(
        "click",
        function(event) {

            document
                .querySelectorAll(".modal")
                .forEach(modal => {

                    if (
                        event.target === modal
                    ) {

                        modal.classList.remove(
                            "show"
                        );

                    }

                });

        }
    );

</script>
