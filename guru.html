<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Panel Guru - LENTERA SMANTI</title>

  

  <style>

    body {
      min-height: 100vh;
    }

    .guru-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .guru-header {
      margin-bottom: 20px;
    }

    .guru-header h1 {
      margin: 0;
    }

    .guru-header p {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .guru-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .guru-avatar {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;

      background: rgba(251,192,45,0.12);
      border: 1px solid rgba(251,192,45,0.2);
    }

    .guru-profile strong {
      display: block;
      color: #fff;
      font-size: 15px;
    }

    .guru-profile span {
      display: block;
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .guru-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .guru-menu-button {
      width: 100%;
      min-height: 120px;

      padding: 20px;

      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.07);

      background: rgba(255,255,255,0.04);

      color: #fff;

      cursor: pointer;

      text-align: left;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .guru-menu-button:hover {
      transform: translateY(-2px);

      background:
        rgba(255,255,255,0.07);

      border-color:
        rgba(251,192,45,0.25);
    }

    .guru-menu-button:active {
      transform: scale(0.98);
    }

    .guru-menu-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .guru-menu-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }

    .guru-menu-description {
      display: block;
      margin-top: 5px;

      color: var(--text-muted);

      font-size: 11px;
      line-height: 1.5;
    }

    .guru-bottom {
      margin-top: 20px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .guru-secondary-button {
      width: 100%;
      padding: 13px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color: var(--text-muted);

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;
    }

    .guru-secondary-button:hover {
      background:
        rgba(255,255,255,0.07);

      color: #fff;
    }

    .guru-footer {
      text-align: center;

      margin-top: 25px;

      color: var(--text-muted);

      font-size: 10px;
    }

    @media (max-width: 600px) {

      .guru-container {
        padding: 14px;
      }

      .guru-menu {
        grid-template-columns: 1fr;
      }

      .guru-menu-button {
        min-height: 105px;
      }

      .guru-bottom {
        grid-template-columns: 1fr;
      }

    }

    .guru-students-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,0.72);

  backdrop-filter: blur(8px);

  z-index: 9999;

  padding: 20px;

  overflow-y: auto;
}

.guru-students-modal {
  width: 100%;
  max-width: 850px;

  margin: 20px auto;

  background: #111827;

  border: 1px solid rgba(255,255,255,0.08);

  border-radius: 18px;

  padding: 20px;

  box-sizing: border-box;
}

.guru-students-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 18px;
}

.guru-students-header h2 {
  margin: 0;

  color: #fff;

  font-size: 18px;
}

.guru-students-header p {
  margin: 5px 0 0;

  color: var(--text-muted);

  font-size: 11px;
}

.guru-close-button {
  width: 36px;
  height: 36px;

  border: none;

  border-radius: 10px;

  color: #fff;

  font-size: 24px;

  cursor: pointer;
}

.guru-students-tools {
  display: grid;

  grid-template-columns: 1fr 180px;

  gap: 10px;

  margin-bottom: 16px;
}

.guru-students-tools input,
.guru-students-tools select {
  width: 100%;

  box-sizing: border-box;

  padding: 12px 13px;

  border-radius: 10px;

  border: 1px solid rgba(255,255,255,0.08);

  background: rgba(255,255,255,0.05);

  color: #fff;

  outline: none;
}

.guru-students-tools input::placeholder {
  color: var(--text-muted);
}

.guru-students-tools select option {
  background: #111827;

  color: #fff;
}

.guru-students-loading {
  padding: 25px;

  text-align: center;

  color: var(--text-muted);

  font-size: 12px;
}

.guru-students-list {
  display: flex;

  flex-direction: column;

  gap: 10px;

  max-height: 65vh;

  overflow-y: auto;

  padding-right: 4px;
}

.guru-student-card {
  padding: 14px;

  border-radius: 14px;

  background: rgba(255,255,255,0.04);

  border: 1px solid rgba(255,255,255,0.06);
}

.guru-student-main {
  display: flex;

  align-items: center;

  gap: 12px;
}

.guru-student-avatar {
  width: 42px;
  height: 42px;

  min-width: 42px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: rgba(251,192,45,0.10);

  border: 1px solid rgba(251,192,45,0.16);

  font-size: 19px;
}

.guru-student-info {
  min-width: 0;
}

.guru-student-info strong {
  display: block;

  color: #fff;

  font-size: 13px;

  margin-bottom: 4px;
}

.guru-student-info span {
  display: inline-block;

  margin-right: 12px;

  color: var(--text-muted);

  font-size: 10px;
}

.guru-student-points {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-top: 12px;
}

.guru-point {
  padding: 9px;

  border-radius: 10px;

  background: rgba(255,255,255,0.035);

  text-align: center;
}

.guru-point span {
  display: block;

  color: var(--text-muted);

  font-size: 9px;

  margin-bottom: 4px;
}

.guru-point strong {
  font-size: 13px;
}

.guru-point.reward strong {
  color: #4ade80;
}

.guru-point.violation strong {
  color: #f87171;
}

.guru-point.total strong {
  color: #fff;
}

.guru-point.total.positive strong {
  color: #4ade80;
}

.guru-point.total.negative strong {
  color: #f87171;
}

.guru-point.total.neutral strong {
  color: var(--text-muted);
}

.guru-students-empty {
  padding: 30px;

  text-align: center;

  color: var(--text-muted);

  font-size: 12px;
}

@media (max-width: 600px) {

  .guru-students-overlay {
    padding: 10px;
  }

  .guru-students-modal {

    padding: 14px;

  }

  .guru-students-tools {
    grid-template-columns: 1fr;
  }

  .guru-student-info span {
    display: block;

    margin-right: 0;

  }

  .guru-student-points {
    grid-template-columns: 1fr;

}

.guru-reward-header h2 {

.guru-reward-header p {

.guru-form-label {

.guru-form-input {

.guru-form-input:focus {

.guru-reward-submit {

</head>

<body>

  <main class="guru-container">

  <script>

    /*
      ============================
      CEK SESSION GURU
      ============================
    */

    const session =
      sessionStorage.getItem(
        "lentera_guru_session"
      );


    if (!session) {

      window.location.href =
        "guru-login.html";

    }


    let guru = null;


    try {

      guru =
        JSON.parse(session);

    }
    catch (error) {

      sessionStorage.removeItem(
        "lentera_guru_session"
      );

      window.location.href =
        "guru-login.html";

    }


    /*
      ============================
      TAMPILKAN DATA GURU
      ============================
    */

    if (guru) {

      document
        .getElementById("guruName")
        .textContent =
        guru.nama || "Guru";


      document
        .getElementById("guruUsername")
        .textContent =
        "@" +
        (guru.username || "");

    }


    /*
      ============================
      MENU
      ============================
    */

    async function openGuruStudents() {

  const existing =
    document.getElementById(
      "guruStudentsModal"
    );

  if (existing) {
    existing.remove();
  }

  const modal =
    document.createElement("div");

  modal.id =
    "guruStudentsModal";

  modal.className =
    "guru-students-overlay";

  modal.innerHTML = `

    <div class="guru-students-modal">

      <div class="guru-students-header">

        <div>
          <h2>Data Siswa</h2>
          <p>
            Data siswa dan rekap poin
          </p>
        </div>

        <button
          type="button"
          class="guru-close-button"
          onclick="closeGuruStudents()"
        >
          ×
        </button>

      </div>

      <div class="guru-students-tools">

        <input
          type="text"
          id="guruStudentSearch"
          placeholder="Cari nama atau NISN..."
          oninput="filterGuruStudents()"
        >

        <select
          id="guruClassFilter"
          onchange="filterGuruStudents()"
        >

          <option value="">
            Semua Kelas
          </option>

          <option value="X A">
            X A
          </option>

          <option value="X B">
            X B
          </option>

          <option value="XI A">
            XI A
          </option>

          <option value="XI B">
            XI B
          </option>

          <option value="XII A">
            XII A
          </option>

          <option value="XII B">
            XII B
          </option>

        </select>

      </div>

      <div
        id="guruStudentsLoading"
        class="guru-students-loading"
      >
        Memuat data siswa...
      </div>

      <div
        id="guruStudentsList"
        class="guru-students-list"
      ></div>

    </div>

  `;

  document.body.appendChild(modal);

  await loadGuruStudents();

}

    let guruStudentsData = [];

async function loadGuruStudents() {

  const loading =
    document.getElementById(
      "guruStudentsLoading"
    );

  const list =
    document.getElementById(
      "guruStudentsList"
    );

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-students"
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengambil data."
      );

    }

    guruStudentsData =
      Array.isArray(result.siswa)
        ? result.siswa
        : [];

    if (loading) {
      loading.style.display =
        "none";
    }

    renderGuruStudents(
      guruStudentsData
    );

  }
  catch (error) {

    console.error(
      "GURU STUDENTS ERROR:",
      error
    );

    if (loading) {

      loading.textContent =
        "Gagal memuat data siswa.";

    }

  }

}

function renderGuruStudents(data) {

  const list =
    document.getElementById(
      "guruStudentsList"
    );

  if (!list) {
    return;
  }

  if (!data.length) {

    list.innerHTML = `
      <div class="guru-students-empty">
        Data siswa tidak ditemukan.
      </div>
    `;

    return;

  }

  list.innerHTML =
    data.map(siswa => {

      const totalClass =
        siswa.total > 0
          ? "positive"
          : siswa.total < 0
            ? "negative"
            : "neutral";

      return `

        <div class="guru-student-card">

          <div class="guru-student-main">

            <div class="guru-student-avatar">
              👤
            </div>

            <div class="guru-student-info">

              <strong>
                ${escapeHtml(
                  siswa.nama
                )}
              </strong>

              <span>
                NISN:
                ${escapeHtml(
                  siswa.nisn
                )}
              </span>

              <span>
                Kelas:
                ${escapeHtml(
                  siswa.kelas
                )}
              </span>

            </div>

          </div>

          <div class="guru-student-points">

            <div class="guru-point reward">

              <span>
                Penghargaan
              </span>

              <strong>
                +${siswa.penghargaan}
              </strong>

            </div>

            <div class="guru-point violation">

              <span>
                Pelanggaran
              </span>

              <strong>
                -${siswa.pelanggaran}
              </strong>

            </div>

            <div class="guru-point total ${totalClass}">

              <span>
                Total
              </span>

              <strong>
                ${siswa.total > 0 ? "+" : ""}
                ${siswa.total}
              </strong>

            </div>

          </div>

        </div>

      `;

    }).join("");

}

function filterGuruStudents() {

  const searchInput =
    document.getElementById(
      "guruStudentSearch"
    );

  const classFilter =
    document.getElementById(
      "guruClassFilter"
    );

  const search =
    String(
      searchInput?.value || ""
    )
      .trim()
      .toLowerCase();

  const selectedClass =
    String(
      classFilter?.value || ""
    )
      .trim()
      .toLowerCase();

  const filtered =
    guruStudentsData.filter(
      siswa => {

        const nama =
          String(
            siswa.nama || ""
          ).toLowerCase();

        const nisn =
          String(
            siswa.nisn || ""
          ).toLowerCase();

        const kelas =
          String(
            siswa.kelas || ""
          ).toLowerCase();

        const cocokSearch =
          !search ||
          nama.includes(search) ||
          nisn.includes(search);

        const cocokKelas =
          !selectedClass ||
          kelas === selectedClass;

        return (
          cocokSearch &&
          cocokKelas
        );

      }
    );

  renderGuruStudents(
    filtered
  );

}

function closeGuruStudents() {

  const modal =
    document.getElementById(
      "guruStudentsModal"
    );

  if (modal) {
    modal.remove();
  }

}

        <label class="guru-form-label">

        <input
          type="number"
          id="guruRewardPoints"
          class="guru-form-input"
          min="1"
          max="100"
          placeholder="Contoh: 10"
          required
        >

        <label class="guru-form-label">
          Keterangan
        </label>

        <textarea
          id="guruRewardDescription"
          class="guru-form-input guru-form-textarea"
          maxlength="500"
          placeholder="Contoh: Aktif mengikuti kegiatan sekolah..."
          required
        ></textarea>

        <button
          type="submit"
          id="guruRewardSubmit"
          class="guru-reward-submit"
        >
          ⭐ Berikan Poin
        </button>

        <div
          id="guruRewardMessage"
          class="guru-reward-message"
        ></div>

      </form>

    </div>

  `;

  document.body.appendChild(modal);

  await loadGuruRewardStudents();

}

    async function loadGuruRewardStudents() {

  const select =
    document.getElementById(
      "guruRewardStudent"
    );

  if (!select) {
    return;
  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-students"
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengambil data siswa."
      );

    }

    const siswa =
      Array.isArray(result.siswa)
        ? result.siswa
        : [];

    siswa.sort((a, b) => {

      const kelasA =
        String(a.kelas || "");

      const kelasB =
        String(b.kelas || "");

      const kelasCompare =
        kelasA.localeCompare(
          kelasB,
          "id"
        );

      if (kelasCompare !== 0) {
        return kelasCompare;
      }

      return String(a.nama || "")
        .localeCompare(
          String(b.nama || ""),
          "id"
        );

    });

    select.innerHTML = `

      <option value="">
        Pilih siswa...
      </option>

      ${siswa.map(siswa => `

        <option value="${escapeHtml(siswa.id)}">

          ${escapeHtml(siswa.nama)}
          — ${escapeHtml(siswa.kelas)}
          — ${escapeHtml(siswa.nisn)}

        </option>

      `).join("")}

    `;

  }
  catch (error) {

    console.error(
      "LOAD REWARD STUDENTS ERROR:",
      error
    );

    select.innerHTML = `

      <option value="">
        Gagal memuat siswa
      </option>

    `;

  }

}

    async function submitGuruReward(event) {

  event.preventDefault();

  const studentSelect =
    document.getElementById(
      "guruRewardStudent"
    );

  const pointsInput =
    document.getElementById(
      "guruRewardPoints"
    );

  const descriptionInput =
    document.getElementById(
      "guruRewardDescription"
    );

  const submitButton =
    document.getElementById(
      "guruRewardSubmit"
    );

  const message =
    document.getElementById(
      "guruRewardMessage"
    );

  const siswaId =
    String(
      studentSelect?.value || ""
    ).trim();

  const poin =
    Number(
      pointsInput?.value || 0
    );

  const keterangan =
    String(
      descriptionInput?.value || ""
    ).trim();

  if (!siswaId) {

    showGuruRewardMessage(
      "Silakan pilih siswa.",
      "error"
    );

    return;

  }

  if (
    !Number.isFinite(poin) ||
    poin < 1 ||
    poin > 100
  ) {

    showGuruRewardMessage(
      "Poin harus antara 1 sampai 100.",
      "error"
    );

    return;

  }

  if (!keterangan) {

    showGuruRewardMessage(
      "Keterangan wajib diisi.",
      "error"
    );

    return;

  }

  const session =
    sessionStorage.getItem(
      "lentera_guru_session"
    );

  if (!session) {

    window.location.href =
      "guru-login.html";

    return;

  }

  let guru;

  try {

    guru =
      JSON.parse(session);

  }
  catch (error) {

    sessionStorage.removeItem(
      "lentera_guru_session"
    );

    window.location.href =
      "guru-login.html";

    return;

  }

  submitButton.disabled = true;

  submitButton.textContent =
    "Menyimpan...";

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-points",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            siswaId,

            poin,

            keterangan,

            guruId:
              guru.id || "",

            guruUsername:
              guru.username || ""

          })

        }
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal menyimpan poin."
      );

    }

    showGuruRewardMessage(
      "Poin penghargaan berhasil diberikan.",
      "success"
    );

    document
      .getElementById(
        "guruRewardPoints"
      )
      .value = "";

    document
      .getElementById(
        "guruRewardDescription"
      )
      .value = "";

    setTimeout(() => {

      closeGuruRewards();

    }, 1200);

  }
  catch (error) {

    console.error(
      "SUBMIT GURU REWARD ERROR:",
      error
    );

    showGuruRewardMessage(
      error.message ||
      "Terjadi kesalahan.",
      "error"
    );

  }
  finally {

    submitButton.disabled = false;

    submitButton.textContent =
      "⭐ Berikan Poin";

  }

}

function showGuruRewardMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "guruRewardMessage"
    );

  if (!message) {
    return;
  }

  message.textContent =
    text;

  message.className =
    "guru-reward-message " +
    type;

}

function closeGuruRewards() {

  const modal =
    document.getElementById(
      "guruRewardModal"
    );

  if (modal) {
    modal.remove();
  }

}

    function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
