<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Guru - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(251, 192, 45, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .guru-container {
      width: 100%;
      max-width: 900px;
    }

    /* HEADER */
    .guru-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .guru-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .guru-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .guru-profile {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--border-color);
    }

    .guru-profile strong {
      display: block;
      font-size: 16px;
      color: var(--text-main);
    }

    .guru-profile span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: var(--accent-gold);
    }

    /* MENU GRID */
    .guru-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .guru-menu button {
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-main);
    }

    .guru-menu button:hover:not(.disabled) {
      border-color: var(--accent-gold);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      background: rgba(28, 37, 65, 0.9);
    }

    .menu-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .menu-desc {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* BOTTOM BUTTONS */
    .guru-bottom {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .guru-bottom button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3) !important;
    }

    .logout:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .disabled {
      background: rgba(255, 255, 255, 0.05) !important;
      color: var(--text-muted) !important;
      border: 1px solid var(--border-color) !important;
      opacity: 0.6;
      cursor: not-allowed !important;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--accent-gold);
    }

    .close {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
    }

    /* FORM & INPUTS */
    .search-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 16px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* STUDENT LIST */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .student {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      background: rgba(11, 19, 43, 0.5);
      transition: all 0.2s ease;
    }

    .student.clickable {
      cursor: pointer;
    }

    .student.clickable:hover {
      background: rgba(251, 192, 45, 0.08);
      border-color: var(--accent-gold);
    }

    .student-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .student-info {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .points {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge.red {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .badge.gray {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-color: var(--border-color);
    }

    /* FORM GROUPS */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--accent-gold);
    }

    .selected {
      display: none;
      background: rgba(251, 192, 45, 0.1);
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .selected.show {
      display: block;
    }

    .selected-name {
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 14px;
    }

    .selected-info {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .clear {
      margin-top: 8px;
      border: 0;
      background: none;
      color: #f87171;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .submit:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
    }

    .submit.red {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: none;
    }

    .submit.red:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
    }

    /* MESSAGES */
    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* PASSWORD FORM */

.password-form {
  margin-top: 8px;
}

.password-form .form-group {
  margin-bottom: 16px;
}

.password-form label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-gold);
}

.password-form input {
  width: 100%;
}

.password-message {
  display: none;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
}

.password-message.show {
  display: block;
}

.password-message.success {
  background: rgba(16, 185, 129, 0.15);
  color: var(--success-color);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.password-message.error {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.password-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none !important;
}

    @media (max-width: 650px) {
      .guru-container {
        padding: 0;
      }

      .guru-menu {
        grid-template-columns: 1fr;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .guru-bottom {
        flex-direction: column;
      }

      .modal {
        padding: 10px;
      }

      .modal-box {
        padding: 18px;
      }
    }

    .danger-button {
  border: 0;
  background: var(--danger-color);
  color: white;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.danger-button:hover {
  opacity: 0.9;
}
  </style>
</head>

<body>

  <div class="guru-container">

    <!-- HEADER -->
    <div class="guru-header">
      <h1>Panel Guru</h1>
      <p>LENTERA SMANTI</p>

      <div class="guru-profile">
        <strong id="guruName">Memuat...</strong>
        <span id="guruUsername">@...</span>
      </div>
    </div>

    <!-- MENU -->
    <div class="guru-menu">

      <button type="button" onclick="openStudents()">
        <div class="menu-icon">👨‍🎓</div>
        <div class="menu-title">Data Siswa</div>
        <div class="menu-desc">Melihat data siswa dan jumlah poin.</div>
      </button>

      <button type="button" onclick="openRewards()">
        <div class="menu-icon">🏆</div>
        <div class="menu-title">Penghargaan</div>
        <div class="menu-desc">Menambahkan poin penghargaan.</div>
      </button>

      <button type="button" onclick="openViolations()">
        <div class="menu-icon">⚠️</div>
        <div class="menu-title">Pelanggaran</div>
        <div class="menu-desc">Menambahkan poin pelanggaran.</div>
      </button>

      <button type="button" onclick="openMyPoints()">

  <div class="menu-icon">📋</div>

  <div class="menu-title">
    Poin Saya
  </div>

  <div class="menu-desc">
    Melihat, mengedit, dan menghapus poin yang Anda tambahkan.
  </div>

</button>

      <button
  type="button"
  onclick="openGuruInbox()"
>
  <div class="menu-icon">📨</div>

  <div class="menu-title">
    Inbox Siswa
  </div>

  <div class="menu-desc">
    Kirim dan kelola pesan untuk siswa.
  </div>
</button>

    </div>

    <!-- BOTTOM -->
    <div class="guru-bottom">
      <button
  type="button"
  onclick="openGuruPassword()"
>
  🔐 Ubah Password
</button>

      <button
        type="button"
        class="logout"
        onclick="logoutGuru()"
      >
        🚪 Keluar
      </button>
    </div>

  </div>

  <!-- MODAL POIN SAYA -->

<div id="myPointsModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>📋 Poin Saya</h2>

      <button
        type="button"
        class="close"
        onclick="closeMyPoints()"
      >
        ×
      </button>

    </div>

    <div
      id="myPointsMessage"
      class="message"
    ></div>

    <div
      id="myPointsList"
      class="student-list"
    >

      <div class="loading">
        Memuat poin...
      </div>

    </div>

  </div>

</div>

  <!-- MODAL UBAH PASSWORD GURU -->

<div id="guruPasswordModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>🔐 Ubah Password</h2>

      <button
        type="button"
        class="close"
        onclick="closeGuruPassword()"
      >
        ×
      </button>

    </div>

    <div
      id="guruPasswordMessage"
      class="password-message"
    ></div>

    <div class="password-form">

      <div class="form-group">

        <label for="guruCurrentPassword">
          Password Lama
        </label>

        <input
          type="password"
          id="guruCurrentPassword"
          placeholder="Masukkan password lama"
          autocomplete="current-password"
        >

      </div>

      <div class="form-group">

        <label for="guruNewPassword">
          Password Baru
        </label>

        <input
          type="password"
          id="guruNewPassword"
          placeholder="Minimal 6 karakter"
          autocomplete="new-password"
        >

      </div>

      <div class="form-group">

        <label for="guruConfirmPassword">
          Konfirmasi Password Baru
        </label>

        <input
          type="password"
          id="guruConfirmPassword"
          placeholder="Ulangi password baru"
          autocomplete="new-password"
        >

      </div>

      <button
        type="button"
        class="submit password-submit"
        onclick="submitGuruPassword()"
      >
        🔐 Simpan Password
      </button>

    </div>

  </div>

</div>

  <div id="guruInboxModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>📨 Inbox Siswa</h2>

      <button
        type="button"
        class="close"
        onclick="closeGuruInbox()"
      >
        ×
      </button>

    </div>


    <div
      id="guruInboxMessage"
      class="message"
    ></div>


    <!-- KIRIM PESAN -->

    <div class="form-group">

      <label>
        Pilih Siswa
      </label>

      <input
        type="text"
        id="inboxStudentSearch"
        placeholder="Cari nama atau NISN..."
        oninput="filterInboxStudents()"
      >

    </div>


    <div
      id="inboxStudentList"
      class="student-list"
    ></div>


    <input
      type="hidden"
      id="inboxSelectedStudentId"
    >


    <div class="form-group">

      <label>
        Judul
      </label>

      <input
        type="text"
        id="inboxJudul"
        maxlength="100"
        placeholder="Judul pesan"
      >

    </div>


    <div class="form-group">

      <label>
        Pesan
      </label>

      <textarea
        id="inboxPesan"
        maxlength="2000"
        rows="5"
        placeholder="Tulis pesan untuk siswa..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        Masa Aktif
      </label>

      <select id="inboxDurasi">

        <option value="1h">
          1 Jam
        </option>

        <option value="3h">
          3 Jam
        </option>

        <option value="6h">
          6 Jam
        </option>

        <option value="12h">
          12 Jam
        </option>

        <option value="1d" selected>
          1 Hari
        </option>

        <option value="3d">
          3 Hari
        </option>

        <option value="7d">
          7 Hari
        </option>

      </select>

    </div>


    <button
      type="button"
      class="submit"
      onclick="sendGuruInbox()"
    >
      📨 Kirim Pesan
    </button>


    <hr style="
      margin: 24px 0;
      border: 0;
      border-top: 1px solid var(--border-color);
    ">


    <h3 style="margin-bottom: 12px;">
      Pesan Saya
    </h3>


    <div
      id="guruInboxList"
      class="student-list"
    >
      <div class="loading">
        Memuat pesan...
      </div>
    </div>

  </div>

</div>

  <!-- MODAL DATA SISWA -->
  <div id="studentsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Data Siswa</h2>
        <button type="button" class="close" onclick="closeStudents()">×</button>
      </div>

      <div class="search-row">
        <input
          id="studentSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterStudents()"
        >

        <select id="studentClass" onchange="filterStudents()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="studentResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>
    </div>
  </div>

  <!-- MODAL PENGHARGAAN -->
  <div id="rewardsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Penghargaan</h2>
        <button type="button" class="close" onclick="closeRewards()">×</button>
      </div>

      <div id="rewardMessage" class="message"></div>

      <div class="search-row">
        <input
          id="rewardSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterRewards()"
        >

        <select id="rewardClass" onchange="filterRewards()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="rewardResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>

      <input type="hidden" id="rewardStudent">

      <div id="rewardSelected" class="selected"></div>

      <div class="form-group">
        <label for="rewardPoints">Jumlah Poin</label>
        <input
          id="rewardPoints"
          type="number"
          min="1"
          max="100"
          placeholder="Contoh: 5"
        >
      </div>

      <div class="form-group">
        <label for="rewardDescription">Keterangan</label>
        <textarea
          id="rewardDescription"
          maxlength="500"
          placeholder="Contoh: Juara lomba pidato..."
        ></textarea>
      </div>

      <button type="button" class="submit" onclick="submitReward()">
        🏆 Tambahkan Penghargaan
      </button>
    </div>
  </div>

  <!-- MODAL PELANGGARAN -->
  <div id="violationsModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Pelanggaran</h2>
        <button type="button" class="close" onclick="closeViolations()">×</button>
      </div>

      <div id="violationMessage" class="message"></div>

      <div class="search-row">
        <input
          id="violationSearch"
          type="text"
          placeholder="Cari nama atau NISN..."
          oninput="filterViolations()"
        >

        <select id="violationClass" onchange="filterViolations()">
          <option value="">Semua Kelas</option>
          <option>X A</option>
          <option>X B</option>
          <option>XI A</option>
          <option>XI B</option>
          <option>XII A</option>
          <option>XII B</option>
        </select>
      </div>

      <div id="violationResults" class="student-list">
        <div class="loading">Memuat data siswa...</div>
      </div>

      <input type="hidden" id="violationStudent">

      <div id="violationSelected" class="selected"></div>

      <div class="form-group">
        <label for="violationPoints">Jumlah Poin</label>
        <input

    function formatTanggalIndonesia(value) {

  if (!value) {
    return "-";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return new Intl.DateTimeFormat(
    "id-ID",
    {
      timeZone: "Asia/Jakarta",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  ).format(date);
}

async function submitGuruPassword() {

  const currentPassword =
    document.getElementById(
      "guruCurrentPassword"
    ).value;

  const newPassword =
    document.getElementById(
      "guruNewPassword"
    ).value;

  const confirmPassword =
    document.getElementById(
      "guruConfirmPassword"
    ).value;

  // =========================
  // VALIDASI
  // =========================

  if (!currentPassword) {

    showPasswordMessage(
      "Password lama wajib diisi.",
      "error"
    );

    return;
  }

  if (!newPassword) {

    showPasswordMessage(
      "Password baru wajib diisi.",
      "error"
    );

    return;
  }

  if (newPassword.length < 6) {

    showPasswordMessage(
      "Password baru minimal 6 karakter.",
      "error"
    );

    return;
  }

  if (newPassword !== confirmPassword) {

    showPasswordMessage(
      "Konfirmasi password tidak cocok.",
      "error"
    );

    return;
  }

  if (currentPassword === newPassword) {

    showPasswordMessage(
      "Password baru harus berbeda dari password lama.",
      "error"
    );

    return;
  }

  // =========================
  // CEK SESSION
  // =========================

  if (!guruSession || !guruSession.id) {

    showPasswordMessage(
      "Sesi guru tidak ditemukan. Silakan login kembali.",
      "error"
    );

    return;
  }

  // =========================
  // TOMBOL
  // =========================

  const button =
    document.querySelector(
      ".password-submit"
    );

  button.disabled = true;
  button.textContent = "Menyimpan...";

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-change-password",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            guruId:
              guruSession.id,

            currentPassword:
              currentPassword,

            newPassword:
              newPassword

          })
        }
      );

    const raw =
      await response.text();

    let result;

    try {

      result =
        JSON.parse(raw);

    } catch (error) {

      throw new Error(
        "Response server bukan JSON."
      );

    }

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengubah password."
      );

    }

    // =========================
    // BERHASIL
    // =========================

    showPasswordMessage(
      "Password berhasil diubah.",
      "success"
    );

    document.getElementById(
      "guruCurrentPassword"
    ).value = "";

    document.getElementById(
      "guruNewPassword"
    ).value = "";

    document.getElementById(
      "guruConfirmPassword"
    ).value = "";

    setTimeout(() => {

      closeGuruPassword();

    }, 1500);

  } catch (error) {

    console.error(
      "GURU PASSWORD ERROR:",
      error
    );

    showPasswordMessage(
      error.message ||
      "Terjadi kesalahan.",
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent =
      "🔐 Simpan Password";

  }

}

  type
) {

  const message =
    document.getElementById(
      "guruPasswordMessage"
    );

  message.textContent = text;

  message.className =
    "password-message show " + type;

}

      );
    }


    guruInboxMessages =
      result.pesan || [];


    renderGuruInbox();


  } catch (error) {

    console.error(
      "LOAD GURU INBOX ERROR:",
      error
    );

    list.innerHTML = `
      <div class="empty-state">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


// =====================================================
// FORMAT TANGGAL
// =====================================================

function formatInboxDate(
  value
) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;
  }


  return new Intl.DateTimeFormat(
    "id-ID",
    {

      timeZone:
        "Asia/Jakarta",

      day:
        "2-digit",

      month:
        "long",

      year:
        "numeric"

    }
  ).format(date);
}


// =====================================================
// RENDER PESAN
// =====================================================

function renderGuruInbox() {

  const list =
    document.getElementById(
      "guruInboxList"
    );


  if (
    !guruInboxMessages.length
  ) {

    list.innerHTML = `
      <div class="empty-state">
        Belum ada pesan yang Anda kirim.
      </div>
    `;

    return;
  }


  list.innerHTML =
    guruInboxMessages
      .map(
        item => `

          <div
            class="student-item"
            style="display:block;"
          >

            <strong>
              ${escapeHtml(item.judul)}
            </strong>

            <small>
              Kepada:
              ${escapeHtml(item.siswaNama)}
              •
              ${escapeHtml(item.siswaKelas)}
            </small>

            <p style="
              margin:10px 0;
              color:var(--text-muted);
              white-space:pre-wrap;
              overflow-wrap:anywhere;
            ">
              ${escapeHtml(item.pesan)}
            </p>

            <small>
              Dikirim:
              ${formatInboxDate(item.dibuat)}
            </small>

            <div style="
              margin-top:12px;
              display:flex;
              justify-content:flex-end;
            ">

              <button
                type="button"
                class="danger-button"
                onclick="deleteGuruInbox('${escapeHtml(item.id)}')"
              >
                🗑️ Hapus
              </button>

            </div>

          </div>

        `
      )
      .join("");
}


// =====================================================
// HAPUS PESAN
// =====================================================

async function deleteGuruInbox(
  messageId
) {

  if (
    !confirm(
      "Hapus pesan ini?"
    )
  ) {

    return;
  }


  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-inbox",
        {

          method:
            "DELETE",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              id:
                messageId,

              guruId:
                guruSession.id,

              guruUsername:
                guruSession.username

            })

        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal menghapus pesan."
      );
    }


    await loadGuruInbox();


    showGuruInboxMessage(
      "Pesan berhasil dihapus.",
      "success"
    );


  } catch (error) {

    console.error(
      "DELETE GURU INBOX ERROR:",
      error
    );

    showGuruInboxMessage(
      error.message,
      "error"
    );
  }
}


// =====================================================
// MESSAGE
// =====================================================

function showGuruInboxMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "guruInboxMessage"
    );

  element.textContent =
    message;

  element.className =
    `message ${type}`;
}


// =====================================================
// TUTUP MODAL KETIKA KLIK LUAR
// =====================================================

document.addEventListener(
  "click",
  function(event) {

    const modal =
      document.getElementById(
        "guruInboxModal"
      );

    if (
      event.target === modal
    ) {

      closeGuruInbox();

    }

  }
);

    function logoutGuru() {
      sessionStorage.removeItem("lentera_guru_session");
      window.location.href = "guru-login.html";
    }

    // CLOSE MODAL ON OUTSIDE CLICK
    document.addEventListener("click", function (event) {

          modal.classList.remove("show");
        }
      });
    });

    // ========================================
// POIN SAYA
// ========================================

let myPoints = [];


async function openMyPoints() {

  const modal =
    document.getElementById(
      "myPointsModal"
    );

  modal.classList.add("show");

  await loadMyPoints();

}


function closeMyPoints() {

  document
    .getElementById(
      "myPointsModal"
    )
    .classList.remove("show");

}


async function loadMyPoints() {

  const list =
    document.getElementById("myPointsList");

  list.innerHTML =
    '<div class="loading">Memuat poin...</div>';

  if (!guruSession || !guruSession.id) {

    list.innerHTML =
      '<div class="empty-state">Sesi guru tidak ditemukan.</div>';

    return;
  }

  try {

    const params =
      new URLSearchParams({
        guruId: guruSession.id
      });

    const response =
      await fetch(
        `/.netlify/functions/guru-points?${params.toString()}`
      );

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil poin."
      );
    }

    myPoints =
      result.poin || [];

    renderMyPoints();

  } catch (error) {

    console.error(
      "LOAD MY POINTS ERROR:",
      error
    );

    list.innerHTML = `
      <div class="empty-state">
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


function renderMyPoints() {

  const list =
    document.getElementById(
      "myPointsList"
    );

  if (!myPoints.length) {

    list.innerHTML =
      `<div class="loading">
        Belum ada poin yang Anda tambahkan.
      </div>`;

    return;

  }

  list.innerHTML =
    myPoints.map(point => {

      const jenis =
        String(point.jenis || "")
          .toLowerCase();

      const isReward =
        jenis === "penghargaan";

      return `

        <div class="student">

          <div class="student-name">

            ${escapeHtml(
              point.siswaNama ||
              point.siswaId ||
              "-"
            )}

          </div>

          <div class="student-info">

            ${escapeHtml(
              point.siswaKelas || "-"
            )}

            ·

            ${escapeHtml(
              point.siswaNisn || "-"
            )}

          </div>

          <div class="points">

            <span class="badge ${
              isReward ? "" : "red"
            }">

              ${
                isReward
                  ? "🏆 Penghargaan"
                  : "⚠️ Pelanggaran"
              }

              · ${Number(point.poin || 0)}

            </span>

          </div>

          <div
            class="student-info"
            style="margin-top:10px;"
          >

            ${escapeHtml(
              point.keterangan || "-"
            )}

          </div>

          <div
            class="student-info"
            style="margin-top:6px;"
          >

            📅 ${
              escapeHtml(
                formatTanggalIndonesia(
                  point.tanggal
                )
              )
            }

          </div>

          <div
            style="
              display:flex;
              gap:8px;
              margin-top:12px;
            "
          >

            <button
              type="button"
              class="submit"
              style="flex:1;"
              onclick="editMyPoint('${escapeHtml(point.id)}')"
            >
              ✏️ Edit
            </button>

            <button
              type="button"
              class="submit red"
              style="flex:1;"
              onclick="deleteMyPoint('${escapeHtml(point.id)}')"
            >
              🗑️ Hapus
            </button>

          </div>

        </div>

      `;

    }).join("");

}


async function editMyPoint(id) {

  const point =
    myPoints.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!point) {
    return;
  }

  const jenis =
    prompt(
      "Jenis poin:\n\n1 = Penghargaan\n2 = Pelanggaran",
      String(point.jenis).toLowerCase() ===
      "pelanggaran"
        ? "2"
        : "1"
    );

  if (jenis === null) {
    return;
  }

  let jenisValue;

  if (jenis === "1") {

    jenisValue =
      "penghargaan";

  } else if (jenis === "2") {

    jenisValue =
      "pelanggaran";

  } else {

    alert(
      "Pilihan jenis tidak valid."
    );

    return;

  }

  const poin =
    prompt(
      "Jumlah poin:",
      point.poin
    );

  if (poin === null) {
    return;
  }

  const nilai =
    Number(poin);

  if (
    !Number.isInteger(nilai) ||
    nilai < 1 ||
    nilai > 100
  ) {

    alert(
      "Poin harus berupa angka 1 sampai 100."
    );

    return;

  }

  const keterangan =
    prompt(
      "Keterangan:",
      point.keterangan || ""
    );

  if (keterangan === null) {
    return;
  }

  if (!keterangan.trim()) {

    alert(
      "Keterangan wajib diisi."
    );

    return;

  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-points",
        {

          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            id: point.id,

            jenis:
              jenisValue,

            poin:
              nilai,

            keterangan:
              keterangan.trim(),

            guruUsername:
              guruSession.username

          })

        }
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal mengedit poin."
      );

    }

    showMessage(
      "myPointsMessage",
      "Poin berhasil diperbarui.",
      "success"
    );

    await loadMyPoints();

  } catch (error) {

    console.error(error);

    showMessage(
      "myPointsMessage",
      error.message,
      "error"
    );

  }

}


async function deleteMyPoint(id) {

  const point =
    myPoints.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!point) {
    return;
  }

  const yakin =
    confirm(
      "Hapus poin ini?\n\n" +
      (point.keterangan || "")
    );

  if (!yakin) {
    return;
  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/guru-points",
        {

          method: "DELETE",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            id:
              point.id,

            guruUsername:
              guruSession.username

          })

        }
      );

    const result =
      await response.json();

    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Gagal menghapus poin."
      );

    }

    showMessage(
      "myPointsMessage",
      "Poin berhasil dihapus.",
      "success"
    );

    await loadMyPoints();

  } catch (error) {

    console.error(error);

    showMessage(
      "myPointsMessage",
      error.message,
      "error"
    );

  }

}
