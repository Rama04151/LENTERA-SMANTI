<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guru - LENTERA SMANTI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <main class="container">

    <section class="card">

      <h1>
        👨‍🏫 Panel Guru
      </h1>

      <p
        id="guruWelcome"
        class="subtitle"
      ></p>

      <div
        style="
          padding:15px;
          border-radius:12px;
          background:rgba(255,255,255,0.05);
          margin-top:20px;
        "
      >

        <strong>
          ✅ Login Guru berhasil
        </strong>

        <p
          id="guruInfo"
          style="
            margin-top:8px;
            line-height:1.7;
          "
        ></p>

      </div>

      <button
        type="button"
        onclick="logoutGuru()"
        style="margin-top:20px;"
      >
        🚪 Keluar
      </button>

    </section>

  </main>


  <script>

    const session =
      sessionStorage.getItem(
        "lentera_guru_session"
      );


    if (!session) {

      window.location.href =
        "guru-login.html";

    }


    let guru;

    try {

      guru =
        JSON.parse(session);

    }
    catch (error) {

      sessionStorage.removeItem(
        "lentera_guru_session"
      );

      window.location.href =
        "guru-login.html";

    }


    if (guru) {

      document
        .getElementById(
          "guruWelcome"
        )
        .textContent =
        "Selamat datang, " +
        guru.nama;


      document
        .getElementById(
          "guruInfo"
        )
        .innerHTML = `
          Nama: <strong>${guru.nama}</strong><br>
          Username: <strong>${guru.username}</strong><br>
          ID Guru: <strong>${guru.id}</strong><br>
          Role: <strong>${guru.role}</strong>
        `;

    }


    function logoutGuru() {

      sessionStorage.removeItem(
        "lentera_guru_session"
      );

      window.location.href =
        "guru-login.html";

    }

  </script>

</body>

</html>
