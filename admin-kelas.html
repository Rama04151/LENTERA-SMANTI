<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Data Kelas - LENTERA SMANTI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🏫 Data Kelas</h1>

    <p>
      Kelola dan lihat jumlah siswa setiap kelas.
    </p>

    <button
      type="button"
      class="logout-button"
      onclick="window.location.href='admin.html'"
    >
      ← Kembali
    </button>

    <div
      id="classList"
      style="margin-top:20px;"
    >
      <p>Memuat data kelas...</p>
    </div>

    <div
      id="classMessage"
      style="margin-top:15px;"
    ></div>

  </div>


  <script>

    // =========================
    // CEK LOGIN ADMIN
    // =========================

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {

      window.location.href =
        "admin-login.html";

    }


    // =========================
    // LOAD DATA KELAS
    // =========================

    async function loadClasses() {

      const classList =
        document.getElementById(
          "classList"
        );

      const message =
        document.getElementById(
          "classMessage"
        );

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-classes"
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          !result.success
        ) {

          classList.innerHTML =
            "<p>Data kelas gagal dimuat.</p>";

          return;

        }

        renderClasses(
          result.kelas
        );

      } catch (error) {

        console.error(
          "LOAD CLASSES ERROR:",
          error
        );

        message.textContent =
          "Terjadi kesalahan koneksi.";

      }

    }


    // =========================
    // TAMPILKAN DATA KELAS
    // =========================

    function renderClasses(data) {

      const classList =
        document.getElementById(
          "classList"
        );

      if (!data || data.length === 0) {

        classList.innerHTML =
          "<p>Belum ada data kelas.</p>";

        return;

      }

      classList.innerHTML =
        data.map((kelas) => `

          <div
            class="history-section"
            style="margin-bottom:15px;"
          >

            <h2>
              🏫 ${escapeHtml(kelas.nama)}
            </h2>

            <p>
              <strong>Tingkat:</strong>
              ${escapeHtml(kelas.tingkat)}
            </p>

            <p>
              <strong>Status:</strong>
              ${escapeHtml(kelas.status)}
            </p>

            <p>
              <strong>Jumlah Siswa:</strong>
              ${kelas.jumlahSiswa} siswa
            </p>

          </div>

        `).join("");

    }


    // =========================
    // ESCAPE HTML
    // =========================

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // =========================
    // JALANKAN
    // =========================

    loadClasses();

  </script>

</body>

</html>
