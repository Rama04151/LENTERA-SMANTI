<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Siswa - LENTERA SMANTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b132b;
      --card-bg: #1c2541;
      --accent-gold: #fbc02d;
      --accent-gold-hover: #f57f17;
      --gold-glow: rgba(251, 192, 45, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(11, 19, 43, 0.7);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(251, 192, 45, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(28, 37, 65, 0.6) 0%, transparent 50%);
    }

    .dashboard-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .dashboard-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    /* Header */
    .dashboard-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-small {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-weight: 800;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .dashboard-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .dashboard-header p {
      font-size: 13px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    /* Top Action Buttons Grid */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    /* Welcome Banner */
    .welcome {
      margin-top: 20px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, rgba(251, 192, 45, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(251, 192, 45, 0.2);
      padding: 16px 20px;
      border-radius: 16px;
    }

    .welcome p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .welcome h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-top: 2px;
    }

    /* Search & Inputs */
    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Loading Indicator */
    #loading {
      text-align: center;
      padding: 20px;
      color: var(--accent-gold);
      font-size: 14px;
      font-weight: 500;
    }

    /* Student Item Cards */
    #studentList {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .history-section {
      background: rgba(11, 19, 43, 0.5);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border-color);
    }

    .history-section h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .history-section p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .history-section strong {
      color: var(--text-main);
    }

    /* Student Actions Dropdown / Details */
    .student-actions {
      margin-top: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .student-actions summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-gold);
      user-select: none;
      outline: none;
    }

    .student-actions summary:hover {
      text-decoration: underline;
    }

    .student-actions div {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Buttons */
    .logout-button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    .logout-button:hover {
      background: linear-gradient(135deg, #ffd54f, var(--accent-gold));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 192, 45, 0.4);
    }

    .logout-button:active {
      transform: translateY(0);
    }

    .logout-button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--border-color);
    }

    .logout-button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .logout-button.danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: none;
    }

    .logout-button.danger:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
    }

    /* Modal Overlay & Card Styling */
    #studentModal, .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #studentModal .history-section,
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-content h2, #studentModal h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 16px;
    }

    .modal-content label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .modal-actions button {
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .modal-actions button:first-child {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .modal-actions button:last-child {
      background: linear-gradient(135deg, var(--accent-gold), #d48806);
      color: #0b132b;
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    #formMessage, #moveMessage {
      font-size: 12px;
      color: var(--danger-color);
      margin-top: 10px;
      text-align: center;
    }

    /* =========================
   PASSWORD MODAL
   ========================= */

.password-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(6px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
  z-index: 9999;

  animation: passwordFadeIn 0.2s ease;
}

.password-modal {
  width: 100%;
  max-width: 390px;

  background: #ffffff;
  border-radius: 24px;

  padding: 30px 25px 25px;

  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.25);

  text-align: center;

  animation: passwordSlideUp 0.25s ease;
}

.password-icon {
  width: 64px;
  height: 64px;

  margin: 0 auto 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #eef4ff;
  border-radius: 20px;

  font-size: 30px;
}

.password-modal h2 {
  margin: 0;

  font-size: 22px;
  font-weight: 700;
  color: #172033;
}

.password-subtitle {
  margin: 6px 0 20px;

  font-size: 13px;
  color: #7b8497;
}

.password-student {
  background: #f7f9fc;

  border-radius: 14px;

  padding: 13px;

  margin-bottom: 15px;

  text-align: left;
}

.password-student strong {
  display: block;

  font-size: 14px;
  color: #172033;

  margin-bottom: 4px;
}

.password-student span {
  display: block;

  font-size: 12px;
  color: #7b8497;
}

.password-box {
  display: flex;
  align-items: center;

  gap: 8px;

  background: #f3f6fa;

  border: 1px solid #e2e7ef;

  border-radius: 14px;

  padding: 5px 6px 5px 15px;

  margin-bottom: 18px;
}

.password-box span {
  flex: 1;

  text-align: left;

  font-family: monospace;
  font-size: 15px;
  font-weight: 600;

  color: #172033;

  overflow-wrap: anywhere;
}

.password-box button {
  width: 42px;
  height: 42px;

  flex-shrink: 0;

  border: none;
  border-radius: 11px;

  background: #ffffff;

  cursor: pointer;

  font-size: 18px;

  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

  transition: 0.2s;
}

.password-box button:hover {
  transform: translateY(-1px);
}

.password-box button:active {
  transform: scale(0.94);
}

.password-close {
  width: 100%;

  border: none;
  border-radius: 13px;

  padding: 12px;

  background: #172033;
  color: white;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  transition: 0.2s;
}

.password-close:hover {
  background: #27344d;
}

@keyframes passwordFadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes passwordSlideUp {
  from {
    opacity: 0;
    transform: translateY(15px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
  </style>
</head>

<body>

  <main class="dashboard-container">

    <section class="dashboard-card">

      <div class="dashboard-header">
        <div class="logo-small">L</div>

        <div>
          <h1>LENTERA SMANTI</h1>
          <p>Data Siswa</p>
        </div>
      </div>

      <div class="action-grid">
        <button
          type="button"
          class="logout-button"
          onclick="openAddStudent()"
        >
          ➕ Tambah Siswa
        </button>

        <button
          type="button"
          class="logout-button secondary"
          onclick="window.location.href='admin-import.html'"
        >
          📥 Import Massal
        </button>
      </div>

      <div class="welcome">
        <p>Admin Panel</p>
        <h2>Kelola Data Siswa</h2>
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama atau NISN..."
      >

      <div id="loading">
        Memuat data siswa...
      </div>

      <div id="studentList"></div>

      <button
        type="button"
        class="logout-button secondary"
        onclick="window.location.href='admin.html'"
        style="margin-top: 10px;"
      >
        ← Kembali
      </button>

    </section>

  </main>

  <!-- MODAL TAMBAH / EDIT SISWA -->
  <div id="studentModal" style="display:none;">

    <div class="history-section">

      <h3 id="modalTitle">
        Tambah Siswa
      </h3>

      <input
        type="hidden"
        id="editId"
      >

      <input
        type="text"
        id="formNisn"
        placeholder="NISN"
      >

      <input
        type="text"
        id="formNama"
        placeholder="Nama siswa"
      >

      <select id="formKelas">
        <option value="">
          Pilih kelas
        </option>
        <option value="K001">X A</option>
        <option value="K002">X B</option>
        <option value="K003">XI A</option>
        <option value="K004">XI B</option>
        <option value="K005">XII A</option>
        <option value="K006">XII B</option>
      </select>

      <input
        type="text"
        id="formPassword"
        placeholder="Password"
      >

      <select id="formStatus">
        <option value="Aktif">
          Aktif
        </option>
        <option value="Nonaktif">
          Nonaktif
        </option>
      </select>

      <div class="modal-actions">
        <button
          type="button"
          onclick="closeStudentModal()"
        >
          Batal
        </button>

        <button
          type="button"
          onclick="saveStudent()"
        >
          Simpan
        </button>
      </div>

      <p id="formMessage"></p>

    </div>

  </div>

  <!-- MODAL PINDAHKAN SISWA -->
  <div
    id="moveModal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-content">

      <h2>🔄 Pindahkan Siswa</h2>

      <p id="moveStudentName" style="color: var(--accent-gold); font-weight: 600; margin-bottom: 12px;">
        -
      </p>

      <input
        type="hidden"
        id="moveStudentId"
      >

      <label>
        Kelas Tujuan
      </label>

      <select id="moveKelas">
        <option value="">
          -- Pilih Kelas --
        </option>
        <option value="K001">X A</option>
        <option value="K002">X B</option>
        <option value="K003">XI A</option>
        <option value="K004">XI B</option>
        <option value="K005">XII A</option>
        <option value="K006">XII B</option>
      </select>

      <label>
        Alasan Pemindahan
      </label>

      <textarea
        id="moveAlasan"
        placeholder="Contoh: Naik kelas, pindah rombel, dll."
      ></textarea>

      <div id="moveMessage"></div>

      <div class="modal-actions">
        <button
          type="button"
          onclick="closeMoveStudent()"
        >
          Batal
        </button>

        <button
          type="button"
          onclick="moveStudent()"
        >
          🔄 Pindahkan
        </button>
      </div>

    </div>

  </div>

  <script>

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {
      window.location.replace(
        "admin-login.html"
      );
    }

    let students = [];

    async function loadStudents() {

      const loading =
        document.getElementById("loading");

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students"
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message
          );
        }

        students = result.siswa;

        loading.style.display = "none";

        renderStudents(students);

      } catch (error) {

        console.error(error);

        loading.textContent =
          "Data siswa gagal dimuat.";
      }
    }

    function renderStudents(data) {

      const studentList =
        document.getElementById("studentList");

      if (data.length === 0) {

        studentList.innerHTML =
          "<p style='text-align:center; color: var(--text-muted); padding: 20px;'>Siswa tidak ditemukan.</p>";

        return;
      }

      studentList.innerHTML =
        data.map((siswa) => `

          <div class="history-section">

            <h3>
              ${escapeHtml(siswa.nama)}
            </h3>

            <p>
              <strong>NISN:</strong>
              ${escapeHtml(siswa.nisn)}
            </p>

            <p>
              <strong>Kelas:</strong>
              ${escapeHtml(siswa.kelas)}
            </p>

            <p>
              <strong>Status:</strong>
              <span style="color: ${siswa.status.toLowerCase() === 'aktif' ? 'var(--success-color)' : 'var(--danger-color)'}; font-weight: 600;">
                ${escapeHtml(siswa.status)}
              </span>
            </p>

            <details class="student-actions">
              <summary>
                ⚙️ Aksi Siswa
              </summary>

              <div style="margin-top:10px;">

                <button
                  type="button"
                  class="logout-button secondary"
                  onclick="openEditStudent('${escapeHtml(siswa.id)}')"
                >
                  ✏️ Edit
                </button>

                <button
                  type="button"
                  class="logout-button secondary"
                  onclick="openMoveStudent('${escapeHtml(siswa.id)}')"
                >
                  🔄 Pindahkan
                </button>

                <button
                  type="button"
                  class="logout-button secondary"
                  onclick="resetStudentPassword('${escapeHtml(siswa.id)}')"
                >
                  🔑 Reset Password
                </button>

                <button
  type="button"
  class="logout-button secondary"
  onclick="viewStudentPassword('${escapeHtml(siswa.id)}')"
>
  👁️ Lihat Password
</button>

                <button
                  type="button"
                  class="logout-button secondary"
                  onclick="toggleStudentStatus('${escapeHtml(siswa.id)}')"
                >
                  ${siswa.status.toLowerCase() === "aktif"
                    ? "⛔ Nonaktifkan"
                    : "✅ Aktifkan"}
                </button>

                <button
                  type="button"
                  class="logout-button danger"
                  onclick="deleteStudent('${escapeHtml(siswa.id)}')"
                >
                  🗑️ Hapus Siswa
                </button>

              </div>
            </details>

          </div>

        `).join("");
    }

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          students.filter((siswa) =>
            siswa.nama
              .toLowerCase()
              .includes(keyword) ||
            siswa.nisn
              .toLowerCase()
              .includes(keyword)
          );

        renderStudents(filtered);
      });

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadStudents();

    function openAddStudent() {

      document.getElementById("modalTitle")
        .textContent = "Tambah Siswa";

      document.getElementById("editId")
        .value = "";

      document.getElementById("formNisn")
        .value = "";

      document.getElementById("formNama")
        .value = "";

      document.getElementById("formKelas")
        .value = "";

      document.getElementById("formPassword")
        .value = "";

      document.getElementById("formPassword")
        .placeholder = "Password";

      document.getElementById("formStatus")
        .value = "Aktif";

      document.getElementById("formMessage")
        .textContent = "";

      document.getElementById("studentModal")
        .style.display = "flex";
    }

    function closeStudentModal() {

      document.getElementById("studentModal")
        .style.display = "none";
    }

    async function saveStudent() {

      const id =
        document.getElementById("editId").value;

      const nisn =
        document.getElementById("formNisn")
          .value.trim();

      const nama =
        document.getElementById("formNama")
          .value.trim();

      const kelasId =
        document.getElementById("formKelas")
          .value;

      const password =
        document.getElementById("formPassword")
          .value;

      const status =
        document.getElementById("formStatus")
          .value;

      const message =
        document.getElementById("formMessage");

      if (!nisn || !nama || !kelasId) {

        message.textContent =
          "NISN, nama, dan kelas wajib diisi.";

        return;
      }

      message.textContent =
        "Menyimpan...";

      try {

        const method =
          id ? "PUT" : "POST";

        const body = {
          id,
          nisn,
          nama,
          kelasId,
          status
        };

        if (password) {
          body.password = password;
        }

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method,

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify(body)
            }
          );

        const result =
          await response.json();

        if (!result.success) {

          message.textContent =
            result.message ||
            "Gagal menyimpan data.";

          return;
        }

        closeStudentModal();

        await loadStudents();

      } catch (error) {

        console.error(error);

        message.textContent =
          "Tidak dapat terhubung ke server.";
      }
    }

    function openEditStudent(id) {

      const siswa =
        students.find(
          (item) => item.id === id
        );

      if (!siswa) {
        return;
      }

      document.getElementById("modalTitle")
        .textContent = "Edit Siswa";

      document.getElementById("editId")
        .value = siswa.id;

      document.getElementById("formNisn")
        .value = siswa.nisn;

      document.getElementById("formNama")
        .value = siswa.nama;

      document.getElementById("formKelas")
        .value = siswa.kelasId;

      document.getElementById("formPassword")
        .value = "";

      document.getElementById("formPassword")
        .placeholder =
          "Kosongkan jika tidak ubah password";

      document.getElementById("formStatus")
        .value = siswa.status;

      document.getElementById("formMessage")
        .textContent = "";

      document.getElementById("studentModal")
        .style.display = "flex";
    }

    async function toggleStudentStatus(id) {

      const siswa =
        students.find(
          (item) => item.id === id
        );

      if (!siswa) {
        return;
      }

      const aktif =
        siswa.status.toLowerCase() === "aktif";

      const actionText =
        aktif
          ? "menonaktifkan"
          : "mengaktifkan";

      const confirmed =
        confirm(
          `Yakin ingin ${actionText} siswa ${siswa.nama}?`
        );

      if (!confirmed) {
        return;
      }

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                id,
                action: "toggle_status"
              })
            }
          );

        const result =
          await response.json();

        if (!result.success) {

          alert(
            result.message ||
            "Gagal mengubah status."
          );

          return;
        }

        alert(result.message);

        await loadStudents();

      } catch (error) {

        console.error(error);

        alert(
          "Tidak dapat terhubung ke server."
        );
      }
    }

    async function resetStudentPassword(id) {

      const siswa =
        students.find(
          (item) => item.id === id
        );

      if (!siswa) {
        return;
      }

      const newPassword =
        prompt(
          `Masukkan password baru untuk ${siswa.nama}:`
        );

      if (newPassword === null) {
        return;
      }

      if (!newPassword.trim()) {

        alert(
          "Password tidak boleh kosong."
        );

        return;
      }

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                id,
                action: "reset_password",
                password: newPassword
              })
            }
          );

        const result =
          await response.json();

        if (!result.success) {

          alert(
            result.message ||
            "Gagal reset password."
          );

          return;
        }

        alert(
          "Password berhasil direset."
        );

      } catch (error) {

        console.error(error);

        alert(
          "Tidak dapat terhubung ke server."
        );
      }
    }

    // =========================
    // PINDAHKAN SISWA
    // =========================

    function openMoveStudent(id) {

      const student =
        students.find(
          s => String(s.id) === String(id)
        );

      if (!student) {
        alert("Data siswa tidak ditemukan.");
        return;
      }

      document.getElementById(
        "moveStudentId"
      ).value = student.id;

      document.getElementById(
        "moveStudentName"
      ).textContent =
        `${student.nama} — ${student.kelas}`;

      document.getElementById(
        "moveKelas"
      ).value = "";

      document.getElementById(
        "moveAlasan"
      ).value = "";

      document.getElementById(
        "moveMessage"
      ).textContent = "";

      document.getElementById(
        "moveModal"
      ).style.display = "flex";
    }

    function closeMoveStudent() {

      document.getElementById(
        "moveModal"
      ).style.display = "none";
    }

    async function moveStudent() {

      const id =
        document.getElementById(
          "moveStudentId"
        ).value;

      const kelasId =
        document.getElementById(
          "moveKelas"
        ).value;

      const alasan =
        document.getElementById(
          "moveAlasan"
        ).value.trim();

      const message =
        document.getElementById(
          "moveMessage"
        );

      if (!kelasId) {

        message.textContent =
          "Pilih kelas tujuan terlebih dahulu.";

        return;
      }

      const adminSession =
        sessionStorage.getItem(
          "lentera_admin_session"
        );

      let admin = "";

      if (adminSession) {

        try {

          const session =
            JSON.parse(adminSession);

          admin =
            session.username || "";

        } catch (error) {

          console.error(
            "ADMIN SESSION ERROR:",
            error
          );
        }
      }

      message.textContent =
        "Memproses pemindahan...";

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                id,
                action: "move_student",
                kelasId,
                alasan,
                admin
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok || !result.success) {

          message.textContent =
            result.message ||
            "Gagal memindahkan siswa.";

          return;
        }

        alert(result.message);

        closeMoveStudent();

        await loadStudents();

      } catch (error) {

        console.error(
          "MOVE STUDENT ERROR:",
          error
        );

        message.textContent =
          "Terjadi kesalahan koneksi.";
      }
    }

    // =========================
    // HAPUS SISWA
    // =========================

    async function deleteStudent(id) {

      const siswa =
        students.find(
          s => String(s.id) === String(id)
        );

      if (!siswa) {
        alert("Data siswa tidak ditemukan.");
        return;
      }

      const yakin = confirm(
        `Yakin ingin menghapus siswa?\n\n` +
        `Nama: ${siswa.nama}\n` +
        `NISN: ${siswa.nisn}\n` +
        `Kelas: ${siswa.kelas}\n\n` +
        `Tindakan ini akan menghapus data siswa dari daftar siswa.`
      );

      if (!yakin) {
        return;
      }

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students",
            {
              method: "DELETE",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                id: siswa.id
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok || !result.success) {

          alert(
            result.message ||
            "Gagal menghapus siswa."
          );

          return;
        }

        alert(
          "Siswa berhasil dihapus."
        );

        await loadStudents();

      } catch (error) {

        console.error(
          "DELETE STUDENT ERROR:",
          error
        );

        alert(
          "Tidak dapat terhubung ke server."
        );
      }
    }

    // =========================
// LIHAT PASSWORD SISWA
// =========================

function viewStudentPassword(id) {

  const siswa = students.find(
    s => String(s.id) === String(id)
  );

  if (!siswa) {
    alert("Data siswa tidak ditemukan.");
    return;
  }

  const password = siswa.password || "";

  if (!password) {
    alert("Password siswa tidak tersedia.");
    return;
  }

  // Hapus modal lama jika ada
  const oldModal = document.getElementById("passwordModal");
  if (oldModal) oldModal.remove();

  const modal = document.createElement("div");

  modal.id = "passwordModal";

  modal.innerHTML = `
    <div class="password-overlay" onclick="closePasswordModal(event)">
      
      <div class="password-modal" onclick="event.stopPropagation()">

        <div class="password-icon">
          🔐
        </div>

        <h2>Password Siswa</h2>

        <p class="password-subtitle">
          Informasi akun siswa
        </p>

        <div class="password-student">
          <strong>${escapeHtml(siswa.nama)}</strong>
          <span>${escapeHtml(siswa.nisn)} • ${escapeHtml(siswa.kelas)}</span>
        </div>

        <div class="password-box">

          <span id="studentPassword">
            ${escapeHtml(password)}
          </span>

          <button
            type="button"
            onclick="copyStudentPassword()"
            title="Salin password"
          >
            📋
          </button>

        </div>

        <button
          type="button"
          class="password-close"
          onclick="closePasswordModal()"
        >
          Tutup
        </button>

      </div>

    </div>
  `;

  document.body.appendChild(modal);
}


// =========================
// TUTUP MODAL PASSWORD
// =========================

function closePasswordModal(event) {

  if (
    event &&
    event.target &&
    !event.target.classList.contains("password-overlay")
  ) {
    return;
  }

  const modal = document.getElementById("passwordModal");

  if (modal) {
    modal.remove();
  }
}


// =========================
// COPY PASSWORD
// =========================

function copyStudentPassword() {

  const passwordElement =
    document.getElementById("studentPassword");

  if (!passwordElement) return;

  const password =
    passwordElement.textContent.trim();

  navigator.clipboard.writeText(password)
    .then(() => {

      const button =
        document.querySelector(
          ".password-box button"
        );

      if (button) {
        button.textContent = "✅";

        setTimeout(() => {
          button.textContent = "📋";
        }, 1500);
      }

    })
    .catch(() => {
      alert("Gagal menyalin password.");
    });
}
  </script>
