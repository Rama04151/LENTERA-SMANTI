<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Siswa - LENTERA SMANTI</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="dashboard-container">

    <section class="dashboard-card">

      <div class="dashboard-header">
        <div class="logo-small">L</div>

        <div>
          <h1>LENTERA SMANTI</h1>
          <p>Data Siswa</p>
        </div>
      </div>

      <button
  type="button"
  class="logout-button"
  onclick="openAddStudent()"
>
  ➕ Tambah Siswa
</button>

      <div class="welcome">
        <p>Admin Panel</p>
        <h2>Data Siswa</h2>
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama atau NISN..."
        style="width:100%; box-sizing:border-box; margin-bottom:20px;"
      >

      <div id="loading">
        Memuat data siswa...
      </div>

      <div id="studentList"></div>

      <button
        type="button"
        class="logout-button"
        onclick="window.location.href='admin.html'"
      >
        ← Kembali
      </button>

    </section>

  </main>

  <script>

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {
      window.location.replace(
        "admin-login.html"
      );
    }

    let students = [];

    async function loadStudents() {

      const loading =
        document.getElementById("loading");

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students"
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message
          );
        }

        students = result.siswa;

        loading.style.display = "none";

        renderStudents(students);

      } catch (error) {

        console.error(error);

        loading.textContent =
          "Data siswa gagal dimuat.";
      }
    }

    function renderStudents(data) {

      const studentList =
        document.getElementById(
          "studentList"
        );

      if (data.length === 0) {

        studentList.innerHTML =
          "<p>Siswa tidak ditemukan.</p>";

        return;
      }

      studentList.innerHTML =
        data.map((siswa) => `

          <div class="history-section">

            <h3>
              ${escapeHtml(siswa.nama)}
            </h3>

            <p>
              <strong>NISN:</strong>
              ${escapeHtml(siswa.nisn)}
            </p>

            <p>
              <strong>Kelas:</strong>
              ${escapeHtml(siswa.kelas)}
            </p>

            <p>
              <strong>Status:</strong>
              ${escapeHtml(siswa.status)}
            </p>

          </div>

        `).join("");
    }

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          students.filter((siswa) =>
            siswa.nama
              .toLowerCase()
              .includes(keyword) ||
            siswa.nisn
              .toLowerCase()
              .includes(keyword)
          );

        renderStudents(filtered);
      });

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadStudents();

  </script>

</body>
</html>
