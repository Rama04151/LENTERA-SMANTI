<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Siswa - LENTERA SMANTI</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="dashboard-container">

    <section class="dashboard-card">

      <div class="dashboard-header">
        <div class="logo-small">L</div>

        <div>
          <h1>LENTERA SMANTI</h1>
          <p>Data Siswa</p>
        </div>
      </div>

      <button
  type="button"
  class="logout-button"
  onclick="openAddStudent()"
>
  ➕ Tambah Siswa
</button>

      <div class="welcome">
        <p>Admin Panel</p>
        <h2>Data Siswa</h2>
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama atau NISN..."
        style="width:100%; box-sizing:border-box; margin-bottom:20px;"
      >

      <div id="loading">
        Memuat data siswa...
      </div>

      <div id="studentList"></div>

      <button
        type="button"
        class="logout-button"
        onclick="window.location.href='admin.html'"
      >
        ← Kembali
      </button>

    </section>

  </main>

  <div id="studentModal" style="display:none;">

  <div class="history-section">

    <h3 id="modalTitle">
      Tambah Siswa
    </h3>

    <input
      type="hidden"
      id="editId"
    >

    <input
      type="text"
      id="formNisn"
      placeholder="NISN"
    >

    <input
      type="text"
      id="formNama"
      placeholder="Nama siswa"
    >

    <select id="formKelas">

      <option value="">
        Pilih kelas
      </option>

      <option value="K001">X A</option>
      <option value="K002">X B</option>
      <option value="K003">XI A</option>
      <option value="K004">XI B</option>
      <option value="K005">XII A</option>
      <option value="K006">XII B</option>

    </select>

    <input
      type="text"
      id="formPassword"
      placeholder="Password"
    >

    <select id="formStatus">

      <option value="Aktif">
        Aktif
      </option>

      <option value="Nonaktif">
        Nonaktif
      </option>

    </select>

    <button
      type="button"
      class="logout-button"
      onclick="saveStudent()"
    >
      Simpan
    </button>

    <button
      type="button"
      class="logout-button"
      onclick="closeStudentModal()"
    >
      Batal
    </button>

    <p id="formMessage"></p>

  </div>

</div>

  <script>

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {
      window.location.replace(
        "admin-login.html"
      );
    }

    let students = [];

    async function loadStudents() {

      const loading =
        document.getElementById("loading");

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students"
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message
          );
        }

        students = result.siswa;

        loading.style.display = "none";

        renderStudents(students);

      } catch (error) {

        console.error(error);

        loading.textContent =
          "Data siswa gagal dimuat.";
      }
    }

    function renderStudents(data) {

  const studentList =
    document.getElementById("studentList");

  if (data.length === 0) {

    studentList.innerHTML =
      "<p>Siswa tidak ditemukan.</p>";

    return;
  }

  studentList.innerHTML =
    data.map((siswa) => `

      <div class="history-section">

        <h3>
          ${escapeHtml(siswa.nama)}
        </h3>

        <p>
          <strong>NISN:</strong>
          ${escapeHtml(siswa.nisn)}
        </p>

        <p>
          <strong>Kelas:</strong>
          ${escapeHtml(siswa.kelas)}
        </p>

        <p>
          <strong>Status:</strong>
          ${escapeHtml(siswa.status)}
        </p>

        <button
          type="button"
          class="logout-button"
          onclick="openEditStudent('${escapeHtml(siswa.id)}')"
        >
          ✏️ Edit
        </button>

      </div>

    `).join("");
}

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          students.filter((siswa) =>
            siswa.nama
              .toLowerCase()
              .includes(keyword) ||
            siswa.nisn
              .toLowerCase()
              .includes(keyword)
          );

        renderStudents(filtered);
      });

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadStudents();

    function openAddStudent() {

  document.getElementById("modalTitle")
    .textContent = "Tambah Siswa";

  document.getElementById("editId")
    .value = "";

  document.getElementById("formNisn")
    .value = "";

  document.getElementById("formNama")
    .value = "";

  document.getElementById("formKelas")
    .value = "";

  document.getElementById("formPassword")
    .value = "";

  document.getElementById("formStatus")
    .value = "Aktif";

  document.getElementById("formMessage")
    .textContent = "";

  document.getElementById("studentModal")
    .style.display = "block";
}


function closeStudentModal() {

  document.getElementById("studentModal")
    .style.display = "none";
}


async function saveStudent() {

  const id =
    document.getElementById("editId").value;

  const nisn =
    document.getElementById("formNisn").value.trim();

  const nama =
    document.getElementById("formNama").value.trim();

  const kelasId =
    document.getElementById("formKelas").value;

  const password =
    document.getElementById("formPassword").value;

  const status =
    document.getElementById("formStatus").value;

  const message =
    document.getElementById("formMessage");

  if (!nisn || !nama || !kelasId) {

    message.textContent =
      "NISN, nama, dan kelas wajib diisi.";

    return;
  }

  message.textContent =
    "Menyimpan...";

  try {

    const method = id ? "PUT" : "POST";

    const response = await fetch(
      "/.netlify/functions/admin-students",
      {
        method,

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          id,
          nisn,
          nama,
          kelasId,
          password,
          status
        })
      }
    );

    const result =
      await response.json();

    if (!result.success) {

      message.textContent =
        result.message ||
        "Gagal menyimpan data.";

      return;
    }

    closeStudentModal();

    await loadStudents();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Tidak dapat terhubung ke server.";
  }
}

    function openEditStudent(id) {

  const siswa =
    students.find(
      (item) => item.id === id
    );

  if (!siswa) {
    return;
  }

  document.getElementById("modalTitle")
    .textContent = "Edit Siswa";

  document.getElementById("editId")
    .value = siswa.id;

  document.getElementById("formNisn")
    .value = siswa.nisn;

  document.getElementById("formNama")
    .value = siswa.nama;

  document.getElementById("formKelas")
    .value = siswa.kelasId;

  document.getElementById("formPassword")
    .value = "";

  document.getElementById("formPassword")
    .placeholder =
      "Kosongkan jika tidak ingin mengubah password";

  document.getElementById("formStatus")
    .value = siswa.status;

  document.getElementById("formMessage")
    .textContent = "";

  document.getElementById("studentModal")
    .style.display = "block";
}

  </script>

</body>
</html>
