<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Siswa - LENTERA SMANTI</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="dashboard-container">

    <section class="dashboard-card">

      <div class="dashboard-header">
        <div class="logo-small">L</div>

        <div>
          <h1>LENTERA SMANTI</h1>
          <p>Data Siswa</p>
        </div>
      </div>

      <button
  type="button"
  class="logout-button"
  onclick="openAddStudent()"
>
  ➕ Tambah Siswa
</button>

      <button
  type="button"
  class="logout-button"
  onclick="window.location.href='admin-import.html'"
>
  📥 Import Massal
</button>

      <div class="welcome">
        <p>Admin Panel</p>
        <h2>Data Siswa</h2>
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="Cari nama atau NISN..."
        style="width:100%; box-sizing:border-box; margin-bottom:20px;"
      >

      <div id="loading">
        Memuat data siswa...
      </div>

      <div id="studentList"></div>

      <button
        type="button"
        class="logout-button"
        onclick="window.location.href='admin.html'"
      >
        ← Kembali
      </button>

    </section>

  </main>

  <div id="studentModal" style="display:none;">

  <div class="history-section">

    <h3 id="modalTitle">
      Tambah Siswa
    </h3>

    <input
      type="hidden"
      id="editId"
    >

    <input
      type="text"
      id="formNisn"
      placeholder="NISN"
    >

    <input
      type="text"
      id="formNama"
      placeholder="Nama siswa"
    >

    <select id="formKelas">

      <option value="">
        Pilih kelas
      </option>

      <option value="K001">X A</option>
      <option value="K002">X B</option>
      <option value="K003">XI A</option>
      <option value="K004">XI B</option>
      <option value="K005">XII A</option>
      <option value="K006">XII B</option>

    </select>

    <input
      type="text"
      id="formPassword"
      placeholder="Password"
    >

    <select id="formStatus">

      <option value="Aktif">
        Aktif
      </option>

      <option value="Nonaktif">
        Nonaktif
      </option>

    </select>

    <button
      type="button"
      class="logout-button"
      onclick="saveStudent()"
    >
      Simpan
    </button>

    <button
      type="button"
      class="logout-button"
      onclick="closeStudentModal()"
    >
      Batal
    </button>

    <p id="formMessage"></p>

  </div>

</div>

  <!-- MODAL PINDAHKAN SISWA -->

<div
  id="moveModal"
  class="modal"
  style="display:none;"
>

  <div class="modal-content">

    <h2>🔄 Pindahkan Siswa</h2>

    <p id="moveStudentName">
      -
    </p>

    <input
      type="hidden"
      id="moveStudentId"
    >

    <label>
      Kelas Tujuan
    </label>

    <select id="moveKelas">
      <option value="">
        -- Pilih Kelas --
      </option>

      <option value="K001">
        X A
      </option>

      <option value="K002">
        X B
      </option>

      <option value="K003">
        XI A
      </option>

      <option value="K004">
        XI B
      </option>

      <option value="K005">
        XII A
      </option>

      <option value="K006">
        XII B
      </option>

    </select>

    <label>
      Alasan Pemindahan
    </label>

    <textarea
      id="moveAlasan"
      placeholder="Contoh: Naik kelas, pindah rombel, dll."
    ></textarea>

    <div
      id="moveMessage"
      style="margin-top:10px;"
    ></div>

    <div class="modal-actions">

      <button
        type="button"
        onclick="closeMoveStudent()"
      >
        Batal
      </button>

      <button
        type="button"
        onclick="moveStudent()"
      >
        🔄 Pindahkan
      </button>

    </div>

  </div>

</div>

  <script>

    const adminSession =
      sessionStorage.getItem(
        "lentera_admin_session"
      );

    if (!adminSession) {
      window.location.replace(
        "admin-login.html"
      );
    }

    let students = [];

    async function loadStudents() {

      const loading =
        document.getElementById("loading");

      try {

        const response =
          await fetch(
            "/.netlify/functions/admin-students"
          );

        const result =
          await response.json();

        if (!result.success) {
          throw new Error(
            result.message
          );
        }

        students = result.siswa;

        loading.style.display = "none";

        renderStudents(students);

      } catch (error) {

        console.error(error);

        loading.textContent =
          "Data siswa gagal dimuat.";
      }
    }

    function renderStudents(data) {

  const studentList =
    document.getElementById("studentList");

  if (data.length === 0) {

    studentList.innerHTML =
      "<p>Siswa tidak ditemukan.</p>";

    return;
  }

  studentList.innerHTML =
    data.map((siswa) => `

      <div class="history-section">

        <h3>
          ${escapeHtml(siswa.nama)}
        </h3>

        <p>
          <strong>NISN:</strong>
          ${escapeHtml(siswa.nisn)}
        </p>

        <p>
          <strong>Kelas:</strong>
          ${escapeHtml(siswa.kelas)}
        </p>

        <p>
          <strong>Status:</strong>
          ${escapeHtml(siswa.status)}
        </p>

        <button
          type="button"
          class="logout-button"
          onclick="openEditStudent('${escapeHtml(siswa.id)}')"
        >
          ✏️ Edit
        </button>

        <button
  type="button"
  class="logout-button"
  onclick="toggleStudentStatus('${escapeHtml(siswa.id)}')"
>
  ${siswa.status.toLowerCase() === "aktif"
    ? "⛔ Nonaktifkan"
    : "✅ Aktifkan"}
</button>

<button
  type="button"
  class="logout-button"
  onclick="resetStudentPassword('${escapeHtml(siswa.id)}')"
>
  🔑 Reset Password
</button>

<button
  type="button"
  class="logout-button"
  onclick="openMoveStudent('${escapeHtml(siswa.id)}')"
>
  🔄 Pindahkan
</button>

      </div>

    `).join("");
}

    document
      .getElementById("searchInput")
      .addEventListener("input", function () {

        const keyword =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          students.filter((siswa) =>
            siswa.nama
              .toLowerCase()
              .includes(keyword) ||
            siswa.nisn
              .toLowerCase()
              .includes(keyword)
          );

        renderStudents(filtered);
      });

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadStudents();

    function openAddStudent() {

  document.getElementById("modalTitle")
    .textContent = "Tambah Siswa";

  document.getElementById("editId")
    .value = "";

  document.getElementById("formNisn")
    .value = "";

  document.getElementById("formNama")
    .value = "";

  document.getElementById("formKelas")
    .value = "";

  document.getElementById("formPassword")
    .value = "";

  document.getElementById("formStatus")
    .value = "Aktif";

  document.getElementById("formMessage")
    .textContent = "";

  document.getElementById("studentModal")
    .style.display = "block";
}


function closeStudentModal() {

  document.getElementById("studentModal")
    .style.display = "none";
}


async function saveStudent() {

  const id =
    document.getElementById("editId").value;

  const nisn =
    document.getElementById("formNisn")
      .value.trim();

  const nama =
    document.getElementById("formNama")
      .value.trim();

  const kelasId =
    document.getElementById("formKelas")
      .value;

  const password =
    document.getElementById("formPassword")
      .value;

  const status =
    document.getElementById("formStatus")
      .value;

  const message =
    document.getElementById("formMessage");

  if (!nisn || !nama || !kelasId) {

    message.textContent =
      "NISN, nama, dan kelas wajib diisi.";

    return;
  }

  message.textContent =
    "Menyimpan...";

  try {

    const method =
      id ? "PUT" : "POST";

    const body = {
      id,
      nisn,
      nama,
      kelasId,
      status
    };

    // Password hanya dikirim jika diisi
    if (password) {
      body.password = password;
    }

    const response =
      await fetch(
        "/.netlify/functions/admin-students",
        {
          method,

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify(body)
        }
      );

    const result =
      await response.json();

    if (!result.success) {

      message.textContent =
        result.message ||
        "Gagal menyimpan data.";

      return;
    }

    closeStudentModal();

    await loadStudents();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Tidak dapat terhubung ke server.";
  }
}

    function openEditStudent(id) {

  const siswa =
    students.find(
      (item) => item.id === id
    );

  if (!siswa) {
    return;
  }

  document.getElementById("modalTitle")
    .textContent = "Edit Siswa";

  document.getElementById("editId")
    .value = siswa.id;

  document.getElementById("formNisn")
    .value = siswa.nisn;

  document.getElementById("formNama")
    .value = siswa.nama;

  document.getElementById("formKelas")
    .value = siswa.kelasId;

  document.getElementById("formPassword")
    .value = "";

  document.getElementById("formPassword")
    .placeholder =
      "Kosongkan jika tidak ingin mengubah password";

  document.getElementById("formStatus")
    .value = siswa.status;

  document.getElementById("formMessage")
    .textContent = "";

  document.getElementById("studentModal")
    .style.display = "block";
}

    async function toggleStudentStatus(id) {

  const siswa =
    students.find(
      (item) => item.id === id
    );

  if (!siswa) {
    return;
  }

  const aktif =
    siswa.status.toLowerCase() === "aktif";

  const actionText =
    aktif
      ? "menonaktifkan"
      : "mengaktifkan";

  const confirmed =
    confirm(
      `Yakin ingin ${actionText} siswa ${siswa.nama}?`
    );

  if (!confirmed) {
    return;
  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-students",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            id,
            action: "toggle_status"
          })
        }
      );

    const result =
      await response.json();

    if (!result.success) {

      alert(
        result.message ||
        "Gagal mengubah status."
      );

      return;
    }

    alert(result.message);

    await loadStudents();

  } catch (error) {

    console.error(error);

    alert(
      "Tidak dapat terhubung ke server."
    );
  }
}

    async function toggleStudentStatus(id) {

  const siswa =
    students.find(
      (item) => item.id === id
    );

  if (!siswa) {
    return;
  }

  const aktif =
    siswa.status.toLowerCase() === "aktif";

  const actionText =
    aktif
      ? "menonaktifkan"
      : "mengaktifkan";

  const confirmed =
    confirm(
      `Yakin ingin ${actionText} siswa ${siswa.nama}?`
    );

  if (!confirmed) {
    return;
  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-students",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            id,
            action: "toggle_status"
          })
        }
      );

    const result =
      await response.json();

    if (!result.success) {

      alert(
        result.message ||
        "Gagal mengubah status."
      );

      return;
    }

    alert(result.message);

    await loadStudents();

  } catch (error) {

    console.error(error);

    alert(
      "Tidak dapat terhubung ke server."
    );
  }
}

    async function resetStudentPassword(id) {

  const siswa =
    students.find(
      (item) => item.id === id
    );

  if (!siswa) {
    return;
  }

  const newPassword =
    prompt(
      `Masukkan password baru untuk ${siswa.nama}:`
    );

  if (newPassword === null) {
    return;
  }

  if (!newPassword.trim()) {

    alert(
      "Password tidak boleh kosong."
    );

    return;
  }

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-students",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            id,
            action: "reset_password",
            password: newPassword
          })
        }
      );

    const result =
      await response.json();

    if (!result.success) {

      alert(
        result.message ||
        "Gagal reset password."
      );

      return;
    }

    alert(
      "Password berhasil direset."
    );

  } catch (error) {

    console.error(error);

    alert(
      "Tidak dapat terhubung ke server."
    );
  }
}

    // =========================
// PINDAHKAN SISWA
// =========================

function openMoveStudent(id) {

  const student =
    students.find(
      s => String(s.id) === String(id)
    );

  if (!student) {
    alert("Data siswa tidak ditemukan.");
    return;
  }

  document.getElementById(
    "moveStudentId"
  ).value = student.id;

  document.getElementById(
    "moveStudentName"
  ).textContent =
    `${student.nama} — ${student.kelas}`;

  document.getElementById(
    "moveKelas"
  ).value = "";

  document.getElementById(
    "moveAlasan"
  ).value = "";

  document.getElementById(
    "moveMessage"
  ).textContent = "";

  document.getElementById(
    "moveModal"
  ).style.display = "flex";
}


function closeMoveStudent() {

  document.getElementById(
    "moveModal"
  ).style.display = "none";
}


async function moveStudent() {

  const id =
    document.getElementById(
      "moveStudentId"
    ).value;

  const kelasId =
    document.getElementById(
      "moveKelas"
    ).value;

  const alasan =
    document.getElementById(
      "moveAlasan"
    ).value.trim();

  const message =
    document.getElementById(
      "moveMessage"
    );

  if (!kelasId) {

    message.textContent =
      "Pilih kelas tujuan terlebih dahulu.";

    return;
  }

  const adminSession =
    sessionStorage.getItem(
      "lentera_admin_session"
    );

  let admin = "";

  if (adminSession) {

    try {

      const session =
        JSON.parse(adminSession);

      admin =
        session.username || "";

    } catch (error) {

      console.error(
        "ADMIN SESSION ERROR:",
        error
      );
    }
  }

  message.textContent =
    "Memproses pemindahan...";

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-students",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            id,
            action: "move_student",
            kelasId,
            alasan,
            admin
          })
        }
      );

    const result =
      await response.json();

    if (!response.ok || !result.success) {

      message.textContent =
        result.message ||
        "Gagal memindahkan siswa.";

      return;
    }

    alert(result.message);

    closeMoveStudent();

    // Muat ulang data siswa
    await loadStudents();

  } catch (error) {

    console.error(
      "MOVE STUDENT ERROR:",
      error
    );

    message.textContent =
      "Terjadi kesalahan koneksi.";
  }
}

  </script>

</body>
</html>
